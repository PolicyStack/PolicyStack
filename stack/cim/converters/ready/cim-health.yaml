{{- /*
Inform-only: what a siteconfig cluster on this hub needs running. The baremetal ClusterOperator
reports Disabled on a platform metal3 does not support, and stays Available without a Provisioning,
so the metal3 Deployment is checked too. A Pending assisted-service volume, from a missing default
StorageClass, shows as DeploymentsHealthy False. The Deployment and the templates live in the
MultiClusterHub's namespace.
*/ -}}
- complianceType: musthave
  objectDefinition:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: baremetalhosts.metal3.io
- complianceType: musthave
  objectDefinition:
    apiVersion: config.openshift.io/v1
    kind: ClusterOperator
    metadata:
      name: baremetal
    status:
      conditions:
        - type: Disabled
          status: "False"
- complianceType: musthave
  objectDefinition:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: metal3-baremetal-operator
      namespace: openshift-machine-api
    status:
      conditions:
        - type: Available
          status: "True"
- complianceType: musthave
  objectDefinition:
    apiVersion: agent-install.openshift.io/v1beta1
    kind: AgentServiceConfig
    metadata:
      name: agent
    status:
      conditions:
        - type: ReconcileCompleted
          status: "True"
        - type: DeploymentsHealthy
          status: "True"
{{ "{{-" }} range (lookup "operator.open-cluster-management.io/v1" "MultiClusterHub" "" "").items {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: siteconfig-controller-manager
      namespace: '{{ "{{" }} .metadata.namespace {{ "}}" }}'
    status:
      conditions:
        - type: Available
          status: "True"
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ai-cluster-templates-v1
      namespace: '{{ "{{" }} .metadata.namespace {{ "}}" }}'
{{ "{{-" }} end {{ "}}" }}
