{{- /*
Inform-only live health of the StorageCluster, kept out of the `ready` contract. These conditions
track current Ceph health and flap on any mon/OSD restart or resourceProfile change, and ACM would
pause any dependent policy each time. Nothing depends on this policy.
*/ -}}
apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: {{ .Parameters.name }}
  namespace: {{ .Parameters.namespace }}
status:
  conditions:
    - type: Available
      status: 'True'
    - type: ReconcileComplete
      status: 'True'
    - type: Progressing
      status: 'False'
    - type: Degraded
      status: 'False'
    - type: VersionMismatch
      status: 'False'
