stack:
  aap:
    enabled: false

    config:
      # Redis topology: standalone or cluster
      redisMode: standalone
      # Automation Controller is the core component; disabling it leaves little behind
      controller:
        # true skips this component
        disabled: false
      # Event-Driven Ansible
      eda:
        # true skips this component
        disabled: true
      # Ansible Lightspeed
      lightspeed:
        # true skips this component
        disabled: true
      # Automation Hub (private content repository)
      hub:
        # true skips this component
        disabled: false
        # Hub content storage
        storage:
          # none, file (RWX PVC), or s3 (NooBaa bucket via the storage policy)
          type: none
          # PVC size when type is file
          size: 10Gi
          # RWX StorageClass when type is file
          storageClass: ocs-storagecluster-cephfs
      # Give AAP the cluster CA bundle even when not using S3 storage
      customCaBundle: false

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      install:
        description: "Install and manage the Ansible Automation Platform operator"

      # Give AAP the cluster service CA and trusted CA bundle
      certs:
        enabled: false
        description: "CA bundle for AAP"
        dependencies:
          - name: install
        templates:
          ca-bundle:
            description: "Service CA and trusted CA bundle for AAP"

      # NooBaa bucket from ODF wired up as hub content storage. Requires odf on the
      # same cluster and waits for its storage cluster to be usable.
      storage:
        enabled: false
        description: "Object storage for Automation Hub content"
        dependencies:
          - name: install
          - name: ready
            element: odf
        templates:
          bucket:
            description: "NooBaa bucket and the S3 secret AAP consumes"

      instance:
        description: "Deploy the AnsibleAutomationPlatform instance"
        dependencies:
          - name: install
        templates:
          platform:
            description: "AnsibleAutomationPlatform instance"
            complianceType: mustonlyhave
            waitForOperator: aap

      # Publish an OpenShift console link to AAP
      link:
        description: "Console link to AAP"
        severity: low
        dependencies:
          - name: instance
        templates:
          aap-console:
            description: "AAP console link"

    operatorPolicies:
      aap:
        description: "Ansible Automation Platform operator"
        displayName: "Ansible Automation Platform"
        namespace: ansible-automation-platform
        operatorGroup:
          name: ansible-automation-platform
          targetNamespaces:
            - ansible-automation-platform
        subscription:
          channel: stable-2.7
          name: ansible-automation-platform-operator
        versions: []
