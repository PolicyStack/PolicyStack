name: Stable Review

# Compares every stable element with the PR's merge base, comments what changed, and sets the
# required commit status stable: success when nothing changed, otherwise pending until a maintainer
# approves the stable-change environment (docs/reference/ci.md#stable). workflow_run always runs
# this file and the gate script from the default branch, and gives fork PRs a token that can
# comment. Only check touches PR content, as data, with a read-only token; the jobs that write run
# none of it.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] PR content is only read and rendered, in a read-only job
    workflows: [Stable]
    types: [completed]

permissions: {}

# A newer push replaces the run for the commit it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  check:
    name: check
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # the pr artifact
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      found: ${{ steps.gate.outputs.found }}
      body: ${{ steps.gate.outputs.body }}
    steps:
      # The default branch: the gate and the validator that run here are never the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr
          path: ${{ runner.temp }}/pr # outside the checkout
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact is the PR's: trust the number only once the PR's head is this run's commit.
      - name: Fetch the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(cat "$RUNNER_TEMP/pr/pr")
          [[ $pr =~ ^[0-9]+$ ]] || { echo "::error::The pr artifact is not a PR number."; exit 1; }
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          [ "$head" = "$SHA" ] || { echo "::error::PR #$pr is at $head, not $SHA. A newer push has its own run."; exit 1; }
          git fetch -q origin "refs/pull/$pr/head"
          [ "$(git rev-parse FETCH_HEAD)" = "$SHA" ]
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: go helm

      - run: make -C tools/validator build

      - name: Compare stable elements
        id: gate
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/stable-gate.sh "$(git merge-base HEAD "$SHA")" "$SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.found == 'true'
        with:
          path: ${{ runner.temp }}/stable-gate/stable-gate.patch
          archive: false
          if-no-files-found: ignore

  report:
    name: report
    needs: check
    if: always() && needs.check.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Set the stable status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.check.result }}
          FOUND: ${{ needs.check.outputs.found }}
        run: |
          case $RESULT/$FOUND in
            success/false) state=success text="No stable element changes" ;;
            success/true) state=pending text="Waiting for a maintainer to sign off" ;;
            *) state=failure text="The stable check failed, see the run" ;;
          esac
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context=stable \
            -f description="$text" -f target_url="$RUN_URL" > /dev/null

      # No change, no comment: an earlier one is deleted.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: needs.check.result == 'success'
        with:
          header: stable
          number_force: ${{ needs.check.outputs.pr }}
          message: ${{ needs.check.outputs.body }}
          delete: ${{ needs.check.outputs.found != 'true' }}

  # Waits for a required reviewer of the stable-change environment. Prevent self-review stops whoever
  # triggered the run, the last pusher, from approving; this job also refuses the PR's author, for a
  # PR someone else pushed to last.
  sign-off:
    name: sign-off
    needs: [check, report]
    if: needs.check.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: stable-change
    permissions:
      actions: read # who approved
      pull-requests: read # the PR's author
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.check.outputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A job naming an environment that doesn't exist creates it unprotected, and would pass here
          # unreviewed. Fail closed: the status stays pending.
          rules=$(gh api "repos/$REPO/environments/stable-change" --jq '[.protection_rules[] | select(.type == "required_reviewers" and .prevent_self_review)] | length')
          [ "$rules" -gt 0 ] || { echo "::error::stable-change needs required reviewers with self-review prevented (docs/reference/ci.md#stable)."; exit 1; }
          who=$(gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" \
            --jq '[.[] | select(.state == "approved" and any(.environments[]; .name == "stable-change")) | .user.login] | last // ""')
          author=$(gh api "repos/$REPO/pulls/$PR" --jq .user.login)
          [ -n "$who" ] || { echo "::error::No approval of stable-change on this run."; exit 1; }
          [ "$who" != "$author" ] || { echo "::error::$who wrote PR #$PR and can't sign it off. Re-run the job and have another maintainer approve."; exit 1; }
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=stable \
            -f description="Signed off by $who" -f target_url="$RUN_URL" > /dev/null
