{{- /* Requests a NooBaa bucket from ODF for AAP's hub content storage. */ -}}
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: aap-bucket-odf
  namespace: ansible-automation-platform
spec:
  generateBucketName: aap-bucket-odf
  storageClassName: openshift-storage.noobaa.io
---
{{- /*
Reshapes the ObjectBucketClaim's generated Secret/ConfigMap into the shape AAP expects. Those are
created by the OBC controller on the managed cluster, so these reads stay as ACM templating.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: s3-aap-odf
  namespace: ansible-automation-platform
type: Opaque
stringData:
  s3-access-key-id: '{{ "{{" }} fromSecret "ansible-automation-platform" "aap-bucket-odf" "AWS_ACCESS_KEY_ID" | base64dec {{ "}}" }}'
  s3-secret-access-key: '{{ "{{" }} fromSecret "ansible-automation-platform" "aap-bucket-odf" "AWS_SECRET_ACCESS_KEY" | base64dec {{ "}}" }}'
  s3-bucket-name: '{{ "{{" }} fromConfigMap "ansible-automation-platform" "aap-bucket-odf" "BUCKET_NAME" {{ "}}" }}'
  s3-endpoint: 'https://{{ "{{" }} fromConfigMap "ansible-automation-platform" "aap-bucket-odf" "BUCKET_HOST" {{ "}}" }}:{{ "{{" }} fromConfigMap "ansible-automation-platform" "aap-bucket-odf" "BUCKET_PORT" {{ "}}" }}'
