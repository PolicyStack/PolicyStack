stack:
  localStorage:
    enabled: false

    # Which disks to claim, and what to call the resulting StorageClass
    config:
      # StorageClass created from the claimed disks. Point ODF's deviceSet at this.
      storageClassName: nvme-storageclass
      # Block for ODF OSDs; Filesystem for general local PVs
      volumeMode: Block
      # Device classes to claim
      deviceTypes:
        - disk
      # Ignore devices smaller than this; keeps boot and OS disks out
      minSize: 200G
      # Optional upper bound
      maxSize: ""
      # Node label marking the nodes whose disks are claimed. Matches the label the
      # storage-nodes element applies.
      nodeSelectorKey: cluster.ocs.openshift.io/openshift-storage

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - CP Contingency Planning
      controls:
        - CP-9 System Backup
      standards:
        - NIST SP 800-53

    policies:
      install:
        description: "Install and manage the Local Storage operator"

      # Claiming disks only makes sense once the storage nodes exist, so this waits
      # on the storage-nodes element on the same cluster.
      volumes:
        description: "Claim local disks on the storage nodes"
        dependencies:
          - name: install
          - name: ready
            element: storage-nodes
        templates:
          volumeset:
            description: "LocalVolumeSet claiming node-local disks"
            waitForOperator: local-storage

    operatorPolicies:
      local-storage:
        description: "Local Storage operator"
        displayName: "Local Storage"
        namespace: openshift-local-storage
        operatorGroup:
          name: openshift-local-storage
          targetNamespaces:
            - openshift-local-storage
        subscription:
          channel: stable
          name: local-storage-operator
        versions: []
