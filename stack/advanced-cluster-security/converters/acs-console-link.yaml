{{- /* Console shortcut to Central. The route host is only known on the managed
cluster, so the link is skipped until the Route exists. */ -}}
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: acs
spec:
  location: ApplicationMenu
  text: Red Hat Advanced Cluster Security
  href: '{{ "{{" }} $host := (lookup "route.openshift.io/v1" "Route" "{{ .Parameters.namespace }}" "central").spec.host {{ "}}" }}{{ "{{" }} skipObject (not $host) {{ "}}" }}https://{{ "{{" }} $host {{ "}}" }}'
  applicationMenu:
    section: Red Hat applications
    imageURL: {{ .Parameters.imageUrl }}
