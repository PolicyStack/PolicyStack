{{- /*
Copies the `collector-tls` material that Central generated ON THE HUB down to this secured cluster.

This is the one place in the migration where hub templating stays. It is not configuration - it is a
runtime secret minted by Central that must be distributed to every secured cluster, so it can never
be a values file. The braces are escaped so Helm passes them through for ACM to resolve.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: collector-tls
  namespace: {{ .Parameters.namespace }}
  labels:
    certificate_key_name: collector-cert.pem
type: Opaque
data:
  collector-cert.pem: '{{ "{{" }}hub fromSecret "{{ .Parameters.hubNamespace }}" "collector-tls" "collector-cert.pem" hub{{ "}}" }}'
  collector-key.pem: '{{ "{{" }}hub fromSecret "{{ .Parameters.hubNamespace }}" "collector-tls" "collector-key.pem" hub{{ "}}" }}'
  ca.pem: '{{ "{{" }}hub fromSecret "{{ .Parameters.hubNamespace }}" "collector-tls" "ca.pem" hub{{ "}}" }}'
