{{- /*
Adds config.trustedCA to the cluster trust bundle. The network operator then injects it into every
ConfigMap labelled config.openshift.io/inject-trusted-cabundle, the gitops element's included.
user-ca-bundle holds the installer's additionalTrustBundle, so it is left alone: trusted-cas is
user-ca-bundle's ca-bundle.crt, read on the managed cluster, followed by config.trustedCA, and the
Proxy points at it. Renders nothing when config.trustedCA is empty.
*/ -}}
{{- with .Values.stack.disconnected.config.trustedCA }}
- complianceType: mustonlyhave
  metadataComplianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: trusted-cas
      namespace: openshift-config
    data:
      ca-bundle.crt: | {{ "{{" }}- with dig "data" "ca-bundle.crt" "" (lookup "v1" "ConfigMap" "openshift-config" "user-ca-bundle") | trim {{ "}}" }}{{ "{{" }} . | nindent 8 {{ "}}" }}{{ "{{" }} end {{ "}}" }}
        {{- . | trim | nindent 8 }}
- complianceType: musthave
  objectDefinition:
    apiVersion: config.openshift.io/v1
    kind: Proxy
    metadata:
      name: cluster
    spec:
      trustedCA:
        name: trusted-cas
{{- end }}
