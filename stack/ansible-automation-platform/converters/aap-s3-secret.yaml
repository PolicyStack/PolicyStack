{{- /*
Reshapes the ObjectBucketClaim's generated Secret/ConfigMap into the shape AAP expects. Those are
created by the OBC controller on the managed cluster, so these reads stay as ACM templating.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Parameters.s3Secret }}
  namespace: {{ .Parameters.namespace }}
type: Opaque
stringData:
  s3-access-key-id: '{{ "{{" }} fromSecret "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "AWS_ACCESS_KEY_ID" | base64dec {{ "}}" }}'
  s3-secret-access-key: '{{ "{{" }} fromSecret "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "AWS_SECRET_ACCESS_KEY" | base64dec {{ "}}" }}'
  s3-bucket-name: '{{ "{{" }} fromConfigMap "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "BUCKET_NAME" {{ "}}" }}'
  s3-endpoint: 'https://{{ "{{" }} fromConfigMap "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "BUCKET_HOST" {{ "}}" }}:{{ "{{" }} fromConfigMap "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "BUCKET_PORT" {{ "}}" }}'
