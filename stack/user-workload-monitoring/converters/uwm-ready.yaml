{{- /*
Inform-only readiness gate. Compares each StatefulSet's readyReplicas against its own spec.replicas,
which is only knowable on the managed cluster, so this stays entirely as ACM templating.
*/ -}}
{{ "{{" }}- $prom := (lookup "apps/v1" "StatefulSet" "openshift-user-workload-monitoring" "prometheus-user-workload") | default dict {{ "}}" }}
{{ "{{" }}- $promReplicas := (index ($prom.spec | default dict) "replicas" | default 1 | toInt) {{ "}}" }}
{{ "{{" }}- $thanos := (lookup "apps/v1" "StatefulSet" "openshift-user-workload-monitoring" "thanos-ruler-user-workload") | default dict {{ "}}" }}
{{ "{{" }}- $thanosReplicas := (index ($thanos.spec | default dict) "replicas" | default 1 | toInt) {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: prometheus-user-workload
      namespace: openshift-user-workload-monitoring
    status:
      readyReplicas: {{ "{{" }} $promReplicas {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: thanos-ruler-user-workload
      namespace: openshift-user-workload-monitoring
    status:
      readyReplicas: {{ "{{" }} $thanosReplicas {{ "}}" }}
