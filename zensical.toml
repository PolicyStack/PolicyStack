[project]
site_name = "PolicyStack"
# Must match the CNAME written by ci.yml.
site_url = "https://policystk.io/"
repo_url = "https://github.com/PolicyStack/PolicyStack"
# Inferred wrongly from repo_url otherwise: repo_name as "GitHub", edit_uri as edit/master/docs.
repo_name = "PolicyStack/PolicyStack"
edit_uri = "edit/main/docs/"
# Source files kept beside the docs, not published. README.md links the diagram on GitHub.
exclude_docs = "diagrams/"
# Zensical does not check nav: a missing target ships as a dead link.
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation" = "start/install.md" },
    { "First cluster" = "start/first-cluster.md" },
  ] },
  { "Concepts" = [
    { "How PolicyStack works" = "concepts/overview.md" },
    { "ApplicationSets" = "concepts/architecture.md" },
    { "ACM policies in brief" = "concepts/acm.md" },
    { "How an element is built" = "concepts/elements.md" },
    { "Values cascade" = "concepts/values.md" },
    { "Placement and naming" = "concepts/policies.md" },
    { "Cluster lifecycle" = "concepts/lifecycle.md" },
    { "Removal and pruning" = "concepts/removal.md" },
  ] },
  { "Guides" = [
    { "Rolling out changes" = "guides/rollout.md" },
    { "Operator versions" = "guides/operators.md" },
    { "Building clusters" = "guides/lifecycle.md" },
    { "OpenShift upgrades" = "guides/upgrades.md" },
    { "Disconnected clusters" = "guides/disconnected.md" },
    { "Global Hub" = "guides/global-hub.md" },
    { "Upgrading PolicyStack" = "guides/upgrading.md" },
  ] },
  { "Elements" = [
    { "ACS" = "elements/acs.md" },
    { "Compliance" = "elements/compliance.md" },
    { "File Integrity" = "elements/file-integrity.md" },
  ] },
  { "Develop" = [
    { "Writing an element" = "develop/elements.md" },
    { "Validation" = "develop/validation.md" },
  ] },
  { "Reference" = [
    { "Fleet files" = "reference/fleet.md" },
    { "Install chart" = "reference/install.md" },
    { "Lifecycle keys" = "reference/lifecycle.md" },
    { "Launcher" = "reference/launcher.md" },
    { "Validator rules" = "reference/rules.md" },
    { "CI workflows" = "reference/ci.md" },
    { "Compatibility" = "reference/compatibility.md" },
  ] },
  { "Contributing" = "contributing.md" },
]

[project.theme]
features = [
  "content.action.edit", "content.code.annotate", "content.code.copy", "content.code.select",
  "content.tabs.link", "content.tooltips", "navigation.footer", "navigation.instant",
  "navigation.instant.progress", "navigation.sections", "navigation.tabs", "navigation.tabs.sticky",
  "navigation.top", "search.highlight", "toc.integrate",
]
icon.logo = "lucide/layers"

# Toggle cycles system, light, dark. The system entry repeats the colors: the page renders with
# them before the theme's JS resolves the OS scheme.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "blue grey"
accent = "teal"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Setting this table replaces Zensical's default extension set. It exists for snippets, which
# reference/rules.md uses to include the rules table from tools/validator/README.md. highlight
# values are Zensical's defaults. Run zensical from the repo root: snippet paths resolve against
# the cwd.
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.tabbed.alternate_style = true
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Old flat pages. A page redirect keeps the anchor, so only sections that moved elsewhere need one.
[project.plugins.redirects.redirect_maps]
"acs.md" = "elements/acs.md"
"applicationset.md" = "concepts/architecture.md"
"applicationset.md#fleet-files" = "concepts/overview.md#fleet-files"
"applicationset.md#revision" = "reference/fleet.md#revision"
"applicationset.md#protection" = "start/install.md#protect-the-repository"
"applicationset.md#injected-values" = "concepts/values.md#order"
"applicationset.md#the-install-chart" = "reference/install.md"
"compliance.md" = "elements/compliance.md"
"disconnected.md" = "guides/disconnected.md"
"elements.md" = "develop/elements.md"
"global-hub.md" = "guides/global-hub.md"
"install.md" = "start/install.md"
"install.md#upgrading" = "guides/upgrading.md"
"lifecycle.md" = "guides/lifecycle.md"
"lifecycle-reference.md" = "reference/lifecycle.md"
"lifecycle-reference.md#day-2-handoff" = "concepts/lifecycle.md#day-2-handoff"
"lifecycle-reference.md#removing-a-nodepool" = "guides/lifecycle.md#removing-a-nodepool"
"lifecycle-reference.md#scaling-siteconfig-workers" = "guides/lifecycle.md#scaling-siteconfig-workers"
"lifecycle-reference.md#adding-an-engine" = "contributing.md#adding-a-lifecycle-engine"
"policies.md" = "concepts/policies.md"
"rollout.md" = "guides/rollout.md"
"rollout.md#onboarding-a-cluster" = "start/first-cluster.md#onboard-the-cluster"
"rollout.md#what-happens-on-the-managed-cluster" = "concepts/removal.md#what-happens-on-the-managed-cluster"
"rollout.md#operator-upgrades" = "guides/operators.md"
"upgrades.md" = "guides/upgrades.md"
"validation.md" = "develop/validation.md"
"validation.md#rules" = "reference/rules.md"
"values.md" = "concepts/values.md"
"workflows.md" = "reference/ci.md"
"index.md#how-a-change-reaches-a-cluster" = "concepts/overview.md#how-a-change-reaches-a-cluster"
"index.md#terms" = "concepts/overview.md#glossary"
"contributing.md#forks" = "guides/upgrading.md"
# Sections moved by the docs rewrite.
"concepts/architecture.md#how-a-change-reaches-a-cluster" = "concepts/overview.md#how-a-change-reaches-a-cluster"
"concepts/architecture.md#terms" = "concepts/overview.md#glossary"
"concepts/architecture.md#day-2-handoff" = "concepts/lifecycle.md#day-2-handoff"
