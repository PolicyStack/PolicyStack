{{- /*
Bare metal has no MachineSets, so storage nodes are designated by labelling existing nodes.

Name them in config.nodes, or leave it empty to take the first config.replicas nodes. The node
list is only known at runtime, so selection uses ACM templating.
*/ -}}
{{- $cfg := .Config }}
{{ "{{" }}- $chosen := list {{ "}}" }}
{{- if $cfg.nodes }}
{{ "{{" }}- range $n := (list{{ range $n := $cfg.nodes }} {{ $n | quote }}{{ end }}) {{ "}}" }}
{{ "{{" }}-   $node := (lookup "v1" "Node" "" $n) {{ "}}" }}
{{ "{{" }}-   if $node {{ "}}" }}{{ "{{" }}- $chosen = append $chosen $node {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{- else }}
{{ "{{" }}- /* Prefer dedicated workers: the first N of all nodes can include control-plane
     nodes and put OSDs on them. Fall back to every node only on a compact cluster, where the
     masters are the workers. */ -}}
{{ "{{" }}- $workers := list {{ "}}" }}
{{ "{{" }}- range $n := (lookup "v1" "Node" "" "").items {{ "}}" }}
{{ "{{" }}-   if and (hasKey $n.metadata.labels "node-role.kubernetes.io/worker") (not (hasKey $n.metadata.labels "node-role.kubernetes.io/master")) {{ "}}" }}
{{ "{{" }}-     $workers = append $workers $n {{ "}}" }}
{{ "{{" }}-   end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- if eq 0 (len $workers) {{ "}}" }}{{ "{{" }}- $workers = (lookup "v1" "Node" "" "").items {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- /* Cap with slice, not `until (min ...)`: sprig's min returns int64 and until expects
     int, which fails at evaluation time with "expected int; got int64". helm template and the
     validator cannot catch this because only ACM evaluates it. slice is a Go template builtin
     and needs no arithmetic. */ -}}
{{ "{{" }}- $chosen = $workers {{ "}}" }}
{{ "{{" }}- if gt (len $chosen) {{ $cfg.replicas }} {{ "}}" }}{{ "{{" }}- $chosen = slice $chosen 0 {{ $cfg.replicas }} {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{- end }}
{{ "{{" }}- range $node := $chosen {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Node
    metadata:
      name: {{ "{{" }} $node.metadata.name {{ "}}" }}
      labels:
        {{- range $k, $v := .Config.nodeLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
{{ "{{" }}- end {{ "}}" }}
