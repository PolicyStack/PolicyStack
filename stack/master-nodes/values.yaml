stack:
  masterNodes:
    enabled: false

    # Kubelet reservations. They size the control plane and vary per cluster.
    config:
      # Maximum pods per node
      maxPods: 250
      # Memory reserved for the OS
      systemReservedMemory: 3Gi
      # CPU reserved for the OS
      systemReservedCpu: 500m
      # Memory reserved for kubelet and the container runtime
      kubeReservedMemory: 1536Mi
      # CPU reserved for kubelet and the container runtime
      kubeReservedCpu: 500m
      # Hard eviction threshold on available memory
      evictionMemory: 500Mi

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - CM Configuration Management
      controls:
        - CM-6 Configuration Settings
      standards:
        - NIST SP 800-53

    policies:
      config:
        description: "Control-plane kubelet configuration"
        templates:
          master-kubelet:
            description: "KubeletConfig for the master pool"
