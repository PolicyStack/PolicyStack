stack:
  imageRegistry:
    enabled: false

    config:
      # Must match the policy you enabled below: pvc or s3
      storageType: s3
      # Managed, Unmanaged or Removed
      managementState: Managed
      # Registry replicas. Use at least 2 with RWX or S3 storage.
      replicas: 2
      # RollingUpdate is only safe with RWX or S3; use Recreate with RWO
      rolloutStrategy: RollingUpdate
      # Used when storageType is pvc
      pvc:
        accessMode: ReadWriteMany
        volumeMode: Filesystem
        storageClass: ocs-storagecluster-cephfs
        size: 100Gi
      # Used when storageType is s3
      s3:
        # Region string sent to the S3 API. NooBaa ignores it but it must be set.
        region: us-east-1
        # StorageClass that provisions the bucket
        bucketStorageClass: openshift-storage.noobaa.io

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    # Enable only one storage backend. `pvc` needs an RWX StorageClass; `s3` needs
    # ODF's NooBaa gateway on the same cluster.
    policies:
      # Back the registry with an RWX PersistentVolumeClaim
      pvc:
        enabled: false
        description: "PVC-backed registry storage"
        templates:
          claim:
            description: "Registry PVC"

      # Back the registry with a NooBaa bucket from ODF. Waits for the storage cluster
      # to be usable.
      s3:
        enabled: false
        description: "S3-backed registry storage from ODF"
        dependencies:
          - name: ready
            element: odf
        templates:
          bucket:
            description: "Registry bucket"

          bucket-ready:
            description: "Registry bucket is provisioned"
            remediationAction: InformOnly

          credentials:
            description: "Registry S3 credentials and trust bundle"
            # The credentials only exist once the bucket has been provisioned
            extraDependencies:
              - name: bucket-ready
            ignorePending: true

      config:
        description: "Point the registry at its storage and enable it"
        templates:
          registry:
            description: "Image registry configuration"
