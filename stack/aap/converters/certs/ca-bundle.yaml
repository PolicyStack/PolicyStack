{{- /* Empty ConfigMap; the service CA operator injects the bundle. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aap-service-ca
  namespace: ansible-automation-platform
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
---
{{- /* Empty ConfigMap; the network operator injects the cluster's trusted CA bundle. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aap-trusted-ca
  namespace: ansible-automation-platform
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
---
{{- /*
Concatenates the two injected CA bundles into the single Secret AAP consumes. Both inputs are
populated by cluster operators on the managed cluster, so they are read with ACM templating, and
the Secret is skipped until both are.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: user-ca-bundle
  namespace: ansible-automation-platform
type: Opaque
data:
  trusted-ca-bundle: '{{ "{{" }} $svc := dig "data" "service-ca.crt" "" (lookup "v1" "ConfigMap" "ansible-automation-platform" "aap-service-ca") {{ "}}" }}{{ "{{" }} $trusted := dig "data" "ca-bundle.crt" "" (lookup "v1" "ConfigMap" "ansible-automation-platform" "aap-trusted-ca") {{ "}}" }}{{ "{{" }} skipObject (not (and $svc $trusted)) {{ "}}" }}{{ "{{" }} printf "%s\n%s" $svc $trusted | base64enc {{ "}}" }}'
