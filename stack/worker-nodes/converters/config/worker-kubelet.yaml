{{- /*
KubeletConfig for the worker pool, sized from the element's config block (.Config).

podsPerCore is derived from the node CPU count, which is only known on the managed cluster, so it
uses an escaped ACM template. A raw list because that takes several ACM statements and podsPerCore is
an integer, which a block scalar can't produce.
*/ -}}
{{- $cfg := .Config }}
{{ "{{" }}- $cores := 0 {{ "}}" }}
{{ "{{" }}- range (lookup "v1" "Node" "" "").items {{ "}}" }}
{{ "{{" }}-   if hasKey .metadata.labels "node-role.kubernetes.io/worker" {{ "}}" }}
{{ "{{" }}-     if eq $cores 0 {{ "}}" }}{{ "{{" }}- $cores = (.status.capacity.cpu | toInt) {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}-   end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- if eq $cores 0 {{ "}}" }}{{ "{{" }}- $cores = 1 {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: machineconfiguration.openshift.io/v1
    kind: KubeletConfig
    metadata:
      name: worker-node-config
    spec:
      machineConfigPoolSelector:
        matchLabels:
          pools.operator.machineconfiguration.openshift.io/worker: ""
      kubeletConfig:
        maxPods: {{ $cfg.maxPods }}
        podsPerCore: {{ "{{" }} add 1 (div {{ $cfg.maxPods }} $cores) {{ "}}" }}
        systemReserved:
          memory: {{ $cfg.systemReservedMemory }}
          cpu: {{ $cfg.systemReservedCpu }}
        kubeReserved:
          memory: {{ $cfg.kubeReservedMemory }}
          cpu: {{ $cfg.kubeReservedCpu }}
        # The kubelet does not merge defaults into a partial evictionHard; unset signals drop to zero.
        # OpenShift requires all five signals; the others are the upstream kubelet Linux defaults.
        evictionHard:
          memory.available: {{ $cfg.evictionMemory }}
          nodefs.available: 10%
          nodefs.inodesFree: 5%
          imagefs.available: 15%
          imagefs.inodesFree: 5%
