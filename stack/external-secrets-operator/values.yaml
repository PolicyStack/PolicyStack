stack:
  # @description: External Secrets Operator (Red Hat) for syncing secrets from external KMS providers
  externalSecretsOperator:
    # @desc: Master control to enable/disable all policies in this element
    enabled: false

    # @description: Default policy metadata applied unless overridden per-policy
    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    # @description: Parent policy grouping the External Secrets Operator install resources
    policies:
      - name: eso-install
        enabled: true
        namespace: open-cluster-management
        description: "Install and manage the External Secrets Operator"
        remediationAction: enforce
        severity: medium
        disabled: false

    # @description: OperatorPolicy installing the External Secrets subscription
    operatorPolicies:
      - name: external-secrets
        enabled: true
        description: "External Secrets Operator (Red Hat build)"
        displayName: "External Secrets Operator"
        policyRef: eso-install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: external-secrets-operator
        operatorGroup:
          name: external-secrets-operator-group
          targetNamespaces:
            - external-secrets-operator
        subscription:
          channel: stable-v1
          name: openshift-external-secrets-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic

    # @description: Adds the cluster-monitoring label to the operator namespace
    configPolicies:
      - name: external-secrets-ns-monitoring
        enabled: true
        description: "Adds openshift.io/cluster-monitoring label to operator namespace"
        policyRef: eso-install
        complianceType: musthave
        remediationAction: enforce
        severity: low
        evaluationInterval:
          compliant: "10m"
          noncompliant: "30s"
        templateNames:
          - name: ns-monitoring-label
        enableTemplateParameters: true
        templateParameters:
          namespace: external-secrets-operator
