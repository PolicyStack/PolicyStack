name: Update Documentation

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  update-docs:
    name: Regenerate docs
    # Fork PRs get a read-only token and cannot be pushed to.
    if: >-
      github.event.label.name == 'update-docs' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # push the docs commit
      pull-requests: write  # remove the label
      actions: write        # dispatch the checks for the new commit
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The token is not persisted: the generator below runs code from the PR branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Regenerate docs
        id: regen
        run: |
          python tools/doc-generator.py
          if [ -n "$(git status --porcelain -- 'stack/*/README.md')" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Element READMEs are already current." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit, push and run checks
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'stack/*/README.md'
          git commit -m "docs: update documentation [auto-generated]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          # A push made with GITHUB_TOKEN does not start workflows, so run the checks on the new commit.
          gh workflow run docs-check.yml --ref "$BRANCH"
          gh workflow run validate.yml --ref "$BRANCH"
          echo "Committed regenerated element READMEs to $BRANCH." >> "$GITHUB_STEP_SUMMARY"

      # Ignore failures: the label may already have been removed by hand.
      - name: Remove label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/update-docs" --silent || true
