{{- /*
Reshapes the ObjectBucketClaim's generated Secret and ConfigMap into the s3 secret LokiStack expects.
The OBC controller creates both on the managed cluster, so these reads stay ACM templating.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Parameters.storageSecret }}
  namespace: {{ .Parameters.namespace }}
type: Opaque
stringData:
  access_key_id: '{{ "{{" }} fromSecret "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "AWS_ACCESS_KEY_ID" | base64dec {{ "}}" }}'
  access_key_secret: '{{ "{{" }} fromSecret "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "AWS_SECRET_ACCESS_KEY" | base64dec {{ "}}" }}'
  bucketnames: '{{ "{{" }} fromConfigMap "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "BUCKET_NAME" {{ "}}" }}'
  region: '{{ "{{" }} fromConfigMap "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "BUCKET_REGION" {{ "}}" }}'
  endpoint: 'https://{{ "{{" }} fromConfigMap "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "BUCKET_HOST" {{ "}}" }}:{{ "{{" }} fromConfigMap "{{ .Parameters.namespace }}" "{{ .Parameters.bucketName }}" "BUCKET_PORT" {{ "}}" }}'
