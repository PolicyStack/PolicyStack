{{- /*
Search database storage.

Omit storageClassName to use the cluster default; an empty string disables provisioning.
*/ -}}
{{- $s := .Values.stack.acm.config.search }}
apiVersion: search.open-cluster-management.io/v1alpha1
kind: Search
metadata:
  name: search-v2-operator
  namespace: {{ .Parameters.namespace }}
spec:
  dbStorage:
    size: {{ $s.size | quote }}
    {{- with $s.storageClass }}
    storageClassName: {{ . | quote }}
    {{- end }}
