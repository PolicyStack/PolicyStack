stack:
  workerNodes:
    enabled: false

    # Kubelet tuning is safe; resizing MachineSets is not, so it is opt-in.
    toggles:
      # Apply the kubelet configuration below to the worker pool
      config: true
      # Scale and resize the existing worker MachineSets
      machines: false
      # Report NonCompliant until the workers report the requested replica count
      ready: false

    config:
      # Replicas per worker MachineSet. Empty keeps the installer's value.
      replicas: ""
      # AWS instance type. Empty keeps the installer's value.
      instanceType: ""
      # vSphere vCPUs. Empty keeps the installer's value.
      numCPUs: ""
      # vSphere cores per socket
      numCoresPerSocket: ""
      # vSphere memory in MiB
      memoryMiB: ""
      # Maximum pods per node
      maxPods: 250
      # Memory reserved for system daemons
      systemReservedMemory: 1Gi
      # CPU reserved for system daemons
      systemReservedCpu: 250m
      # Memory reserved for the kubelet and container runtime
      kubeReservedMemory: 512Mi
      # CPU reserved for the kubelet and container runtime
      kubeReservedCpu: 250m
      # Hard eviction threshold for available memory
      evictionMemory: 500Mi

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-6 Configuration Settings
      standards:
        - NIST SP 800-53

    policies:
      - name: config
        enabled: true
        description: "Worker kubelet configuration"
        remediationAction: enforce
        severity: medium
        disabled: false

      - name: machines
        enabled: true
        description: "Worker MachineSet sizing"
        remediationAction: enforce
        severity: medium
        disabled: false

      - name: ready
        enabled: true
        description: "Reports NonCompliant until workers reach the requested count"
        remediationAction: inform
        severity: medium
        disabled: false
        dependencies:
          - name: machines

    configPolicies:
      - name: worker-kubelet
        enabled: true
        description: "KubeletConfig for the worker pool"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: node-kubelet-config
        enableTemplateParameters: true
        templateParameters:
          role: worker

      - name: scale
        enabled: true
        description: "Scale and resize existing worker MachineSets"
        policyRef: machines
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: worker-scale
        enableTemplateParameters: true
        templateParameters:
          namespace: openshift-machine-api

      - name: worker-replicas
        enabled: true
        description: "Worker MachineSet readiness"
        policyRef: ready
        complianceType: musthave
        remediationAction: inform
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-ready
        enableTemplateParameters: true
        templateParameters:
          role: worker
          namespace: openshift-machine-api
