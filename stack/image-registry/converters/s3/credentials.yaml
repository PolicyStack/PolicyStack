{{- /*
Credentials and trust bundle for the NooBaa-backed registry.

All inputs (OBC credentials, service CA, ingress CA) are generated on the managed cluster, so
everything here is ACM templating.

The trust bundle appends the ingress CA to the service CA because the NooBaa S3 endpoint is an apps
route. `default-ingress-cert` tracks the certificate in use; `router-ca` goes stale once the default
ingress certificate is replaced, including by the cert-manager element.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: image-registry-private-configuration-user
  namespace: openshift-image-registry
type: Opaque
data:
  REGISTRY_STORAGE_S3_ACCESSKEY: '{{ "{{" }} fromSecret "openshift-image-registry" "image-registry-storage" "AWS_ACCESS_KEY_ID" {{ "}}" }}'
  REGISTRY_STORAGE_S3_SECRETKEY: '{{ "{{" }} fromSecret "openshift-image-registry" "image-registry-storage" "AWS_SECRET_ACCESS_KEY" {{ "}}" }}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-registry-s3-bundle
  namespace: openshift-config
data:
  ca-bundle.crt: |
    {{ "{{" }}- $caBundle := fromConfigMap "openshift-image-registry" "openshift-service-ca.crt" "service-ca.crt" {{ "}}" }}
    {{ "{{" }}- $ingressCA := (lookup "v1" "ConfigMap" "openshift-config-managed" "default-ingress-cert") | default dict {{ "}}" }}
    {{ "{{" }}- $ingressPEM := (index ($ingressCA.data | default dict) "ca-bundle.crt" | default "") {{ "}}" }}
    {{ "{{" }}- if not (empty $ingressPEM) {{ "}}" }}{{ "{{" }}- $caBundle = printf "%s\n%s" (trim $caBundle) (trim $ingressPEM) {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
    {{ "{{" }} $caBundle | autoindent {{ "}}" }}
