stack:
  logging:
    enabled: false
    
    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53
    
    policies:
      - name: install
        enabled: true
        namespace: open-cluster-management
        description: "Policy for any operator installation"
        # Set on the Policy, so it overrides every template's action, including the
        # OperatorPolicy below. With inform, the operator is reported missing, not installed.
        remediationAction: enforce
        severity: medium
        disabled: false
    
    operatorPolicies:
      cluster-logging:
        enabled: true
        description: "Installs the OpenShift logging operator"
        displayName: "Red Hat OpenShift Logging"
        policyRef: install
        severity: high
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-logging
        operatorGroup:
          name: openshift-logging-group
        subscription:
          channel: stable-6.5
          name: cluster-logging
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []
