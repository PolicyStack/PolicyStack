stack:
  # @description: Dedicated infra nodes and the platform workloads placed on them
  infraNodes:
    # @desc: Master control to enable/disable all policies in this element
    enabled: false

    # @description: Enable only one platform toggle (aws or vmware). Set it in
    # @description: values/platforms/<platform>.yaml, selected by a
    # @description: platform.<N> config entry in the cluster's fleet file.
    toggles:
      # @desc: MachineConfigPool for the infra role
      mcp: true
      # @desc: Kubelet configuration for the infra pool
      config: true
      # @desc: Create infra MachineSets by cloning the worker MachineSet (AWS)
      aws: false
      # @desc: Clone each worker MachineSet per vSphere failure domain
      vmware: false
      # @desc: Report NonCompliant until the infra nodes are ready
      ready: true
      # @desc: Move gitops, ingress, image registry and monitoring onto infra nodes
      workloads: false
      # @desc: Move the `workloads` components back off infra nodes. Disabling `workloads` stops
      # @desc: enforcement but does not revert placement. Enable this to revert, then disable it
      # @desc: once the components have moved.
      restore: false

    # @description: Infra node sizing
    config:
      # @desc: Infra nodes per zone
      replicas: 3
      # @desc: AWS availability zones. Empty uses the zone of the cloned worker MachineSet.
      zones: []
      # @desc: AWS instance type. Empty inherits from the worker MachineSet.
      instanceType: ""
      # @desc: Root volume size in GiB. Empty inherits from the worker MachineSet.
      volumeSize: ""
      # @desc: vSphere sizing. Empty inherits from the worker MachineSet.
      numCPUs: ""
      numCoresPerSocket: ""
      memoryMiB: ""
      # @desc: Namespace the GitopsService lives in
      gitopsNamespace: openshift-gitops
      # @desc: Kubelet max pods and resource reservations for infra nodes
      maxPods: 250
      systemReservedMemory: 2Gi
      systemReservedCpu: 500m
      kubeReservedMemory: 1Gi
      kubeReservedCpu: 500m
      evictionMemory: 500Mi

    # @description: Default policy metadata applied unless overridden per-policy
    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-6 Configuration Settings
      standards:
        - NIST SP 800-53

    policies:
      - name: mcp
        enabled: true
        description: "MachineConfigPool for infra nodes"
        remediationAction: enforce
        severity: medium
        disabled: false

      - name: config
        enabled: true
        description: "Infra kubelet configuration"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: mcp

      - name: aws
        enabled: true
        description: "Infra MachineSets on AWS"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: mcp

      - name: vmware
        enabled: true
        description: "Infra MachineSets on vSphere"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: mcp

      - name: ready
        enabled: true
        description: "Reports NonCompliant until the infra nodes are ready"
        remediationAction: inform
        severity: medium
        disabled: false

      - name: workloads
        enabled: true
        description: "Move platform components onto infra nodes"
        remediationAction: enforce
        severity: medium
        disabled: false
        # @desc: Move workloads only after the infra nodes are ready
        dependencies:
          - name: ready

      - name: restore
        enabled: true
        description: "Move platform components back off infra nodes"
        remediationAction: enforce
        severity: medium
        disabled: false

    configPolicies:
      - name: pool
        enabled: true
        description: "Infra MachineConfigPool"
        policyRef: mcp
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        templateNames:
          - name: infra-mcp
        enableTemplateParameters: true
        templateParameters:
          role: infra

      - name: infra-kubelet
        enabled: true
        description: "KubeletConfig for the infra pool"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: node-kubelet-config
        enableTemplateParameters: true
        templateParameters:
          role: infra

      - name: infra-machinesets
        enabled: true
        description: "Infra MachineSets cloned from the worker MachineSet"
        policyRef: aws
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-aws
        enableTemplateParameters: true
        templateParameters: &infraParams
          role: infra
          namespace: openshift-machine-api
          nodeLabels:
            node-role.kubernetes.io/infra: ""

      - name: infra-machinesets
        enabled: true
        description: "Infra MachineSets per vSphere failure domain"
        policyRef: vmware
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-vmware
        enableTemplateParameters: true
        templateParameters: *infraParams

      - name: infra-replicas
        enabled: true
        description: "Infra MachineSet readiness"
        policyRef: ready
        complianceType: musthave
        remediationAction: inform
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-ready
        enableTemplateParameters: true
        templateParameters: *infraParams

      - name: components
        enabled: true
        description: "Gitops, ingress and image registry pinned to infra"
        policyRef: workloads
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        templateNames:
          - name: infra-gitops
          - name: infra-ingress
          - name: infra-registry
        enableTemplateParameters: true
        templateParameters:
          role: infra

      - name: monitoring
        enabled: true
        description: "Monitoring stack pinned to infra"
        policyRef: workloads
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        # @desc: Merges placement keys into the existing cluster-monitoring-config
        rawTemplate: true
        templateNames:
          - name: infra-monitoring
        enableTemplateParameters: true
        templateParameters:
          role: infra
          # @desc: Monitoring components to pin. Alertmanager and Prometheus use the most resources.
          components:
            - alertmanagerMain
            - prometheusK8s
            - prometheusOperator
            - kubeStateMetrics
            - telemeterClient
            - openshiftStateMetrics
            - thanosQuerier
            - monitoringPlugin

      - name: revert
        enabled: true
        description: "Platform components moved back off infra"
        policyRef: restore
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: infra-restore
        enableTemplateParameters: true
        templateParameters:
          role: infra
