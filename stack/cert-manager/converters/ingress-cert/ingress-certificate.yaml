{{- /*
cert-manager-managed serving certificate for the default Ingress wildcard (*.apps.<domain>),
used by the console, CLI and every route.

Higher blast radius than the API certificate: this replaces the wildcard instead of adding an SNI
entry. The same guard applies: the Certificate is always created, and the IngressController is
patched only once it reports Ready. The secretName is stable across renewals, so the router
hot-reloads without a rolling update. With a self-signed CA, the cluster's internal clients must
also trust that CA.

As with the API cert, Helm resolves the values and ACM resolves the apps domain and the readiness
gate on the managed cluster.
*/ -}}
{{- $cfg := .Config }}
{{ "{{" }}- $appsDomain := dig "spec" "domain" "" ((lookup "config.openshift.io/v1" "Ingress" "" "cluster") | default dict) {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: cert-manager-ingress-cert
      namespace: openshift-ingress
    spec:
      secretName: cert-manager-ingress-cert
      duration: {{ $cfg.leafDuration }}
      renewBefore: {{ $cfg.leafRenewBefore }}
      privateKey:
        algorithm: {{ $cfg.keyAlgorithm }}
        size: {{ $cfg.keySize }}
      dnsNames:
        - '*.{{ "{{" }} $appsDomain {{ "}}" }}'
        - {{ "{{" }} $appsDomain {{ "}}" }}
        {{- range $san := (($cfg.ingressCert).extraSANs) | default list }}
        - {{ $san }}
        {{- end }}
      issuerRef:
        name: {{ ((($cfg.ingressCert).issuer).name) | default $cfg.caName }}
        kind: {{ ((($cfg.ingressCert).issuer).kind) | default "ClusterIssuer" }}
        group: {{ ((($cfg.ingressCert).issuer).group) | default "cert-manager.io" }}
{{ "{{" }}- $conds := dig "status" "conditions" (list) ((lookup "cert-manager.io/v1" "Certificate" "openshift-ingress" "cert-manager-ingress-cert") | default dict) {{ "}}" }}
{{ "{{" }}- $ready := false {{ "}}" }}
{{ "{{" }}- range $c := $conds {{ "}}" }}{{ "{{" }}- if and (eq (dig "type" "" $c) "Ready") (eq (dig "status" "" $c) "True") {{ "}}" }}{{ "{{" }}- $ready = true {{ "}}" }}{{ "{{" }}- end {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- if $ready {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: operator.openshift.io/v1
    kind: IngressController
    metadata:
      name: default
      namespace: openshift-ingress-operator
    spec:
      defaultCertificate:
        name: cert-manager-ingress-cert
{{ "{{" }}- end {{ "}}" }}
