{{- /*
Copies the credential's pullSecret and ssh-publickey into the keys HyperShift reads. The templates
resolve on the hub itself, so the credential may live in any namespace.

On Agent and None the etcd encryption key is generated once: only while neither the key nor the
HostedCluster exists. A key deleted after create is not regenerated, since a new key cannot decrypt
etcd. On KubeVirt the HyperShift operator creates the key itself.
*/ -}}
{{- $i := .Values.install }}
{{- $c := include "lifecycle.cluster" . }}
{{- $cred := printf "%q %q" (required "install.credential.namespace is required" $i.credential.namespace) (required "install.credential.name is required" $i.credential.name) }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Namespace
    metadata:
      name: {{ $i.namespace }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: kubernetes.io/dockerconfigjson
    metadata:
      name: {{ $c }}-pull-secret
      namespace: {{ $i.namespace }}
    data:
      .dockerconfigjson: '{{ "{{" }} fromSecret {{ $cred }} "pullSecret" {{ "}}" }}'
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: Opaque
    metadata:
      name: {{ $c }}-ssh-key
      namespace: {{ $i.namespace }}
    data:
      id_rsa.pub: '{{ "{{" }} fromSecret {{ $cred }} "ssh-publickey" {{ "}}" }}'
{{- if ne $i.platform "KubeVirt" }}
{{ "{{-" }} $key := lookup "v1" "Secret" {{ $i.namespace | quote }} "{{ $c }}-etcd-encryption-key" {{ "}}" }}
{{ "{{-" }} if or $key (not (lookup "hypershift.openshift.io/v1beta1" "HostedCluster" {{ $i.namespace | quote }} {{ $c | quote }})) {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: Opaque
    metadata:
      name: {{ $c }}-etcd-encryption-key
      namespace: {{ $i.namespace }}
    data:
      key: '{{ "{{" }} dig "data" "key" (randBytes 32) $key {{ "}}" }}'
{{ "{{-" }} end {{ "}}" }}
{{- end }}
