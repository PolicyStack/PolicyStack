{{- /*
One MachineHealthCheck per MachineSet, for enabled roles only.

MachineSet names and roles are only known on the managed cluster, so the loop is an ACM template.
Enabled roles and timeouts come from values.

Storage nodes have longer timeouts because rebuilding one is far more disruptive than replacing a
worker.
*/ -}}
{{- $cfg := .Values.stack.machineHealth.config }}
{{ "{{" }}- $machinesets := (lookup "machine.openshift.io/v1beta1" "MachineSet" "{{ .Parameters.namespace }}" "").items {{ "}}" }}
{{ "{{" }}- range $ms := $machinesets {{ "}}" }}
{{ "{{" }}-   $role := index (($ms.spec.template.metadata).labels | default dict) "machine.openshift.io/cluster-api-machine-role" {{ "}}" }}
{{ "{{" }}-   $name := $ms.metadata.name {{ "}}" }}
{{ "{{" }}-   $isStorage := hasKey ($ms.spec.template.spec.metadata.labels | default dict) "cluster.ocs.openshift.io/openshift-storage" {{ "}}" }}
{{ "{{" }}-   $isWorker := and (eq $role "worker") (not $isStorage) {{ "}}" }}
{{ "{{" }}-   $isInfra := and (eq $role "infra") (not $isStorage) {{ "}}" }}
{{ "{{" }}-   if and $isStorage {{ $cfg.storage.enabled }} {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineHealthCheck
    metadata:
      name: {{ "{{" }} $name {{ "}}" }}
      namespace: {{ .Parameters.namespace }}
    spec:
      selector:
        matchLabels:
          machine.openshift.io/cluster-api-machineset: {{ "{{" }} $name {{ "}}" }}
      unhealthyConditions:
        - type: Ready
          status: "False"
          timeout: {{ $cfg.storage.timeout }}
        - type: Ready
          status: Unknown
          timeout: {{ $cfg.storage.timeout }}
      maxUnhealthy: {{ $cfg.storage.maxUnhealthy | quote }}
      nodeStartupTimeout: {{ $cfg.storage.nodeStartupTimeout }}
{{ "{{" }}-   else if or (and $isWorker {{ $cfg.worker.enabled }}) (and $isInfra {{ $cfg.infra.enabled }}) {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineHealthCheck
    metadata:
      name: {{ "{{" }} $name {{ "}}" }}
      namespace: {{ .Parameters.namespace }}
    spec:
      selector:
        matchLabels:
          machine.openshift.io/cluster-api-machineset: {{ "{{" }} $name {{ "}}" }}
      unhealthyConditions:
        - type: Ready
          status: "False"
          timeout: {{ $cfg.default.timeout }}
        - type: Ready
          status: Unknown
          timeout: {{ $cfg.default.timeout }}
      maxUnhealthy: {{ $cfg.default.maxUnhealthy | quote }}
      nodeStartupTimeout: {{ $cfg.default.nodeStartupTimeout }}
{{ "{{" }}-   end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
