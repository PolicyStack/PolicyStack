{{- /*
Only what the secured policy's hub templates read; the propagator watches each by name. Enforced
mustonlyhave, so the old init-bundle grants are removed, not kept.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Parameters.hubServiceAccount }}
  namespace: {{ .Parameters.hubNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cluster-registration-secret]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    resourceNames: [central]
    verbs: [get, list, watch]
