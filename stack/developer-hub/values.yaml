stack:
  developerHub:
    enabled: false

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      - name: install
        enabled: true
        description: "Install and manage Red Hat Developer Hub"
        remediationAction: enforce
        severity: medium
        disabled: false

    operatorPolicies:
      rhdh:
        enabled: true
        description: "Red Hat Developer Hub (Backstage) internal developer portal"
        # Must match the CSV displayName so the generated status check can find it
        displayName: "Red Hat Developer Hub Operator"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: rhdh-operator
        subscription:
          channel: fast-1.9
          name: rhdh
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []

    configPolicies:
      # Adds the cluster-monitoring label so the operator's metrics are scraped
      - name: developer-hub-ns-monitoring
        enabled: true
        description: "Adds openshift.io/cluster-monitoring label to the operator namespace"
        policyRef: install
        complianceType: musthave
        remediationAction: enforce
        severity: low
        evaluationInterval:
          compliant: "10m"
          noncompliant: "30s"
        templateNames:
          - name: ns-monitoring-label
        enableTemplateParameters: true
        templateParameters:
          namespace: rhdh-operator
