{{- $hub := required "hubName must be set (--set hubName=<name>)" .Values.hubName -}}
{{- $_ := required "gitRepo must be set (--set gitRepo=<url>)" .Values.gitRepo -}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: policystack
  namespace: openshift-gitops
  annotations:
    helm.sh/resource-policy: keep
spec:
  # Deleting an Application deletes its Policies, so disabling or removing an element or a fleet file
  # cleans up the hub. The destination is always the hub, and a generator error deletes nothing.
  syncPolicy:
    preserveResourcesOnDeletion: false
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchExpressions:
                        - key: clusterID
                          operator: Exists
                - git:
                    repoURL: '{{ .Values.gitRepo }}'
                    revision: HEAD
                    pathParamPrefix: fleet
                    files:
                    - path: 'fleet/{{ "{{" }}if index .metadata.labels "local-cluster"{{ "}}" }}hubs/{{ $hub }}{{ "{{" }}else{{ "}}" }}{{ "{{" }}.name{{ "}}" }}{{ "{{" }}end{{ "}}" }}.yaml'
          - git:
              repoURL: '{{ .Values.gitRepo }}'
              revision: '{{ "{{" }}.revision{{ "}}" }}'
              directories:
              - path: 'stack/*'
  template:
    metadata:
      name: '{{ "{{" }}.path.basenameNormalized{{ "}}" }}-{{ "{{"}}.name{{ "}}" }}'
    spec:
      project: default
      source:
        repoURL: '{{ .Values.gitRepo }}'
        targetRevision: '{{ "{{" }}.revision{{ "}}" }}'
        path: '{{ "{{" }}.path.path{{ "}}" }}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: open-cluster-management
      syncPolicy:
        syncOptions:
        - RespectIgnoreDifferences=true
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
  templatePatch: |
    {{ "{{" }}- $name := .name {{ "}}" }}
    {{ "{{" }}- if index .metadata.labels "local-cluster" {{ "}}" }}
      {{ "{{" }}- $name = {{ $hub | quote }} {{ "}}" }}
    metadata:
      name: '{{ "{{" }}.path.basenameNormalized{{ "}}" }}-{{ "{{" }} $name {{ "}}" }}'
    {{ "{{" }}- end {{ "}}" }}

    spec:
      source:
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
          - values.yaml
          - ../../values.yaml
          {{ "{{" }}- range index . "valueFiles" {{ "}}" }}
          - ../../values/{{ "{{" }} . {{ "}}" }}
          {{ "{{" }}- end {{ "}}" }}
          - ../../values/clusters/{{ "{{" }} $name {{ "}}" }}.yaml
          valuesObject:
            {{ "{{" }}- range $k := list "version" "channel" {{ "}}" }}{{ "{{" }} with dig $k "" $ {{ "}}" }}
            {{ "{{" }} $k {{ "}}" }}: {{ "{{" }} . | quote {{ "}}" }}
            {{ "{{" }}- end {{ "}}" }}{{ "{{" }} end {{ "}}" }}
            selectedName: {{ "{{" }} $name {{ "}}" }}
            selectedId: {{ "{{" }} .metadata.labels.clusterID {{ "}}" }}
            selector:
              matchExpressions:
                name:
                  key: name
                  operator: In
                  values:
                    - {{ "{{" }} .name | quote {{ "}}" }}
