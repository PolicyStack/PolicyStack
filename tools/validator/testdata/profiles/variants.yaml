# POLICY081 coverage, second pass: the branches all-on.yaml cannot take at the same time.
stack:
  infraNodes:
    enabled: true
    policies:
      workloads:
        enabled: false
      restore:
        enabled: true
  storageNodes:
    enabled: true
    policies:
      baremetal:
        enabled: true
    config:
      nodes: [worker-0, worker-1, worker-2]
  nmstate:
    enabled: true
    policies:
      nncp:
        enabled: true
    config:
      hosts:
        worker-0:
          hostname: worker-0.example.com
          networking:
            interfaces:
              bond0: {mac: "aa:bb:cc:dd:ee:ff"}
