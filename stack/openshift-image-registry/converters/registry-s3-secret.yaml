{{- /*
Credentials and trust bundle for the NooBaa-backed registry.

Everything here is generated on the managed cluster - the OBC's credentials, the service CA, and the
ingress CA - so all of it stays ACM templating.

The trust bundle appends the ingress CA to the service CA because the NooBaa S3 endpoint is an apps
route. `default-ingress-cert` is used rather than `router-ca` because it tracks whichever cert is
actually in use; router-ca goes stale the moment the default ingress certificate is replaced -
including by our own cert-manager element.
*/ -}}
{{ "{{" }}- $caBundle := fromConfigMap "{{ .Parameters.namespace }}" "openshift-service-ca.crt" "service-ca.crt" {{ "}}" }}
{{ "{{" }}- $ingressCA := (lookup "v1" "ConfigMap" "openshift-config-managed" "default-ingress-cert") | default dict {{ "}}" }}
{{ "{{" }}- $ingressPEM := (index ($ingressCA.data | default dict) "ca-bundle.crt" | default "") {{ "}}" }}
{{ "{{" }}- if not (empty $ingressPEM) {{ "}}" }}{{ "{{" }}- $caBundle = printf "%s\n%s" (trim $caBundle) (trim $ingressPEM) {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    metadata:
      name: image-registry-private-configuration-user
      namespace: {{ .Parameters.namespace }}
    type: Opaque
    data:
      REGISTRY_STORAGE_S3_ACCESSKEY: {{ "{{" }} fromSecret "{{ .Parameters.namespace }}" "{{ .Parameters.claimName }}" "AWS_ACCESS_KEY_ID" {{ "}}" }}
      REGISTRY_STORAGE_S3_SECRETKEY: {{ "{{" }} fromSecret "{{ .Parameters.namespace }}" "{{ .Parameters.claimName }}" "AWS_SECRET_ACCESS_KEY" {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ .Parameters.trustBundleName }}
      namespace: openshift-config
    data:
      ca-bundle.crt: |
        {{ "{{" }} $caBundle | autoindent {{ "}}" }}
