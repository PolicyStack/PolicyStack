{{- /*
Namespace <cluster>, which the ClusterInstance and every object it renders live in, the pull secret
and the BMC secret every node's BareMetalHost logs in with. A missing key would copy as empty and
fail only at registration, after the spec is frozen, so it fails here.
*/ -}}
{{- $s := .Values.install.siteconfig }}
{{- $c := include "lifecycle.cluster" . }}
{{- $bmc := printf "%q %q" (required "install.siteconfig.bmcCredential.namespace is required" $s.bmcCredential.namespace) (required "install.siteconfig.bmcCredential.name is required" $s.bmcCredential.name) }}
{{ include "lifecycle.refuse" . }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Namespace
    metadata:
      name: {{ $c }}
{{ include "lifecycle.pullSecret" (dict "root" . "namespace" $c) }}
{{ "{{-" }} if not (and (fromSecret {{ $bmc }} "username") (fromSecret {{ $bmc }} "password")) {{ "}}" }}{{ "{{" }} fail "install.siteconfig.bmcCredential needs a non-empty username and password" {{ "}}" }}{{ "{{-" }} end {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: Opaque
    metadata:
      name: {{ $c }}-bmc
      namespace: {{ $c }}
    data:
      {{- range list "username" "password" }}
      {{ . }}: '{{ "{{" }} fromSecret {{ $bmc }} {{ . | quote }} {{ "}}" }}'
      {{- end }}
