name: Policy Validate

on:
  pull_request:
    paths:
      - 'stack/**'
      - 'values/**'
      - 'values.yaml'
      - 'fleet/**'
      - 'tools/validator/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'stack/**'
      - 'values/**'
      - 'values.yaml'
      - 'fleet/**'
      - 'tools/validator/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep on the Helm major that the hub's Argo CD renders with. Argo CD 3.4 and earlier bundle Helm 3.
  HELM_VERSION: v3.22.0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and origin/* branches for the pin check
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/validator/go.mod
          cache-dependency-path: tools/validator/go.sum

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Vet, test and build validator
        run: make -C tools/validator lint test build

      # POLICY080 is skipped: the chart only emits Policy, PlacementBinding and Placement, which
      # kubeconform has no schemas for, so it would validate nothing.
      - name: Validate policies
        run: |
          tools/validator/bin/policystack-validator \
            --github \
            --repo-root . \
            --extra-values tools/validator/testdata/baseline.yaml \
            --skip POLICY080

      # Upstream ships no fleet files. A fork validates its real fleet here.
      - name: Validate fleet
        if: hashFiles('fleet/*.yaml', 'fleet/hubs/*.yaml') != ''
        run: |
          tools/validator/bin/policystack-validator \
            --github \
            --repo-root . \
            --fixtures-dir fleet \
            --extra-values tools/validator/testdata/baseline.yaml \
            --skip POLICY080

      # Catches typos and pins like gh-pages. A pinned branch deleted later still freezes the
      # ApplicationSet (docs/applicationset.md#revision).
      - name: Check fleet pins
        run: |
          shopt -s nullglob
          failed=0
          for f in fleet/*.yaml fleet/hubs/*.yaml; do
            rev=$(yq '.revision' "$f") || { echo "::error file=$f::not valid YAML"; failed=1; continue; }
            # The forms Argo CD resolves: a tag, a branch, or a commit SHA of 5 to 40 hex characters.
            found=0
            for ref in "refs/tags/$rev" "refs/remotes/origin/$rev"; do
              git show-ref -q --verify "$ref" && git cat-file -e "$ref:stack" 2>/dev/null && found=1 && break
            done
            if [ "$found" = 0 ] && [[ $rev =~ ^[0-9a-f]{5,40}$ ]]; then
              git cat-file -e "$rev:stack" 2>/dev/null && found=1
            fi
            if [ "$found" = 0 ]; then
              echo "::error file=$f::revision '$rev' is not a tag, branch or commit SHA of this repository with a stack/ directory"
              failed=1
            fi
          done
          exit "$failed"
