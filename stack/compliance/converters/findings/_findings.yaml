{{- /*
One inform violation per result that failed and is not waived. INCONSISTENT counts only when a node
failed, since most are NOT-APPLICABLE on one role. ERROR, on the result or a node, means the check
did not run, so a waiver does not hide it.
*/ -}}
{{ "{{" }}- $waived := {{ include "compliance.waivedRules" . }} {{ "}}" }}
{{ "{{" }}- range (lookup "compliance.openshift.io/v1alpha1" "ComplianceCheckResult" "{{ .Config.namespace }}" "" "compliance.openshift.io/suite={{ .Config.binding }},compliance.openshift.io/check-status in (FAIL,ERROR,INCONSISTENT),{{ .Config.severity }}").items {{ "}}" }}
{{ "{{" }}- $nodes := cat (dig "metadata" "annotations" "compliance.openshift.io/inconsistent-source" "" .) (dig "metadata" "annotations" "compliance.openshift.io/most-common-status" "" .) {{ "}}" }}
{{ "{{" }}- if or (eq .status "ERROR") (regexMatch "ERROR" $nodes) (and (not (has (dig "metadata" "annotations" "compliance.openshift.io/rule" "" .) $waived)) (or (eq .status "FAIL") (regexMatch "FAIL" $nodes))) {{ "}}" }}
- complianceType: mustnothave
  objectDefinition:
    apiVersion: compliance.openshift.io/v1alpha1
    kind: ComplianceCheckResult
    metadata:
      name: {{ "{{" }} .metadata.name {{ "}}" }}
      namespace: {{ .Config.namespace }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
