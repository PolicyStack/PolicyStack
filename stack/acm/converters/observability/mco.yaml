{{- /*
Observability: the pull secret, the Thanos object storage config and the MultiClusterObservability.

The pull secret and bucket credentials exist only on the managed cluster, so they are read with ACM
templating; sizing comes from values.

A raw list so ACM resolves it all or nothing: a failed bucket lookup applies nothing, and the
MultiClusterObservability never exists without its Thanos secret.
*/ -}}
{{- $o := .Config.observability }}
{{- $ns := $o.namespace }}
{{- $bucket := $o.bucket }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    metadata:
      name: multiclusterhub-operator-pull-secret
      namespace: {{ $ns }}
    type: kubernetes.io/dockerconfigjson
    data:
      .dockerconfigjson: '{{ "{{" }} fromSecret "openshift-config" "pull-secret" ".dockerconfigjson" {{ "}}" }}'
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    metadata:
      name: thanos-object-storage
      namespace: {{ $ns }}
    type: Opaque
    stringData:
      thanos.yaml: |
        type: s3
        config:
          bucket: {{ "{{" }} fromConfigMap "{{ $ns }}" "{{ $bucket }}" "BUCKET_NAME" {{ "}}" }}
          endpoint: '{{ "{{" }} fromConfigMap "{{ $ns }}" "{{ $bucket }}" "BUCKET_HOST" {{ "}}" }}:{{ "{{" }} fromConfigMap "{{ $ns }}" "{{ $bucket }}" "BUCKET_PORT" {{ "}}" }}'
          insecure: false
          access_key: {{ "{{" }} fromSecret "{{ $ns }}" "{{ $bucket }}" "AWS_ACCESS_KEY_ID" | base64dec {{ "}}" }}
          secret_key: {{ "{{" }} fromSecret "{{ $ns }}" "{{ $bucket }}" "AWS_SECRET_ACCESS_KEY" | base64dec {{ "}}" }}
          http_config:
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
- complianceType: musthave
  objectDefinition:
    apiVersion: observability.open-cluster-management.io/v1beta2
    kind: MultiClusterObservability
    metadata:
      name: observability
    spec:
      observabilityAddonSpec:
        enableMetrics: {{ $o.enableMetrics }}
        interval: {{ $o.interval }}
      storageConfig:
        metricObjectStorage:
          name: thanos-object-storage
          key: thanos.yaml
        storageClass: {{ $o.storageClass }}
        alertmanagerStorageSize: {{ $o.alertmanagerStorageSize }}
        compactStorageSize: {{ $o.compactStorageSize }}
        receiveStorageSize: {{ $o.receiveStorageSize }}
        ruleStorageSize: {{ $o.ruleStorageSize }}
        storeStorageSize: {{ $o.storeStorageSize }}
