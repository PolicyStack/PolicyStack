{{- /*
IPAddressPool objects, one per entry in config.ipAddressPools. The key is the object name and the
value is the spec verbatim, so addressing stays reviewable in values.
*/ -}}
{{- range $name, $spec := .Config.ipAddressPools }}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ $name }}
  namespace: metallb-system
spec: {{- toYaml $spec | nindent 2 }}
{{- end }}
