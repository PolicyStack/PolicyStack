name: Documentation Check

on:
  pull_request:
    paths:
      - 'stack/**'
      - 'tools/doc-generator.py'
      - 'tools/test_doc_generator.py'
      - 'tools/requirements.txt'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'stack/**'
      - 'tools/doc-generator.py'
      - 'tools/test_doc_generator.py'
      - 'tools/requirements.txt'
      - '.github/workflows/docs-check.yml'
  # docs-update.yml dispatches this after committing, because its push does not trigger workflows.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: Test doc generator
        run: python -m unittest tools/test_doc_generator.py

      - name: Check docs are current
        run: |
          if ! python tools/doc-generator.py --check; then
            msg="Element READMEs are out of date. Run 'python tools/doc-generator.py' and commit stack/*/README.md, or add the update-docs label to the PR."
            echo "::error title=Documentation out of date::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
