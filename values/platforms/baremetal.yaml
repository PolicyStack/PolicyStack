# Selected by config entry `platform.<priority>: baremetal` in a fleet file.
# Bare metal has no MachineSets, so storage nodes are designated by labelling existing nodes and
# infra MachineSet creation is off entirely.
stack:
  infraNodes:
    toggles:
      aws: false
      vmware: false
  storageNodes:
    toggles:
      aws: false
      vmware: false
      baremetal: true
