stack:
  odf:
    enabled: false

    toggles:
      # PV-pool backing store for NooBaa. Not needed when fronting a cloud object store.
      noobaa-pvpool: false
      # Suppress the permanent NooBaa PodDisruptionBudgetAtLimit alert
      pdb-alert: true

    config:
      # balanced, lean or performance
      resourceProfile: balanced
      # StorageClass marked default cluster-wide. Every other class is marked non-default.
      defaultStorageClass: ocs-storagecluster-ceph-rbd
      # Allow OSDs to be unevenly distributed. Set true on bare metal when the storage node
      # count is not a multiple of three. Leave unset to let ODF decide.
      flexibleScaling: null
      # Ceph CSI node-plugin tolerations are not managed. The field lives on csi.ceph.io
      # OperatorConfig/ceph-csi-operator-config, owned by ceph-csi-operator; enforcing it caused an
      # update/violation flap, and the operator honours it only when the Driver sets no tolerations.
      # StorageCluster has no field for it: spec.placement excludes csi and spec.csi carries only
      # readAffinity. The node plugin already runs on every schedulable node; tolerating extra
      # taints is a per-cluster concern.

      # Whether ODF runs the NooBaa multicloud gateway (manage or ignore)
      multiCloudGateway: manage
      # The disks backing Ceph
      deviceSet:
        # Device sets per replica
        count: 2
        # OSD replicas. Three is the supported topology.
        replicas: 3
        # PVC size per OSD
        size: 2Ti
        # StorageClass the OSD PVCs come from. With the local-storage element, point this at
        # its LocalVolumeSet StorageClass and set size to "1" to consume whole devices.
        storageClassName: gp3-csi
      # Encryption at rest
      encryption:
        enabled: true
        clusterWide: true
        keyRotationSchedule: "@weekly"
      network:
        # Encrypt Ceph in-cluster traffic
        encryptionEnabled: true
      # NooBaa PV-pool sizing, used when the noobaa-pvpool toggle is on
      noobaa:
        numVolumes: 1
        volumeSize: 500Gi
        requests:
          cpu: 500m
          memory: 500Mi
        limits:
          cpu: 1000m
          memory: 4000Mi

    default:
      categories:
        - CP Contingency Planning
        - SC System and Communications Protection
      controls:
        - CP-9 System Backup
        - SC-28 Protection of Information at Rest
      standards:
        - NIST SP 800-53

    policies:
      - name: install
        enabled: true
        description: "Install and manage the ODF operator"
        remediationAction: enforce
        severity: medium
        disabled: false

      # The StorageCluster waits for dedicated storage nodes so OSDs land on them.
      # Requires the storage-nodes element enabled on this cluster; the dependency
      # below is satisfied only by a rendered policy. Dependencies have no toggle: to
      # run ODF without dedicated storage nodes, drop that dependency in your values.
      - name: cluster
        enabled: true
        description: "Deploy the StorageCluster"
        remediationAction: enforce
        severity: high
        disabled: false
        dependencies:
          - name: install
          # Cross-element: the storage-nodes element on this same cluster
          - name: ready
            element: storage-nodes

      - name: ready
        enabled: true
        description: "Reports NonCompliant until ODF has published its StorageClasses"
        # Other elements depend on this policy by name; it is the "storage is usable" contract.
        # It asserts StorageClasses, not StorageCluster conditions: every StorageCluster
        # condition tracks live Ceph health, and a flapping ACM dependency puts every
        # dependent policy into Pending. The `health` policy reports live health; nothing
        # depends on it.
        remediationAction: inform
        severity: medium
        disabled: false
        dependencies:
          - name: cluster

      # Live StorageCluster health, split out of `ready` so that its flapping cannot
      # pause the five elements that depend on `ready`. Nothing depends on this one.
      - name: health
        enabled: true
        description: "Reports live StorageCluster health"
        remediationAction: inform
        severity: medium
        disabled: false
        dependencies:
          - name: ready

      - name: config
        enabled: true
        description: "Default StorageClass, console plugin and NooBaa tuning"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: ready

    operatorPolicies:
      odf:
        enabled: true
        description: "OpenShift Data Foundation operator"
        displayName: "OpenShift Data Foundation"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-storage
        operatorGroup:
          name: openshift-storage-operatorgroup
          targetNamespaces:
            - openshift-storage
        subscription:
          channel: stable-4.20
          name: odf-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []

    configPolicies:
      - name: storagecluster
        enabled: true
        description: "StorageCluster and Ceph CSI placement"
        policyRef: cluster
        complianceType: musthave
        remediationAction: enforce
        severity: high
        waitForOperator: odf
        ignorePending: true
        templateNames:
          - name: storage-cluster
        enableTemplateParameters: true
        templateParameters: &odfParams
          name: ocs-storagecluster
          namespace: openshift-storage

      - name: available
        enabled: true
        description: "ODF StorageClasses exist"
        policyRef: ready
        complianceType: musthave
        remediationAction: inform
        severity: medium
        rawTemplate: true
        templateNames:
          - name: storage-cluster-ready
        enableTemplateParameters: true
        templateParameters: *odfParams

      - name: conditions
        enabled: true
        description: "StorageCluster reports Available and not Degraded"
        policyRef: health
        complianceType: musthave
        remediationAction: inform
        severity: medium
        templateNames:
          - name: storage-cluster-health
        enableTemplateParameters: true
        templateParameters: *odfParams

      - name: storageclass
        enabled: true
        description: "Default StorageClass selection"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        # One object per StorageClass the cluster has
        rawTemplate: true
        templateNames:
          - name: default-storageclass
        enableTemplateParameters: true
        templateParameters: *odfParams

      - name: console
        enabled: true
        description: "ODF console plugin"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: low
        templateNames:
          - name: odf-console-plugin
        enableTemplateParameters: true
        templateParameters: *odfParams

      - name: noobaa-pvpool
        enabled: true
        description: "NooBaa PV-pool backing store"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        templateNames:
          - name: noobaa-backing-store
        enableTemplateParameters: true
        templateParameters: *odfParams

      - name: pdb-alert
        enabled: true
        description: "Suppress the NooBaa PDB alert"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: low
        templateNames:
          - name: noobaa-pdb-alert
        enableTemplateParameters: true
        templateParameters: *odfParams
