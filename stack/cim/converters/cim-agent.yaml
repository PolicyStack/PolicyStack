{{- /*
AgentServiceConfig agent, which deploys the assisted service and image service. Any other name is
ignored. The operator owns the PVCs and only resizes them; storageClassName is omitted when empty,
since an empty string disables provisioning. The references to the cim-mirror ConfigMaps render
with them. A non-empty osImages replaces the operator's default list, which points at
mirror.openshift.com; siteconfig installs x86_64 only. musthave leaves an entry or reference removed
from values on the object.
*/ -}}
{{- $s := .Values.stack.cim.config.storage }}
apiVersion: agent-install.openshift.io/v1beta1
kind: AgentServiceConfig
metadata:
  name: agent
spec:
  {{- range $key, $size := dict "databaseStorage" $s.database "filesystemStorage" $s.filesystem "imageStorage" $s.images }}
  {{ $key }}:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ $size | quote }}
    {{- with $s.storageClass }}
    storageClassName: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- if include "cim.mirrors" . | fromJsonArray }}
  mirrorRegistryRef:
    name: assisted-mirror
  {{- end }}
  {{- if and .Values.stack.cim.config.osImages (dig "disconnected" "config" "trustedCA" "" .Values.stack) }}
  OSImageCACertRef:
    name: image-service-additional-ca
  {{- end }}
  {{- with .Values.stack.cim.config.osImages }}
  osImages:
    {{- range $version, $image := . }}
    - openshiftVersion: {{ $version | quote }}
      version: {{ required (printf "stack.cim.config.osImages.%s.version is required" $version) $image.version | quote }}
      url: {{ required (printf "stack.cim.config.osImages.%s.url is required" $version) $image.url | quote }}
      cpuArchitecture: x86_64
    {{- end }}
  {{- end }}
