{{- /*
Pin the ClusterVersion update graph: the fleet file's channel and config.upstream. Ungated, so a
disconnected cluster reaches its OSUS before the upgrade guard needs availableUpdates. An unset
field is left as the cluster has it.
*/ -}}
{{ "{{" }}- if {{ include "upgrade.standalone" . }} {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: config.openshift.io/v1
    kind: ClusterVersion
    metadata:
      name: version
    spec:
      {{- with .Values.channel }}
      channel: {{ . | quote }}
      {{- end }}
      {{- with .Values.stack.upgrade.config.upstream }}
      upstream: {{ . | quote }}
      {{- end }}
{{ "{{" }}- end {{ "}}" }}
