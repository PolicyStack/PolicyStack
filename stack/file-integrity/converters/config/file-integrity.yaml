{{- /*
ACM applies these in order in one evaluation, so the FileIntegrity's first database is built from this
AIDE configuration. The operator still runs one re-init when the instance is created.

Namespace: Red Hat's install procedure labels it privileged, because the AIDE daemon set mounts each
node's root filesystem. install-file-integrity-ns creates the namespace; this adds the label.

ConfigMap: spec.config replaces the operator's AIDE default outright, so this follows Red Hat's
custom-configuration procedure: the default, copied unchanged, then one negative rule per
config.aideExclusions path. AIDE checks negative rules after every other rule, so appending them works.
The operator prefixes /hostroot to each path. Never name it after a FileIntegrity, aide-reinit,
aide-pause, aide-init or aide-script: the operator owns those.

The default is the AIDE 0.16 one in file-integrity-operator 1.5.0 (28f1dbe1),
pkg/controller/fileintegrity/config_defaults.go. Diff it against that file on every operator release.
AIDE 0.17 removed verbose=, so every node Errored after an operator upgrade means the operator moved to
a newer AIDE: refresh this copy from the 0.18 default in the same file.

FileIntegrity: one instance for every node. Schedulable control plane nodes are also workers, so
per-role instances would scan them twice. Tolerating every taint reaches infra, storage and other
dedicated nodes, which the operator's default tolerations skip without reporting it. The node selector
keeps the pods off Windows nodes.
*/ -}}
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-file-integrity
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-integrity-aide
  namespace: openshift-file-integrity
data:
  aide.conf: |
    @@define DBDIR /hostroot/etc/kubernetes
    @@define LOGDIR /hostroot/etc/kubernetes
    database=file:@@{DBDIR}/aide.db.gz
    database_out=file:@@{DBDIR}/aide.db.gz.new
    gzip_dbout=yes
    verbose=5
    report_url=file:@@{LOGDIR}/aide.log.new
    report_url=stdout
    PERMS = p+u+g+acl+selinux+xattrs
    CONTENT_EX = sha512+ftype+p+u+g+n+acl+selinux+xattrs

    /hostroot/boot/        CONTENT_EX
    /hostroot/root/\..* PERMS
    /hostroot/root/   CONTENT_EX
    !/hostroot/root/\.kube
    !/hostroot/usr/src/
    !/hostroot/usr/tmp/

    /hostroot/usr/    CONTENT_EX
    # OpenShift specific excludes
    !/hostroot/opt/
    !/hostroot/var
    !/hostroot/etc/NetworkManager/system-connections/
    !/hostroot/etc/mtab$
    !/hostroot/etc/.*~
    !/hostroot/etc/kubernetes/static-pod-resources
    !/hostroot/etc/kubernetes/aide.*
    !/hostroot/etc/kubernetes/manifests
    !/hostroot/etc/kubernetes/kubelet-ca.crt
    !/hostroot/etc/docker/certs.d
    !/hostroot/etc/selinux/targeted
    !/hostroot/etc/openvswitch/conf.db
    !/hostroot/etc/kubernetes/cni/net.d
    !/hostroot/etc/kubernetes/cni/net.d/*
    !/hostroot/etc/machine-config-daemon/currentconfig$
    !/hostroot/etc/machine-config-daemon/node-annotation.json*
    !/hostroot/etc/pki/ca-trust/extracted/java/cacerts$
    !/hostroot/etc/cvo/updatepayloads
    !/hostroot/etc/cni/multus/certs
    !/hostroot/etc/kubernetes/compliance-operator
    !/hostroot/etc/kubernetes/node-feature-discovery
    !/hostroot/etc/mco/internal-registry-pull-secret.json$
    # Catch everything else in /etc
    /hostroot/etc/    CONTENT_EX
    {{- range $path, $reason := .Config.aideExclusions }}
    {{- if not (kindIs "invalid" $reason) }}
    {{- if not (regexMatch `^/\S+$` $path) }}{{ fail (printf "stack.fileIntegrity.config.aideExclusions: %q must be an absolute host path without spaces" $path) }}{{ end }}
    !{{ $path }}
    {{- end }}
    {{- end }}
---
apiVersion: fileintegrity.openshift.io/v1alpha1
kind: FileIntegrity
metadata:
  name: file-integrity
  namespace: openshift-file-integrity
spec:
  config:
    name: file-integrity-aide
    namespace: openshift-file-integrity
    gracePeriod: {{ .Config.gracePeriod }}
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists
