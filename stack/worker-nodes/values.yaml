stack:
  workerNodes:
    enabled: false

    config:
      # Replicas per worker MachineSet. Empty keeps the installer's value.
      replicas: ""
      # AWS instance type. Empty keeps the installer's value.
      instanceType: ""
      # vSphere vCPUs. Empty keeps the installer's value.
      numCPUs: ""
      # vSphere cores per socket
      numCoresPerSocket: ""
      # vSphere memory in MiB
      memoryMiB: ""
      # Maximum pods per node
      maxPods: 250
      # Memory reserved for system daemons
      systemReservedMemory: 1Gi
      # CPU reserved for system daemons
      systemReservedCpu: 250m
      # Memory reserved for the kubelet and container runtime
      kubeReservedMemory: 512Mi
      # CPU reserved for the kubelet and container runtime
      kubeReservedCpu: 250m
      # Hard eviction threshold for available memory
      evictionMemory: 500Mi

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - CM Configuration Management
      controls:
        - CM-6 Configuration Settings
      standards:
        - NIST SP 800-53

    policies:
      # Apply the kubelet configuration in config to the worker pool
      config:
        description: "Worker kubelet configuration"
        templates:
          worker-kubelet:
            description: "KubeletConfig for the worker pool"

      # Scale and resize the existing worker MachineSets. Opt-in: kubelet tuning is safe,
      # resizing MachineSets is not.
      machines:
        enabled: false
        description: "Worker MachineSet sizing"
        templates:
          scale:
            description: "Scale and resize existing worker MachineSets"

      # Report NonCompliant until the workers report the requested replica count
      ready:
        enabled: false
        description: "Reports NonCompliant until workers reach the requested count"
        remediationAction: inform
        dependencies:
          - name: machines
        templates:
          worker-replicas:
            description: "Worker MachineSet readiness"
