{{- /* Inform-only: the SecuredCluster has deployed and initialised. */ -}}
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
status:
  conditions:
    - type: Deployed
      status: 'True'
    - type: Initialized
      status: 'True'
    - type: Irreconcilable
      status: 'False'
    - type: ProxyConfigFailed
      status: 'False'
    - type: ReleaseFailed
      status: 'False'
---
{{- /*
Inform-only: sensor is ready. A refused or expired registration crash-loops its crs init container,
which SecuredCluster conditions do not show. A cluster still holding certificates from another
Central (moved, Central wiped) reports ready while disconnected; see docs/acs.md.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
  namespace: stackrox
status:
  readyReplicas: 1
