{{- /*
One ClusterRoleBinding per entry in config.collectorRoles, plus logging-collector-logs-writer for
pushing into Loki.
*/ -}}
{{- $cfg := .Config }}
{{- range $role := concat $cfg.collectorRoles (list "logging-collector-logs-writer") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $role }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role }}
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: openshift-logging
{{- end }}
