stack:
  nfd:
    enabled: false

    config:
      # Operand image. Empty uses the operator's digest, which disconnected mirrors redirect. An
      # existing NodeFeatureDiscovery keeps its spec.operand.image until you remove it.
      # Default changes to empty in 2.0.0.
      operandImage: registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.20
      # PCI fields in the node labels: class, vendor, device, subsystem_vendor, subsystem_device.
      # The NVIDIA GPU Operator needs [vendor], which labels GPUs pci-10de.present in place of
      # pci-0302.present. Default changes to [vendor] in 2.0.0.
      pciLabelFields:
        - class

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    # Parent policy grouping the NFD operator install and the NodeFeatureDiscovery instance
    policies:
      install:
        description: "Install and configure the Node Feature Discovery Operator and instance"
        templates:
          nfd-instance:
            # Wait for the operator's CSV to reach Succeeded; the CRD only exists after install
            waitForOperator: node-feature-discovery
            description: "Deploy the NodeFeatureDiscovery custom resource"
            evaluationInterval:
              compliant: "10m"
              noncompliant: "30s"

    # OperatorPolicy installing the NFD subscription
    operatorPolicies:
      node-feature-discovery:
        description: "Node Feature Discovery Operator"
        displayName: "Node Feature Discovery Operator"
        namespace: openshift-nfd
        clusterMonitoring: true
        operatorGroup:
          name: openshift-nfd-operator
          targetNamespaces:
            - openshift-nfd
        subscription:
          channel: stable
          name: nfd
        versions: []
