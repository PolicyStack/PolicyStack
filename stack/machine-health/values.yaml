stack:
  machineHealth:
    enabled: false

    # Which node roles are health-checked, and how aggressively
    config:
      worker:
        # Replace unhealthy worker nodes
        enabled: true
      infra:
        # Replace unhealthy infra nodes
        enabled: true
      storage:
        # Replace unhealthy storage nodes. Off by default; a rebuild triggers Ceph backfill.
        enabled: false
        # Longer than the default: storage nodes take longer to come back
        timeout: 600s
        maxUnhealthy: 1
        nodeStartupTimeout: 15m
      default:
        # How long a node may be NotReady before it is replaced
        timeout: 300s
        # Stop replacing once this many are unhealthy, to avoid cascading drains
        maxUnhealthy: 40%
        nodeStartupTimeout: 10m

    default:
      categories:
        - CP Contingency Planning
      controls:
        - CP-10 System Recovery and Reconstitution
      standards:
        - NIST SP 800-53

    policies:
      - name: config
        enabled: true
        description: "MachineHealthChecks per MachineSet"
        remediationAction: enforce
        severity: medium
        disabled: false

    configPolicies:
      - name: checks
        enabled: true
        description: "One MachineHealthCheck per discovered MachineSet"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        # Object count depends on how many MachineSets the cluster has
        rawTemplate: true
        templateNames:
          - name: machine-health-checks
        enableTemplateParameters: true
        templateParameters:
          namespace: openshift-machine-api
