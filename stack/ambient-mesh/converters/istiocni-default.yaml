{{- /* Istio CNI in ambient mode. */ -}}
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
spec:
  version: {{ .Values.stack.ambientMesh.config.istioVersion | quote }}
  profile: ambient
  namespace: istio-cni
  values:
    cni:
      ambient:
        reconcileIptablesOnStartup: true
