name: Render Diff

# Comments a table of what each real cluster's rendered Policies gain, lose or change with this PR,
# with a collapsed diff per cluster. Clusters come from fleet/ only; without fleet files, or when no
# cluster's render changes, there is no comment. Not a gate. See docs/workflows.md#render-diff.
# The render job runs PR code with a read-only token. The comment job runs none and is skipped for
# fork and Dependabot PRs, whose token is read-only; they get the render job's summary.
on:
  pull_request:
    paths:
      - 'stack/**'
      - 'lifecycle/**'
      - 'values/**'
      - 'values.yaml'
      - 'fleet/**'
      - '.github/workflows/render-diff.yml'
      - '.github/scripts/render-diff.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.22.0 # keep equal to validate.yml

jobs:
  render:
    name: Render diff
    # Argo CD reads fleet files from the default branch only.
    if: github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      body: ${{ steps.diff.outputs.body }}
    steps:
      # Checks out the PR merge commit: HEAD^1 is the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and origin/* branches to resolve pins
          persist-credentials: false

      # Without fleet files on either side there is no real cluster to render.
      - name: Find fleet files
        id: fleet
        run: |
          files=$(for c in HEAD^1 HEAD; do git ls-tree --name-only "$c" -- fleet/ fleet/hubs/; done | grep '\.yaml$' || true)
          if [ -n "$files" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "No fleet files, nothing to render." >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.fleet.outputs.found == 'true'
        with:
          go-version-file: tools/validator/go.mod
          cache-dependency-path: tools/validator/go.sum

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.fleet.outputs.found == 'true'
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build validator
        if: steps.fleet.outputs.found == 'true'
        run: make -C tools/validator build

      - name: Render and diff
        if: steps.fleet.outputs.found == 'true'
        id: diff
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/render-diff.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/render-diff/render-diff.patch
          archive: false

  comment:
    name: Comment
    needs: render
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: render-diff
          message: ${{ needs.render.outputs.body }}
          # No change, no comment. A no-op when there is none.
          delete: ${{ needs.render.outputs.changed != 'true' }}
