{{- /*
Trigger the upgrade to the fleet file's version. The target is a value; the current version and
whether an upgrade is already in progress are only readable on the managed cluster, so they stay
ACM templating.

The CVO follows desiredUpdate.image whenever it is set and never reads version, and oc and the
console leave the running image there. musthave keeps unlisted keys, so image and force are cleared
or the new version is silently ignored and a leftover force skips signature checks. architecture is
left alone; it is valid next to an empty image.

Only scalar spec fields are asserted. Completion is reported by the separate status policy because
ACM does not match status lists reliably.
*/ -}}
{{ "{{" }}- if {{ include "upgrade.standalone" . }} {{ "}}" }}
{{ "{{" }}- $target := "{{ .Values.version }}" {{ "}}" }}
{{ "{{" }}- $status := (index (lookup "config.openshift.io/v1" "ClusterVersion" "" "version" | default dict) "status" | default dict) {{ "}}" }}
{{ "{{" }}- $current := "" {{ "}}" }}
{{ "{{" }}- range $h := (index $status "history" | default list) {{ "}}" }}
{{ "{{" }}-   if and (eq $current "") (eq (index $h "state") "Completed") {{ "}}" }}{{ "{{" }}- $current = (index $h "version") {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- $progressing := false {{ "}}" }}
{{ "{{" }}- range $c := (index $status "conditions" | default list) {{ "}}" }}
{{ "{{" }}-   if and (eq (index $c "type") "Progressing") (eq (index $c "status") "True") {{ "}}" }}{{ "{{" }}- $progressing = true {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- if and (not $progressing) (or (eq $current "") (semverCompare (printf "> %s" $current) $target)) {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: config.openshift.io/v1
    kind: ClusterVersion
    metadata:
      name: version
    spec:
      desiredUpdate:
        version: '{{ "{{" }} $target {{ "}}" }}'
        image: ''
        force: false
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
