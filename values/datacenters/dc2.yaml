# Site values for dc2. Listed as datacenters/dc2.yaml in a fleet file's valueFiles.
#
# Holds facts about the site, not which elements run. Each cluster opts into elements from
# values/clusters/<cluster>.yaml, and these values only apply where the element is enabled.
stack:
  remediations:
    config:
      # dc2 pulls through a local mirror. Lists replace rather than merge across the cascade, so the
      # element's default registries have to be restated alongside the mirror.
      allowedRegistries:
        - mirror.dc2.example.com:8443
        - quay.io
        - registry.redhat.io
        - image-registry.openshift-image-registry.svc:5000
      allowedRegistriesForImport:
        - domainName: mirror.dc2.example.com:8443
          insecure: false
        - domainName: quay.io
          insecure: false
        - domainName: registry.redhat.io
          insecure: false
