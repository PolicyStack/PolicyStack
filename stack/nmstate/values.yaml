stack:
  nmstate:
    enabled: false

    # Node network topology. All NNCP generator input lives here so the topology is
    # reviewable in git.
    config:
      networking:
        # Nodes the shared NNCPs apply to. Empty means all nodes.
        nodeSelector: {}
        # Cluster-wide interfaces keyed by id, e.g.
        # bond0: {type: bond, mode: 802.3ad, ports: [ens1f0, ens1f1], ipv4: dhcp}
        interfaces: {}
        # OVS bridges keyed by id, e.g. br-ex: {ports: [bond0], stp: false}
        ovsBridges: {}
        # Static routes keyed by id, e.g. r1: {destination: 0.0.0.0/0, gateway: ..., interface: bond0}
        routes: {}
        # Resolver settings, e.g. {servers: [10.0.0.10], search: [example.com]}
        dns: {}
        # OVN localnet-to-bridge mappings, e.g. m1: {localnet: physnet, bridge: br-ex}
        ovnMappings: {}
      # Per-host overrides keyed by hostname. An interface declared here is rendered only
      # for that host, not cluster-wide. Use it for static addressing and per-host MACs.
      hosts: {}

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      install:
        description: "Install and manage the Kubernetes NMState operator"

      config:
        description: "Deploy the NMState instance"
        dependencies:
          - name: install
        templates:
          nmstate-instance:
            description: "NMState instance"
            waitForOperator: nmstate

      ready:
        description: "Reports NonCompliant until the nmstate webhook is Available"
        # A status can only be observed, so this policy never enforces
        remediationAction: inform
        dependencies:
          - name: config
        templates:
          webhook:
            description: "nmstate webhook readiness"

      # Generate NodeNetworkConfigurationPolicies from config.networking. Opt-in: the
      # operator and its CR are useful on their own, and node network topology is highly
      # cluster-specific.
      nncp:
        enabled: false
        description: "Node network configuration policies"
        # NNCPs are rejected by admission until the webhook is up
        dependencies:
          - name: ready
        templates:
          policies:
            description: "Generated NodeNetworkConfigurationPolicies"

    operatorPolicies:
      nmstate:
        description: "Kubernetes NMState operator"
        displayName: "Kubernetes NMState Operator"
        namespace: openshift-nmstate
        operatorGroup:
          name: openshift-nmstate
          targetNamespaces:
            - openshift-nmstate
        subscription:
          channel: stable
          name: kubernetes-nmstate-operator
        versions: []
