{{- /*
Inform-only readiness signal: Compliant once the API serving certificate reports Ready, so a
failing or expiring cert surfaces as NonCompliant.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-api-cert
  namespace: openshift-config
status:
  conditions:
    - type: Ready
      status: 'True'
