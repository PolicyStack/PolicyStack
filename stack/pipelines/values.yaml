stack:
  pipelines:
    enabled: false

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    # Parent policy grouping the Pipelines Operator install resources
    policies:
      - name: install
        enabled: true
        namespace: open-cluster-management
        description: "Install and manage the OpenShift Pipelines (Tekton) Operator"
        remediationAction: enforce
        severity: medium
        disabled: false

    # OperatorPolicy installing Pipelines cluster-wide in openshift-operators
    operatorPolicies:
      openshift-pipelines:
        enabled: true
        description: "OpenShift Pipelines (Tekton)"
        displayName: "Red Hat OpenShift Pipelines"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-operators
        operatorGroup:
          name: global-operators
        subscription:
          channel: pipelines-1.21
          name: openshift-pipelines-operator-rh
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []
