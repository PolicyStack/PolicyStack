{{- /*
Marks one StorageClass as the cluster default and every other as non-default.

The set of StorageClasses is only known at runtime (ODF creates several), so the loop is an ACM
template. The default class comes from values.
*/ -}}
{{- $cfg := .Values.stack.odf.config }}
{{ "{{" }}- range $sc := (lookup "storage.k8s.io/v1" "StorageClass" "" "").items {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: {{ "{{" }} $sc.metadata.name {{ "}}" }}
      annotations:
        storageclass.kubernetes.io/is-default-class: '{{ "{{" }} if eq $sc.metadata.name "{{ $cfg.defaultStorageClass }}" {{ "}}" }}true{{ "{{" }} else {{ "}}" }}false{{ "{{" }} end {{ "}}" }}'
{{ "{{" }}- end {{ "}}" }}
