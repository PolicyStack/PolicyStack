name: Upstream

# Checks of PolicyStack itself (policy-library, the validator, the launcher, the docs site), then
# its docs publish and releases. copier leaves this file out of a copy, so an adopter's repository
# runs only ci.yml, render-diff.yml and pr-title.yml. Upstream's main ruleset requires upstream, the
# check job here, next to ci and pr-title (docs/reference/ci.md#upstream). No paths filter, for the
# reason in ci.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pull request runs cancel each other. Runs on main queue, so a publish is never cut off; a newer
# pending run replaces an older one, which never reached release, and its dev docs are stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  # lib/policy-library: version bump and lint (lib/ct.yaml), then the helm-unittest suites in lib/tests.
  library:
    name: library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ct diffs against origin/main
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: helm github:helm-unittest/helm-unittest

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # A changed lib/policy-library without a version bump fails here.
      - run: ct lint --config lib/ct.yaml

      # The fixture takes the library through file://, into a gitignored charts/.
      - run: helm dependency update --skip-refresh lib/tests/fixtures/policy-stack-test

      - run: untt --strict lib/tests/fixtures/policy-stack-test

      # A test with no stored snapshot writes one and passes, so it must have been committed.
      - run: |
          if [[ -n $(git status --porcelain -- lib/tests) ]]; then
            git status --porcelain -- lib/tests
            echo "::error title=Snapshots::Run untt locally and commit lib/tests/**/__snapshot__."
            exit 1
          fi

  # tools/validator: lint, the Go tests, the stable gate's tests, and crds/ against the files the
  # Makefile pins.
  validator:
    name: validator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: go helm golangci-lint

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('tools/validator/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # golangci-lint (gofmt and goimports included), go mod tidy -diff, govulncheck.
      - run: make -C tools/validator lint

      - run: make -C tools/validator test

      # .github/scripts/stable-gate.sh against one edited clone per case (docs/reference/ci.md#stable).
      - name: Stable gate
        if: ${{ !cancelled() }}
        run: make -C tools/validator build && .github/scripts/stable-gate-test.sh

      # A changed CRD pin without the refetched files, or an edited file under crds/.
      - name: CRDs match their pins
        if: ${{ !cancelled() }}
        run: |
          make -C tools/validator crds
          if [[ -n $(git status --porcelain -- tools/validator/crds) ]]; then
            git status --porcelain -- tools/validator/crds
            echo "::error title=CRDs::Run make -C tools/validator crds and commit tools/validator/crds."
            exit 1
          fi

  # tools/policystack: uv.lock matches pyproject.toml, and the tests pass. The catalog tests read
  # this checkout's stack/ and values/; the flow tests run install, add and update through copier
  # against a synthetic upstream built with this checkout's copier.yml.
  launcher:
    name: launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python uv

      - run: uv lock --check --project tools/policystack

      - run: uv run --frozen --group dev --project tools/policystack pytest -q tools/policystack/tests

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python

      - run: pip install -r tools/requirements.txt -r tools/requirements-docs.txt

      - run: python -m unittest tools/test_doc_generator.py

      # Fails on a relative .md link or anchor that does not resolve, or a missing snippet.
      - run: zensical build --strict

  # The required check. A failed, cancelled or skipped job above turns it red.
  upstream:
    name: upstream
    if: always()
    needs: [library, validator, launcher, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  # Opens the release PR and, once it merges, tags it vX.Y.Z and creates the GitHub release
  # (docs/contributing.md#releases). An App token, so CI runs on the release PR: GITHUB_TOKEN's PRs
  # start no workflow, and ci, upstream and pr-title are required.
  release:
    name: release
    if: github.event_name == 'push' && github.repository == 'PolicyStack/PolicyStack'
    needs: upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its deployment branch policy releases the App key to main only.
    environment: release
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please/config.json
          manifest-file: .release-please/manifest.json

  # Builds the versioned site with mike into a one-commit gh-pages bundle. No token here: mike and
  # Zensical are pip-installed code. dev follows main; latest is X.Y, built from the newest vX.Y.Z
  # tag. The tag is looked up on every run, not read from release's outputs, so a release whose
  # pages or publish failed is deployed by the next main push. Skipped with release, so on forks
  # too: they have neither the App nor the gh-pages ruleset.
  pages:
    name: pages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: python

      - run: pip install -r tools/requirements-docs.txt

      # --alias-type copy: branch-published Pages does not serve mike's default symlinks. A flag, not
      # a zensical.toml setting, so it also applies to tags cut before this job existed.
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # --refmap=: no origin/gh-pages. mike refuses to commit when that ref is unrelated to the
          # local branch, which the switch below and every single-commit publish make it.
          git fetch -q --no-tags --depth=1 --refmap= origin gh-pages:gh-pages
          mkdir out && git rev-parse gh-pages > out/base
          # One-time switch from the unversioned site: mike starts from an empty tree. Delete after
          # the first publish.
          if ! git cat-file -e gh-pages:versions.json 2>/dev/null; then
            git branch -qf gh-pages "$(git commit-tree "$(git mktree </dev/null)" -m 'docs: switch to mike')"
          fi
          mike deploy --alias-type copy dev
          # Prereleases (vX.Y.Z-rc.N) get no docs of their own: dev covers them.
          tag=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' |
                grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          version=${tag#v}
          if ! git show gh-pages:versions.json |
               jq -e --arg v "$version" 'any(.[]; .title == $v and (.aliases | index("latest")))' >/dev/null; then
            git fetch -q --no-tags --depth=1 origin tag "$tag"
            git checkout -q "$tag"
            mike deploy --alias-type copy --update-aliases --title "$version" "${version%.*}" latest
            git switch -q --detach "$GITHUB_SHA"
          fi
          mike set-default latest
          # Root files mike does not write. CNAME: every publish replaces the branch, and with it the
          # file Pages settings write. .nojekyll: without it Pages runs the site through Jekyll.
          # 404.html sends unversioned links into latest.
          tree=$({ git ls-tree gh-pages | awk -F '\t' '$2 != "404.html" && $2 != "CNAME" && $2 != ".nojekyll"'
                   printf '100644 blob %s\t%s\n' \
                     "$(git hash-object -w .github/pages/404.html)" 404.html \
                     "$(echo policystk.io | git hash-object -w --stdin)" CNAME \
                     "$(git hash-object -w /dev/null)" .nojekyll; } | git mktree)
          # gh-pages stays one commit: Argo CD repo-servers fetch every branch. mike reads only the tree.
          git branch -qf gh-pages "$(git commit-tree "$tree" -m "docs: $(git rev-parse --short HEAD)")"
          git bundle create -q out/gh-pages.bundle gh-pages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-pages
          path: out/

  # A separate job so the write token never shares a runner with pip-installed build code.
  publish:
    name: publish
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its deployment branch policy releases the App key to main only.
    environment: github-pages
    steps:
      # The gh-pages ruleset lets only this App push. GITHUB_TOKEN cannot be a ruleset bypass actor,
      # and its pushes do not start a Pages build.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gh-pages

      # The lease fails this push, rather than overwrite, if gh-pages moved after pages fetched it.
      - env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git init -q
          git fetch -q gh-pages.bundle gh-pages
          git push -q --force-with-lease="refs/heads/gh-pages:$(cat base)" \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" FETCH_HEAD:refs/heads/gh-pages
