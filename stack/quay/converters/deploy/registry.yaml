apiVersion: v1
kind: Namespace
metadata:
  name: quay-enterprise
  labels:
    openshift.io/cluster-monitoring: "true"
---
{{- /* Quay's own config.yaml, delivered as the configBundleSecret the QuayRegistry references. */}}
{{- $cfg := .Config }}
apiVersion: v1
kind: Secret
metadata:
  name: quay-registry-config-bundle
  namespace: quay-enterprise
type: Opaque
stringData:
  config.yaml: |
    FEATURE_USER_INITIALIZE: {{ $cfg.featureUserInitialize }}
    BROWSER_API_CALLS_XHR_ONLY: {{ $cfg.browserApiCallsXhrOnly }}
    FEATURE_USER_CREATION: {{ $cfg.featureUserCreation }}
    SUPER_USERS:
      {{- range $u := $cfg.superUsers }}
      - {{ $u }}
      {{- end }}
---
{{- /*
QuayRegistry. The managed component set differs most between clusters (external Postgres or
object storage, no Clair), so it comes from values.
*/}}
{{- $cfg := .Config }}
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: registry
  namespace: quay-enterprise
spec:
  configBundleSecret: quay-registry-config-bundle
  components:
    {{- range $kind, $managed := $cfg.components }}
    - kind: {{ $kind }}
      managed: {{ $managed }}
    {{- end }}
