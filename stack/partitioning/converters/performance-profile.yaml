{{- /*
PerformanceProfile pinning platform workloads to the reserved CPU set and leaving the isolated set
for application workloads.

All inputs are Helm values, so it resolves at render time without ACM templating.

reservedCpus and isolatedCpus have no safe defaults and a wrong value degrades the node, so leaving
either unset fails the render.
*/ -}}
{{- $cfg := .Values.stack.partitioning.config }}
{{- if not $cfg.reservedCpus }}
  {{- fail "stack.partitioning.config.reservedCpus must be set (e.g. \"0-1\") when this element is enabled" }}
{{- end }}
{{- if not $cfg.isolatedCpus }}
  {{- fail "stack.partitioning.config.isolatedCpus must be set (e.g. \"2-31\") when this element is enabled" }}
{{- end }}
{{- $nodeSelector := $cfg.nodeSelector | default dict }}
{{- $mcpSelector := $cfg.machineConfigPoolSelector | default $nodeSelector }}
apiVersion: performance.openshift.io/v2
kind: PerformanceProfile
metadata:
  name: {{ .Parameters.name }}
spec:
  cpu:
    reserved: {{ $cfg.reservedCpus | quote }}
    isolated: {{ $cfg.isolatedCpus | quote }}
  nodeSelector:
    {{- if $nodeSelector }}
    {{- toYaml $nodeSelector | nindent 4 }}
    {{- else }}
    node-role.kubernetes.io/master: ""
    {{- end }}
  machineConfigPoolSelector:
    {{- if $mcpSelector }}
    {{- toYaml $mcpSelector | nindent 4 }}
    {{- else }}
    pools.operator.machineconfiguration.openshift.io/master: ""
    {{- end }}
  {{- if $cfg.numaTopologyPolicy }}
  numa:
    topologyPolicy: {{ $cfg.numaTopologyPolicy }}
  {{- end }}
  {{- if $cfg.realTimeKernel }}
  realTimeKernel:
    enabled: true
  {{- end }}
  globallyDisableIrqLoadBalancing: {{ $cfg.globallyDisableIrqLoadBalancing | default false }}
  {{- with $cfg.hugepages }}
  hugepages:
    {{- if .defaultSize }}
    defaultHugepagesSize: {{ .defaultSize }}
    {{- end }}
    {{- if .pages }}
    pages:
      {{- range $p := .pages }}
      - size: {{ $p.size }}
        count: {{ $p.count }}
        {{- if $p.node }}
        node: {{ $p.node }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
