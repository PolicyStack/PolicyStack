# The upgrade test's cluster before the release's Policies reach it: what templates look up, and
# values set by hand that an update must leave alone.
apiVersion: config.openshift.io/v1
kind: Infrastructure
metadata: {name: cluster}
status: {infrastructureName: demo}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: compat-site, namespace: default}
data: {mirror: "mirror.example:8443"}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: default-ingress-cert, namespace: openshift-config-managed}
data: {ca-bundle.crt: ingress}
---
apiVersion: config.openshift.io/v1
kind: Image
metadata: {name: cluster}
spec:
  additionalTrustedCA: {name: registry-cas}
  allowedRegistriesForImport: [{domainName: by-hand.example, insecure: false}]
  registrySources:
    allowedRegistries: [by-hand.example]
    insecureRegistries: [lab.example]
---
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata: {name: logging, namespace: openshift-logging}
spec:
  managementState: Managed
  serviceAccount: {name: collector}
  outputs: [{name: by-hand, type: syslog}]
  pipelines:
    - {name: logs-to-loki, inputRefs: [audit], outputRefs: [logging-lokistack, by-hand]}
---
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata: {name: registry, namespace: quay-enterprise}
spec:
  components: [{kind: cache, managed: false}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: registry-quay, namespace: quay-enterprise}
spec: {host: quay.example}
---
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata: {name: demo-worker-a, namespace: openshift-machine-api}
spec:
  template:
    spec:
      providerSpec:
        value:
          ami: {id: ami-1}
          instanceType: m6i.4xlarge
          userDataSecret: {name: worker-user-data}
          credentialsSecret: {name: cloud-credentials}
          placement: {availabilityZone: us-east-1a, region: us-east-1}
          blockDevices: [{ebs: {encrypted: true, iops: 0, volumeType: gp3, volumeSize: 120, kmsKey: {arn: ""}}}]
          securityGroups: [{filters: [{name: "tag:Name", values: [demo-node]}]}]
          subnet: {filters: [{name: "tag:Name", values: [demo-subnet-private-us-east-1a]}]}
          tags: [{name: owner, value: demo}]
          numCPUs: 8
          numCoresPerSocket: 2
          memoryMiB: 32768
          diskGiB: 120
          template: rhcos
          workspace: {server: vc.example}
          network: {devices: [{networkName: vm}]}
