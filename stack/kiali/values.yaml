stack:
  kiali:
    enabled: false

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      - name: install
        enabled: true
        description: "Install and manage Kiali Operator provided by Red Hat"
        remediationAction: enforce
        severity: medium
        disabled: false

    operatorPolicies:
      kiali:
        enabled: true
        description: "Kiali service mesh observability console"
        # Must match the CSV displayName so the generated status check can find it
        displayName: "Kiali Operator"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-operators
        operatorGroup:
          # Reuse the namespace's existing cluster-scoped OperatorGroup; a second one breaks OLM
          name: global-operators
        subscription:
          channel: stable
          name: kiali-ossm
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []
