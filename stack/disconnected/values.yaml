stack:
  disconnected:
    enabled: false

    # Site data, usually set once in a datacenter layer
    config:
      # Objects from oc-mirror's working-dir/cluster-resources, applied as they are: ImageDigestMirrorSet, ImageTagMirrorSet, CatalogSource, ClusterCatalog and the release signature ConfigMaps
      clusterResources: []
      # Mirror registry CAs for image pulls, keyed by host, or host..port for a port (registry.example.com..8443). Values are PEM.
      registryCAs: {}
      # PEM bundle added to the cluster trust bundle, e.g. the CA of an internal Git or Helm server. Appended to the CAs in user-ca-bundle, which is never changed.
      trustedCA: ""

    default:
      remediationAction: enforce
      severity: high
      categories:
        - CM Configuration Management
        - SC System and Communications Protection
      controls:
        - CM-2 Baseline Configuration
        - SC-7 Boundary Protection
      standards:
        - NIST SP 800-53

    policies:
      # Apply the objects in config.clusterResources
      resources:
        description: "Mirror sets and mirrored catalogs from oc-mirror"
        templates:
          objects:
            description: "oc-mirror cluster resources"

      # Trust the mirror registries' CAs for image pulls
      registry-ca:
        description: "Trust the mirror registries' CAs"
        templates:
          trust:
            description: "Registry CA ConfigMap and image config"

      # Add config.trustedCA to the cluster trust bundle through ConfigMap trusted-cas (Proxy trustedCA)
      trusted-ca:
        description: "Add a CA bundle to the cluster trust bundle"
        templates:
          proxy:
            description: "trusted-cas ConfigMap and Proxy trustedCA"

      # Disable the default OperatorHub catalog sources, which cannot be reached
      operatorhub:
        description: "Disable the default OperatorHub catalog sources"
        severity: medium
        templates:
          sources:
            description: "OperatorHub default sources"
