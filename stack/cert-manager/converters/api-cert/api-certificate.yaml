{{- /*
cert-manager-managed serving certificate for the external API endpoint (api.<domain>:6443).

Safety:
  - The Certificate is always created; the APIServer is patched only once it reports Ready.
  - namedCertificates is additive and SNI-matched, so the internal cert and api-int are untouched
    and a bad cert cannot block internal access. Never add api-int to namedCertificates.
  - The secretName is stable across renewals, so the API server hot-reloads; only the first add
    rolls out a new revision.

Helm resolves .Config/.Values at render time. The escaped templates are resolved by ACM on the
managed cluster, where the base domain and the readiness gate are known.
*/ -}}
{{- $cfg := .Config }}
{{ "{{" }}- $baseDomain := dig "spec" "baseDomain" "" ((lookup "config.openshift.io/v1" "DNS" "" "cluster") | default dict) {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: cert-manager-api-cert
      namespace: openshift-config
    spec:
      secretName: cert-manager-api-cert
      duration: {{ $cfg.leafDuration }}
      renewBefore: {{ $cfg.leafRenewBefore }}
      privateKey:
        algorithm: {{ $cfg.keyAlgorithm }}
        size: {{ $cfg.keySize }}
      dnsNames:
        - api.{{ "{{" }} $baseDomain {{ "}}" }}
        {{- range $san := (($cfg.apiCert).extraSANs) | default list }}
        - {{ $san }}
        {{- end }}
      issuerRef:
        name: {{ ((($cfg.apiCert).issuer).name) | default $cfg.caName }}
        kind: {{ ((($cfg.apiCert).issuer).kind) | default "ClusterIssuer" }}
        group: {{ ((($cfg.apiCert).issuer).group) | default "cert-manager.io" }}
{{ "{{" }}- $conds := dig "status" "conditions" (list) ((lookup "cert-manager.io/v1" "Certificate" "openshift-config" "cert-manager-api-cert") | default dict) {{ "}}" }}
{{ "{{" }}- $ready := false {{ "}}" }}
{{ "{{" }}- range $c := $conds {{ "}}" }}{{ "{{" }}- if and (eq (dig "type" "" $c) "Ready") (eq (dig "status" "" $c) "True") {{ "}}" }}{{ "{{" }}- $ready = true {{ "}}" }}{{ "{{" }}- end {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- if $ready {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: config.openshift.io/v1
    kind: APIServer
    metadata:
      name: cluster
    spec:
      servingCerts:
        namedCertificates:
          - names:
              - api.{{ "{{" }} $baseDomain {{ "}}" }}
            servingCertificate:
              name: cert-manager-api-cert
{{ "{{" }}- end {{ "}}" }}
