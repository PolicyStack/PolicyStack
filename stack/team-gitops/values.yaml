stack:
  teamGitops:
    enabled: false

    config:
      # Namespace prefix; each team gets <prefix>-<team>
      namespacePrefix: openshift-gitops
      # Name of the ArgoCD resource inside each team namespace
      argoName: argocd-dev
      # Teams to create, keyed by name. Values override `defaults` below, e.g.
      # `dev: {rbacPolicies: ["g, dev-leads, role:admin"]}` or
      # `test: {ha: true, resources: {server: {limits: {cpu: "1"}}}}`.
      # Which clusters get which teams is decided by where you set this in the cascade.
      teams: {}
      # Applied to every team unless the team overrides them
      defaults:
        # RBAC every team instance gets, before its own entries
        rbacPolicies:
          - "g, system:cluster-admins, role:admin"
        # Requests and limits per ArgoCD component
        resources:
          server:
            requests: {cpu: 125m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          repo:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1024Mi}
          dex:
            requests: {cpu: 125m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          redis:
            requests: {cpu: 125m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          ha:
            requests: {cpu: 125m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      # Requires the ArgoCD CRD from the gitops element on the same cluster.
      - name: teams
        enabled: true
        description: "Per-team ArgoCD instances"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: install
            element: gitops

    configPolicies:
      - name: instances
        enabled: true
        description: "Namespace and ArgoCD instance per team"
        policyRef: teams
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        # Two objects per team in config.teams
        rawTemplate: true
        templateNames:
          - name: team-argocd
