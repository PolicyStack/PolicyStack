stack:
  # @description: Kiali service mesh observability console
  kiali:
    # @desc: Master control to enable/disable all policies in this element
    enabled: false

    # @description: Default policy metadata applied unless overridden per-policy
    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    # @description: Parent policy grouping the operator install
    policies:
      - name: install
        enabled: true
        description: "Install and manage Kiali Operator provided by Red Hat"
        remediationAction: enforce
        severity: medium
        disabled: false

    # @description: OperatorPolicy installing the subscription
    operatorPolicies:
      - name: kiali
        enabled: true
        description: "Kiali service mesh observability console"
        # @desc: Must match the CSV displayName so the generated status check can find it
        displayName: "Kiali Operator provided by Red Hat"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-operators
        operatorGroup:
          # @desc: Reuse the namespace's existing cluster-scoped OperatorGroup; a second one breaks OLM
          name: global-operators
        subscription:
          channel: stable
          name: kiali-ossm
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        # @desc: Pin upgrades by listing approved CSVs under `versions:` instead of changing this
        upgradeApproval: Automatic
