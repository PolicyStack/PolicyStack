name: Policy Validate

on:
  pull_request:
    paths:
      - 'stack/**'
      - 'lifecycle/**'
      - 'tools/sample-element/**'
      - 'values/**'
      - 'values.yaml'
      - 'fleet/**'
      - 'install/**'
      - 'tools/validator/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'stack/**'
      - 'lifecycle/**'
      - 'tools/sample-element/**'
      - 'values/**'
      - 'values.yaml'
      - 'fleet/**'
      - 'install/**'
      - 'tools/validator/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep on the Helm major that the hub's Argo CD renders with. Argo CD 3.4 and earlier bundle Helm 3.
  HELM_VERSION: v3.22.0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and origin/* branches for the pin check
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/validator/go.mod
          cache-dependency-path: tools/validator/go.sum

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Vet and build validator
        id: build
        run: make -C tools/validator lint build

      # POLICY080 is skipped: the chart only emits Policy, PlacementBinding and Placement, which
      # kubeconform has no schemas for, so it would validate nothing. POLICY081 runs in the next
      # step, where every converter renders.
      - name: Validate policies
        run: |
          tools/validator/bin/policystack-validator \
            --github \
            --repo-root . \
            --extra-values tools/validator/testdata/baseline.yaml \
            --include-sample-element \
            --skip POLICY080,POLICY081

      # The profiles turn on every element and toggle (docs/validation.md#acm-templates). sort -u
      # drops what both report. Runs after a failed step too, so the PR shows its annotations.
      - name: Evaluate ACM templates
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          failed=0
          for profile in tools/validator/testdata/profiles/*.yaml; do
            tools/validator/bin/policystack-validator \
              --github \
              --repo-root . \
              --extra-values "tools/validator/testdata/baseline.yaml,$profile" \
              --only RENDER000,POLICY081 >> "$RUNNER_TEMP/acm.txt" || failed=1
          done
          sort -u "$RUNNER_TEMP/acm.txt"
          exit "$failed"

      # Upstream ships no fleet files. A fork validates its real fleet here.
      - name: Validate fleet
        if: hashFiles('fleet/*.yaml', 'fleet/hubs/*.yaml') != ''
        run: |
          tools/validator/bin/policystack-validator \
            --github \
            --repo-root . \
            --fixtures-dir fleet \
            --extra-values tools/validator/testdata/baseline.yaml \
            --skip POLICY080

      # Catches typos and pins like gh-pages. A pinned branch deleted later still freezes the
      # ApplicationSet (docs/applicationset.md#revision). A file that sets hub is also rendered
      # from lifecycle/ at its revision, which must read the top-level version key, and a file that
      # sets version or channel needs an upgrade element that reads them. A pin to the PR's base
      # branch is checked against the merge commit, which is what it resolves to once merged.
      - name: Check fleet pins
        run: |
          shopt -s nullglob
          # has <commit> <dir>...: true when every dir exists at commit. a|b accepts either.
          has() { local c=$1 d a; shift; for d; do for a in ${d//|/ }; do git cat-file -e "$c:$a" 2>/dev/null && continue 2; done; return 1; done; }
          failed=0
          for f in fleet/*.yaml fleet/hubs/*.yaml; do
            rev=$(yq '.revision' "$f") || { echo "::error file=$f::not valid YAML"; failed=1; continue; }
            dirs=(stack) need="a stack/ directory"
            if [ -n "$(yq '.hub // ""' "$f")" ]; then
              dirs+=(lifecycle/converters/hypershift) need="stack/ and lifecycle/converters/hypershift/ directories"
            fi
            if [ -n "$(yq '.version // .channel // ""' "$f")" ]; then
              dirs+=("stack/upgrade/templates/_helpers.tpl|stack/openshift-upgrade/templates/_helpers.tpl") need="$need, and an upgrade element that reads version"
            fi
            at=
            if [ -n "${GITHUB_BASE_REF:-}" ] && [ "$rev" = "$GITHUB_BASE_REF" ] && has HEAD "${dirs[@]}"; then
              at=HEAD
            fi
            # The forms Argo CD resolves: a tag, a branch, or a commit SHA of 5 to 40 hex characters.
            for ref in "refs/tags/$rev" "refs/remotes/origin/$rev"; do
              [ -z "$at" ] && git show-ref -q --verify "$ref" && has "$ref" "${dirs[@]}" && at=$ref && break
            done
            if [ -z "$at" ] && [[ $rev =~ ^[0-9a-f]{5,40}$ ]]; then
              has "$rev" "${dirs[@]}" && at=$rev
            fi
            if [ -z "$at" ]; then
              echo "::error file=$f::revision '$rev' is not a tag, branch or commit SHA of this repository with $need"
              failed=1
              continue
            fi
            # Argo CD skips a valueFiles entry missing at the revision, so the cluster silently loses it.
            mapfile -t layers < <(yq '.valueFiles[] | "values/" + .' "$f")
            missing=()
            for l in "${layers[@]}"; do git cat-file -e "$at:$l" 2>/dev/null || missing+=("$l"); done
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error file=$f::revision '$rev' has no ${missing[*]}, which Argo CD skips"
              failed=1
            fi
          done
          # A cluster file is read by fleet file name, so a misnamed one is skipped. Only a warning: a
          # tag-pinned cluster's file is committed before its fleet file
          # (docs/rollout.md#onboarding-a-cluster).
          if [ -d fleet ]; then
            for v in values/clusters/*.yaml; do
              n=${v##*/}
              [ -e "fleet/$n" ] || [ -e "fleet/hubs/$n" ] || echo "::warning file=$v::no fleet/$n or fleet/hubs/$n reads this cluster file"
            done
          fi
          exit "$failed"

      # install/ is run by hand on each hub, so nothing else renders it. The required values must fail
      # an install, and policyNamespace must equal the root values.yaml that the elements read. Runs
      # after a failed step too.
      - name: Check install charts
        if: ${{ !cancelled() }}
        run: |
          failed=0
          set -- --set hubName=ci --set gitRepo=https://example.invalid/r.git
          helm lint install "$@" || failed=1
          for v in hubName gitRepo; do
            helm template ci install "$@" --set "$v=" 2>&1 | grep -q "$v must be set" ||
              { echo "::error file=install/values.yaml::$v is not required"; failed=1; }
          done
          [ "$(yq .policyNamespace install/values.yaml)" = "$(yq .policyNamespace values.yaml)" ] ||
            { echo "::error file=install/values.yaml::policyNamespace differs from values.yaml"; failed=1; }
          kinds=$(helm template install/operators -f stack/acm/values.yaml -f stack/gitops/values.yaml |
            yq ea '[select(.kind) | .kind] | sort | join(",")')
          [ "$kinds" = "MultiClusterHub,Namespace,Namespace,OperatorGroup,OperatorGroup,Subscription,Subscription" ] ||
            { echo "::error file=install/operators/templates/operators.yaml::rendered $kinds"; failed=1; }
          exit "$failed"

      # Last, so a failing test does not hide the annotations above.
      - name: Test validator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -C tools/validator test
