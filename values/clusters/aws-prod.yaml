# Per-cluster values for the AWS test cluster.
#
# !! RENAME THIS FILE to match the ManagedCluster name exactly, and name the fleet file the same:
#      oc get managedcluster
#      git mv values/clusters/aws-prod.yaml values/clusters/<that-name>.yaml
#    The ApplicationSet runs with ignoreMissingValueFiles, so a filename that does not match the
#    cluster is silently skipped - none of the elements below would turn on and the test would look
#    like it simply did nothing. Verify with the valueFiles check in docs/values.md (Missing files).
#
# Fleet file this cluster needs, fleet/<that-name>.yaml on the default branch:
#   revision: main             # required; branch, tag or SHA
#   config:
#     environment.10: prod     # reuses values/environments/prod.yaml
#     datacenter.20: <dc>
#     platform.30: aws
#
# On top of the prod baseline (cert-manager CA, external-secrets, compliance scan,
# manual-remediations, cluster DNS), this cluster tests what bare metal could not.
stack:

  # --- newly testable now that a default StorageClass exists -------------------------------------

  # Prometheus/Thanos PVCs finally bind. Exercises the converter that merges into the existing
  # cluster-monitoring-config rather than replacing it, plus the dict-built UWM config.
  # StorageClass is pinned rather than left to the cluster default, so the test stays deterministic
  # even while ODF is installing.
  userWorkloadMonitoring:
    enabled: true
    config:
      storageClass: gp3-csi
      prometheus:
        retention: 24h
        storage: 10Gi
      thanosRuler:
        retention: 24h
        storage: 5Gi
      alertmanager:
        enabled: false

  # On bare metal this rendered an empty list because there are no MachineSets. On AWS it generates
  # one MachineHealthCheck per worker MachineSet, which exercises the runtime lookup loop.
  # NOTE: an unhealthy worker now gets REPLACED, and ODF OSDs live on workers here - maxUnhealthy
  # (40%) is what stops that cascading.
  machineHealthChecks:
    enabled: true

  # --- storage chain: the only thing that exercises cross-element dependencies for real ----------

  # Designate three existing workers as storage nodes rather than creating new MachineSets.
  # values/platforms/aws.yaml turns the `aws` toggle on, which would build new EC2 instances; this
  # overrides it to the label-existing-nodes path instead. The toggle is named `baremetal` because
  # that is the platform where it is normally needed - the behaviour is "label what is already
  # here", which is what we want on AWS too.
  storageNodes:
    enabled: true
    toggles:
      aws: false
      vmware: false
      baremetal: true
      ready: true
    config:
      # How many existing workers to designate. The converter prefers dedicated workers and will
      # not pick control-plane nodes; set config.nodes explicitly to choose them by name.
      replicas: 3

  # Deliberately tiny: 1 device set x 3 replicas x 100Gi = 300Gi of gp3, rather than the 12TiB the
  # element ships as a production default. `lean` keeps the Ceph pods small too.
  openshiftDataFoundation:
    enabled: true
    config:
      resourceProfile: lean
      deviceSet:
        count: 1
        replicas: 3
        size: 100Gi
        storageClassName: gp3-csi
      # Leave gp3-csi as the cluster default. The storageclass policy still runs - it relabels every
      # StorageClass - so the rawTemplate loop is exercised without changing cluster behaviour
      # mid-test. Flip to ocs-storagecluster-ceph-rbd once ODF is healthy if you want that too.
      defaultStorageClass: gp3-csi

  # Needed by loki for the ClusterLogForwarder CRD.
  openshiftLogging:
    enabled: true

  # Needed by loki for the console logging UI plugin.
  clusterObservability:
    enabled: true

  # The payoff: loki proves three cross-element `element:` dependencies at once -
  #   stack            -> ready@openshift-data-foundation
  #   forwarder        -> install@openshift-logging
  #   observability-ui -> install@cluster-observability
  # and its chunks land in a NooBaa bucket from ODF.
  loki:
    enabled: true
    toggles:
      forwarder: true
      observability-ui: true
    config:
      # Smallest supported LokiStack; intended for exactly this kind of test.
      size: 1x.demo
      storageClass: gp3-csi

  # --- already proven on the hub, cheap to run again --------------------------------------------
  nodeFeatureDiscovery:
    enabled: true
  nodeMaintenance:
    enabled: true
  openshiftPipelines:
    enabled: true

  # --- operator installs, to widen coverage of the OperatorPolicy path --------------------------
  kiali:
    enabled: true
  tempo:
    enabled: true
  opentelemetry:
    enabled: true
  servicemesh3operator:
    enabled: true
  trustedArtifactSigner:
    enabled: true
  developerHub:
    enabled: true
  devSpaces:
    enabled: true

  # Operator plus a light operand, so the waitForOperator gate gets exercised.
  mtv:
    enabled: true
  nmstate:
    enabled: true
    toggles:
      # NNCPs change host networking; leave them off on a cloud cluster.
      nncp: false

# Deliberately off, and why:
#
#   servicemesh3-ambient  - installs IstioCNI and ztunnel, which changes cluster networking. The
#                           four operators it depends on are enabled above, so turning this on is a
#                           one-liner when you want it (and it adds a 5-way cross-element test).
#   openshiftImageRegistry - the AWS installer already backs the registry with real S3. Switching it
#                           to a NooBaa bucket is a storage migration, not a config test.
#   certManager api-cert / ingress-cert, workerNodes kubelet, compliance remediate,
#   infraNodes, workloadPartitioning, openshiftUpgrade - held back by choice.
#   advancedClusterManagement / openshiftGitops - hub-only, and the hub has no ODF.
#   openshiftVirtualization - needs metal instances on AWS.
#   localStorage, lvm       - no extra disks; ODF consumes gp3-csi directly here.
