{{- /* Console shortcut to Central. The route host is only known on the managed cluster. */ -}}
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: acs
spec:
  location: ApplicationMenu
  text: Red Hat Advanced Cluster Security
  href: 'https://{{ "{{" }} (lookup "route.openshift.io/v1" "Route" "{{ .Parameters.namespace }}" "central").spec.host {{ "}}" }}'
  applicationMenu:
    section: Red Hat applications
    imageURL: {{ .Parameters.imageUrl }}
