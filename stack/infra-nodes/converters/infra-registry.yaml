{{- /* Pin the internal image registry onto infra nodes. */ -}}
apiVersion: imageregistry.operator.openshift.io/v1
kind: Config
metadata:
  name: cluster
spec:
  nodeSelector:
    node-role.kubernetes.io/{{ .Parameters.role }}: ""
  tolerations:
    - key: node-role.kubernetes.io/{{ .Parameters.role }}
      effect: NoSchedule
    - key: node-role.kubernetes.io/{{ .Parameters.role }}
      effect: NoExecute
