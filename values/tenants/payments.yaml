# Values for clusters that host the payments tenant. Selected by a custom config category in a
# fleet file:
#   tenant.40: payments  ->  values/tenants/payments.yaml
#
# Any <category>.<priority> config entry works the same way; the ApplicationSet appends
# "s" to the category for the directory name. Priority 40 layers this file above environment (10),
# datacenter (20) and platform (30), and below values/clusters/.
stack:
  # gitopsDev needs the ArgoCD CRD from the GitOps operator on the same cluster. The platform ArgoCD
  # instance is not needed for that, so only the operator is installed. ca-bundle and link configure
  # that instance, so they go off with it; link would otherwise wait on it indefinitely.
  openshiftGitops:
    enabled: true
    toggles:
      instance: false
      ca-bundle: false
      link: false

  # A team ArgoCD in openshift-gitops-payments. teams is a map, so a cluster file can add more teams
  # without restating this one.
  gitopsDev:
    enabled: true
    config:
      teams:
        payments:
          rbacPolicies:
            - "g, payments-admins, role:admin"
