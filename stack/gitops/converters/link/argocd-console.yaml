{{- /* Console link to ArgoCD. The route host is only known on the managed cluster, so the link
is skipped until the Route exists. */ -}}
{{- $cfg := .Config }}
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: openshift-gitops
spec:
  location: ApplicationMenu
  text: {{ .Config.consoleText | quote }}
  href: '{{ "{{" }} $host := (lookup "route.openshift.io/v1" "Route" "{{ $cfg.namespace }}" "openshift-gitops-server").spec.host {{ "}}" }}{{ "{{" }} skipObject (not $host) {{ "}}" }}https://{{ "{{" }} $host {{ "}}" }}'
  applicationMenu:
    section: Red Hat applications
    imageURL: https://upload.wikimedia.org/wikipedia/commons/3/3a/OpenShift-LogoType.svg
