{{- /*
The AnsibleAutomationPlatform operand, rendered entirely from values. Hub storage is selected by
config.hub.storage.type.
*/ -}}
{{- $cfg := .Config }}
{{- $hub := $cfg.hub | default dict }}
{{- $storage := $hub.storage | default dict }}
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: aap
  namespace: ansible-automation-platform
spec:
  redis_mode: {{ $cfg.redisMode }}
  controller:
    disabled: {{ $cfg.controller.disabled }}
  eda:
    disabled: {{ $cfg.eda.disabled }}
  lightspeed:
    disabled: {{ $cfg.lightspeed.disabled }}
  hub:
    disabled: {{ $hub.disabled }}
    {{- if eq ($storage.type | default "none") "file" }}
    storage_type: file
    file_storage_size: {{ $storage.size }}
    file_storage_storage_class: {{ $storage.storageClass }}
    {{- else if eq ($storage.type | default "none") "s3" }}
    storage_type: S3
    object_storage_s3_secret: s3-aap-odf
    {{- end }}
  {{- if or (eq ($storage.type | default "none") "s3") $cfg.customCaBundle }}
  # AAP needs the cluster's service CA and trusted CA bundle to talk to in-cluster S3 over TLS
  bundle_cacert_secret: user-ca-bundle
  {{- end }}
