# Per-cluster values for prod-east-1, a managed cluster on AWS.
#
# The file name must match the ManagedCluster name; a mismatch is skipped silently. Fleet file
# fleet/prod-east-1.yaml on the default branch:
#   revision: main             # required; branch, tag or SHA
#   channel: stable-4.20       # pins the update channel; version would also upgrade it
#   valueFiles:
#     - environments/prod.yaml
#     - datacenters/dc1.yaml
#     - platforms/aws.yaml
#
# values/environments/prod.yaml supplies the security baseline and values/platforms/aws.yaml selects
# the AWS MachineSet path for node elements. This file adds the cluster's own workload.
stack:
  # One m6i.2xlarge infra node in each of three zones. The `workloads` toggle moves ingress, the
  # registry, monitoring and GitOps onto them; the GitOps part needs openshiftGitops on this cluster.
  infraNodes:
    enabled: true
    config:
      replicas: 1
      zones:
        - us-east-1a
        - us-east-1b
        - us-east-1c
      instanceType: m6i.2xlarge

  # Replaces worker and infra nodes that stay NotReady.
  machineHealthChecks:
    enabled: true

  userWorkloadMonitoring:
    enabled: true
    config:
      prometheus:
        retention: 15d
        storage: 100Gi
