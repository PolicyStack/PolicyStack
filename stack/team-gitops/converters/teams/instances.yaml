{{- /*
A namespace and ArgoCD instance per team in config.teams.

The values cascade decides which clusters get which teams: define a team in values/acm/*.yaml for
the hub only, or in a cluster/environment file for other clusters.
*/ -}}
{{- $cfg := .Config }}
{{- $d := $cfg.defaults }}
{{- range $team, $spec := $cfg.teams }}
{{- $ns := printf "%s-%s" $cfg.namespacePrefix $team }}
{{- $res := mergeOverwrite (deepCopy $d.resources) ($spec.resources | default dict) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: {{ $cfg.argoName }}
  namespace: {{ $ns }}
spec:
  monitoring:
    enabled: false
  sso:
    provider: dex
    dex:
      openShiftOAuth: true
      resources: {{- toYaml $res.dex | nindent 8 }}
  rbac:
    defaultPolicy: ''
    scopes: '[groups]'
    policy: |
      {{- range $p := concat $d.rbacPolicies ($spec.rbacPolicies | default list) }}
      {{ $p }}
      {{- end }}
  server:
    route:
      enabled: true
    resources: {{- toYaml $res.server | nindent 6 }}
  repo:
    resources: {{- toYaml $res.repo | nindent 6 }}
  redis:
    resources: {{- toYaml $res.redis | nindent 6 }}
  ha:
    enabled: {{ $spec.ha | default false }}
    resources: {{- toYaml $res.ha | nindent 6 }}
{{- end }}
