stack:
  # @description: Drive and observe OpenShift cluster version upgrades
  openshiftUpgrade:
    # @desc: Master control to enable/disable all policies in this element
    enabled: true

    # @description: The fleet file's `version` and `channel` drive the upgrade (docs/upgrades.md). Each
    # @description: policy renders only when its input is set; turning a toggle off pauses it.
    toggles:
      # @desc: Pin the ClusterVersion channel to the fleet file's channel
      channel: true
      # @desc: Drive the cluster to the fleet file's version, and report on progress
      upgrade: true

    # @description: Upgrade graph
    config:
      # @desc: Upgrade graph service
      upstream: https://api.openshift.com/api/upgrades_info/v1/graph

    # @description: Default policy metadata applied unless overridden per-policy
    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      - name: channel
        enabled: true
        description: "Pin the cluster upgrade channel"
        remediationAction: enforce
        severity: medium
        disabled: false

      # @description: The whole upgrade flow (guard, trigger, completion) sits behind one switch, so
      # @description: none of it reports NonCompliant when no upgrade is targeted.
      - name: upgrade
        enabled: true
        description: "Drive the cluster to the target version and report on progress"
        remediationAction: enforce
        severity: high
        disabled: false

    configPolicies:
      - name: pin
        enabled: true
        description: "ClusterVersion channel"
        policyRef: channel
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: channel

      # @description: Inform-only reachability guard
      - name: guard
        enabled: true
        description: "Target version reachability"
        policyRef: upgrade
        complianceType: musthave
        remediationAction: inform
        severity: high
        rawTemplate: true
        templateNames:
          - name: upgrade-allowed

      # @description: Upgrade trigger, held until the guard reports the target is reachable
      - name: trigger
        enabled: true
        description: "ClusterVersion desiredUpdate"
        policyRef: upgrade
        complianceType: musthave
        remediationAction: enforce
        severity: high
        rawTemplate: true
        templateNames:
          - name: clusterversion
        # @desc: Never start an upgrade the guard says is invalid
        extraDependencies:
          - name: guard
        ignorePending: true

      # @description: Completion signal, only meaningful once the trigger has been applied
      - name: progress
        enabled: true
        description: "Upgrade completion"
        policyRef: upgrade
        complianceType: musthave
        remediationAction: inform
        severity: medium
        rawTemplate: true
        templateNames:
          - name: upgrade-status
        extraDependencies:
          - name: trigger
        ignorePending: true
