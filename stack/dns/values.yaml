stack:
  dns:
    enabled: false

    config:
      # Tolerations for the DNS daemonset. The default tolerates every taint so that
      # workloads on infra, storage and master nodes keep cluster DNS.
      tolerations:
        - operator: Exists

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      - name: config
        enabled: true
        description: "Cluster DNS node placement"
        remediationAction: enforce
        severity: medium
        disabled: false

    configPolicies:
      - name: tolerations
        enabled: true
        description: "DNS daemonset tolerations"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        templateNames:
          - name: dns-tolerations
