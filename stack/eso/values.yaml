stack:
  # @description: External Secrets Operator (Red Hat) for syncing secrets from external KMS providers
  eso:
    # @desc: Master control to enable/disable all policies in this element
    enabled: false

    # @description: Default policy metadata applied unless overridden per-policy
    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    # @description: Parent policy grouping the External Secrets Operator install resources
    policies:
      - name: install
        enabled: true
        namespace: open-cluster-management
        description: "Install and manage the External Secrets Operator"
        remediationAction: enforce
        severity: medium
        disabled: false

    # @description: OperatorPolicy installing the External Secrets subscription
    operatorPolicies:
      external-secrets:
        enabled: true
        description: "External Secrets Operator (Red Hat build)"
        displayName: "External Secrets Operator for Red Hat OpenShift"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: external-secrets-operator
        operatorGroup:
          # No targetNamespaces: this operator only advertises AllNamespaces, so an OperatorGroup
          # scoped to its own namespace makes the CSV fail with
          # "OwnNamespace InstallModeType not supported".
          name: external-secrets-operator-group
        subscription:
          channel: stable-v1
          name: openshift-external-secrets-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        # @desc: Allowed CSV names; empty allows whatever the channel offers. Pin per environment or cluster; also set subscription.startingCSV when the pin is not the channel head
        versions: []

    # @description: Adds the cluster-monitoring label to the operator namespace
    configPolicies:
      - name: external-secrets-ns-monitoring
        enabled: true
        description: "Adds openshift.io/cluster-monitoring label to operator namespace"
        policyRef: install
        complianceType: musthave
        remediationAction: enforce
        severity: low
        evaluationInterval:
          compliant: "10m"
          noncompliant: "30s"
        templateNames:
          - name: ns-monitoring-label
        enableTemplateParameters: true
        templateParameters:
          namespace: external-secrets-operator
