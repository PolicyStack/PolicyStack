stack:
  remediations:
    enabled: false

    config:
      # Registries permitted for `oc import-image`
      allowedRegistriesForImport:
        - domainName: quay.io
          insecure: false
        - domainName: registry.redhat.io
          insecure: false
      # Registries the cluster may pull from at runtime
      allowedRegistries:
        - quay.io
        - registry.redhat.io
        - image-registry.openshift-image-registry.svc:5000

    default:
      remediationAction: enforce
      severity: high
      categories:
        - CM Configuration Management
        - SI System and Information Integrity
      controls:
        - CM-2 Baseline Configuration
        - SI-7 Software, Firmware, and Information Integrity
      standards:
        - NIST SP 800-53

    policies:
      # Restrict the registries the cluster may pull and import from
      registries:
        description: "Restrict image registries the cluster may use"
        templates:
          allowlist:
            description: "Image registry allowlist"

      # Remove the Samples Operator and its imagestreams
      samples:
        description: "Remove the Samples Operator"
        severity: low
        templates:
          operator:
            description: "Samples Operator management state"
