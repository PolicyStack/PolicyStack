{{- /*
One MachineSet per availability zone for this node role on AWS. Cluster-specific fields (AMI, subnet,
security groups, tags, credentials, user-data) are cloned from the worker MachineSet, which is only
readable on the managed cluster, so they use ACM templating.

From values: replica count, zones (empty uses the worker MachineSet's zone), and instance/volume
sizing.

Portable across node elements. The role and config block are read from .Config.
*/ -}}
{{- $cfg := .Config }}
{{ "{{" }}- $role := "{{ .Config.role }}" {{ "}}" }}
{{ "{{" }}- $zonesWanted := (list{{ range $z := $cfg.zones }} {{ $z | quote }}{{ end }}) {{ "}}" }}
{{ "{{" }}- $infraId := (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName {{ "}}" }}
{{ "{{" }}- $workerMs := dict {{ "}}" }}
{{ "{{" }}- range (lookup "machine.openshift.io/v1beta1" "MachineSet" "openshift-machine-api" "").items {{ "}}" }}
{{ "{{" }}-   if hasPrefix (printf "%s-worker" $infraId) .metadata.name {{ "}}" }}{{ "{{" }}- $workerMs = . {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- if $workerMs {{ "}}" }}
{{ "{{" }}- $pv := $workerMs.spec.template.spec.providerSpec.value {{ "}}" }}
{{ "{{" }}- $workerSubnet := (index (index $pv.subnet.filters 0).values 0) {{ "}}" }}
{{ "{{" }}- $ebs := (index $pv.blockDevices 0).ebs {{ "}}" }}
{{ "{{" }}- range $zone := ternary (list $pv.placement.availabilityZone) $zonesWanted (eq 0 (len $zonesWanted)) {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineSet
    metadata:
      name: {{ "{{" }} $infraId {{ "}}" }}-{{ "{{" }} $role {{ "}}" }}-{{ "{{" }} $zone {{ "}}" }}
      namespace: openshift-machine-api
      labels:
        machine.openshift.io/cluster-api-cluster: {{ "{{" }} $infraId {{ "}}" }}
    spec:
      deletePolicy: Oldest
      replicas: {{ $cfg.replicas }}
      selector:
        matchLabels:
          machine.openshift.io/cluster-api-cluster: {{ "{{" }} $infraId {{ "}}" }}
          machine.openshift.io/cluster-api-machineset: {{ "{{" }} $infraId {{ "}}" }}-{{ "{{" }} $role {{ "}}" }}-{{ "{{" }} $zone {{ "}}" }}
      template:
        metadata:
          labels:
            machine.openshift.io/cluster-api-cluster: {{ "{{" }} $infraId {{ "}}" }}
            machine.openshift.io/cluster-api-machine-role: {{ "{{" }} $role {{ "}}" }}
            machine.openshift.io/cluster-api-machine-type: {{ "{{" }} $role {{ "}}" }}
            machine.openshift.io/cluster-api-machineset: {{ "{{" }} $infraId {{ "}}" }}-{{ "{{" }} $role {{ "}}" }}-{{ "{{" }} $zone {{ "}}" }}
        spec:
          metadata:
            labels:
              {{- range $k, $v := .Config.nodeLabels }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          taints:
            - key: node-role.kubernetes.io/{{ "{{" }} $role {{ "}}" }}
              effect: NoSchedule
            - key: node-role.kubernetes.io/{{ "{{" }} $role {{ "}}" }}
              effect: NoExecute
          providerSpec:
            value:
              kind: AWSMachineProviderConfig
              deviceIndex: 0
              instanceType: {{ if $cfg.instanceType }}{{ $cfg.instanceType }}{{ else }}{{ "{{" }} $pv.instanceType {{ "}}" }}{{ end }}
              ami:
                id: {{ "{{" }} $pv.ami.id {{ "}}" }}
              userDataSecret:
                name: {{ "{{" }} $pv.userDataSecret.name {{ "}}" }}
              credentialsSecret:
                name: {{ "{{" }} $pv.credentialsSecret.name {{ "}}" }}
              placement:
                availabilityZone: {{ "{{" }} $zone {{ "}}" }}
                region: {{ "{{" }} $pv.placement.region {{ "}}" }}
              blockDevices:
                - ebs:
                    encrypted: {{ "{{" }} $ebs.encrypted {{ "}}" }}
                    iops: {{ "{{" }} $ebs.iops {{ "}}" }}
                    volumeType: {{ "{{" }} $ebs.volumeType {{ "}}" }}
                    volumeSize: {{ if $cfg.volumeSize }}{{ $cfg.volumeSize }}{{ else }}{{ "{{" }} $ebs.volumeSize {{ "}}" }}{{ end }}
                    {{ "{{" }}- if $ebs.kmsKey.arn {{ "}}" }}
                    kmsKey:
                      arn: {{ "{{" }} $ebs.kmsKey.arn {{ "}}" }}
                    {{ "{{" }}- end {{ "}}" }}
              securityGroups:
                - filters:
                    - name: 'tag:Name'
                      values:
                        - {{ "{{" }} index (index (index $pv.securityGroups 0).filters 0).values 0 {{ "}}" }}
              subnet:
                filters:
                  - name: 'tag:Name'
                    values:
                      {{ "{{" }}- if contains "subnet-private" $workerSubnet {{ "}}" }}
                      - {{ "{{" }} $infraId {{ "}}" }}-subnet-private-{{ "{{" }} $zone {{ "}}" }}
                      {{ "{{" }}- else {{ "}}" }}
                      - {{ "{{" }} $infraId {{ "}}" }}-private-{{ "{{" }} $zone {{ "}}" }}
                      {{ "{{" }}- end {{ "}}" }}
              tags:
                {{ "{{" }}- range $tag := $pv.tags {{ "}}" }}
                - name: {{ "{{" }} $tag.name {{ "}}" }}
                  value: {{ "{{" }} $tag.value {{ "}}" }}
                {{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
