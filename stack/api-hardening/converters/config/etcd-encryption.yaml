{{- /*
Red Hat's "Enabling etcd encryption": set spec.encryption.type on APIServer cluster. aesgcm and
aescbc encrypt Secrets, ConfigMaps, Routes and OAuth tokens; changing between them re-encrypts, and
identity decrypts. Either takes 20 minutes or longer. KMS is Technology Preview and left out.

skipObject in type skips the object on hosted control plane guests, where encryption is
HostedCluster spec.secretEncryption.
*/ -}}
{{- include "api-hardening.oneOf" (dict "key" "etcdEncryption" "value" .Config.etcdEncryption "allowed" (list "aesgcm" "aescbc" "identity")) }}
apiVersion: config.openshift.io/v1
kind: APIServer
metadata:
  name: cluster
spec:
  encryption:
    type: '{{ "{{" }} skipObject ({{ include "api-hardening.hosted" . }}) {{ "}}" }}{{ .Config.etcdEncryption }}'
