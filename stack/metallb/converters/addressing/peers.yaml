{{- /*
BGPPeer objects, one per entry in config.bgpPeers. The key is the object name and the value is the
spec verbatim, so addressing stays reviewable in values.
*/ -}}
{{- range $name, $spec := .Config.bgpPeers }}
---
apiVersion: metallb.io/v1beta1
kind: BGPPeer
metadata:
  name: {{ $name }}
  namespace: metallb-system
spec: {{- toYaml $spec | nindent 2 }}
{{- end }}
