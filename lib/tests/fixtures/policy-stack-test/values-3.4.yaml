# Exercises chart 3.4.0. Layered over values.yaml.
# global.remediationAction sets inform on every Policy, global.catalogSources remaps the default
# redhat-operators source, and oadp is uninstalled: no -ns template, removalBehavior passed through.
# install chains prereq -> OperatorPolicy -> status.
global:
  remediationAction: inform
  catalogSources:
    redhat-operators: cs-redhat-operator-index-v4-20

stack:
  policyStackTest:
    policies:
      install:
        orderManifests:
          - prereq
        templates:
          prereq:
            file: base/test-cm
    operatorPolicies:
      oadp:
        complianceType: mustnothave
        removalBehavior:
          operatorGroups: DeleteIfUnused
          customResourceDefinitions: Keep
