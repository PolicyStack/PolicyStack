{{- /*
Inform-only readiness gate. Other elements depend on it via `element: odf`;
it is the "storage is usable" contract.

It asserts the StorageClasses ODF publishes, not StorageCluster conditions. Every StorageCluster
condition tracks live health: ocs-operator's SetProgressingCondition sets Available=False alongside
Progressing=True, MapCephClusterNegativeConditions maps live CephCluster state onto
Available/Degraded/Progressing, and ResetUnreportedConditionsToHealthy resets them on recovery. A
gate on those conditions flaps with Ceph health. ACM puts a policy whose dependency is not Compliant
into Pending, so every dependent element would pause each time a mon or OSD restarts.

The StorageClasses are monotonic: they appear once ODF has brought the cluster up and persist
through transient degradation. Dependents consume storage through PVCs and ObjectBucketClaims, so
the classes existing is the precondition they need.

Live health is reported by the `health` policy in this element, which nothing depends on.
*/ -}}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Config.name }}-ceph-rbd
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Config.name }}-cephfs
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openshift-storage.noobaa.io
