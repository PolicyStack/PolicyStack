stack:
  infraNodes:
    enabled: false

    # Enable only one platform toggle (aws or vmware). Set it in
    # values/platforms/<platform>.yaml, selected by a
    # platform.<N> config entry in the cluster's fleet file.
    toggles:
      # MachineConfigPool for the infra role
      mcp: true
      # Kubelet configuration for the infra pool
      config: true
      # Create infra MachineSets by cloning the worker MachineSet (AWS)
      aws: false
      # Clone each worker MachineSet per vSphere failure domain
      vmware: false
      # Report NonCompliant until the infra nodes are ready
      ready: true
      # Move gitops, ingress, image registry and monitoring onto infra nodes
      workloads: false
      # Move the `workloads` components back off infra nodes. Disabling `workloads` stops
      # enforcement but does not revert placement. Enable this to revert, then disable it
      # once the components have moved.
      restore: false

    config:
      # Infra nodes per zone
      replicas: 3
      # AWS availability zones. Empty uses the zone of the cloned worker MachineSet.
      zones: []
      # AWS instance type. Empty inherits from the worker MachineSet.
      instanceType: ""
      # Root volume size in GiB. Empty inherits from the worker MachineSet.
      volumeSize: ""
      # vSphere vCPUs. Empty inherits from the worker MachineSet.
      numCPUs: ""
      # vSphere cores per socket. Empty inherits from the worker MachineSet.
      numCoresPerSocket: ""
      # vSphere memory in MiB. Empty inherits from the worker MachineSet.
      memoryMiB: ""
      # Namespace the GitopsService lives in
      gitopsNamespace: openshift-gitops
      # Maximum pods per infra node
      maxPods: 250
      # Memory reserved for system daemons
      systemReservedMemory: 2Gi
      # CPU reserved for system daemons
      systemReservedCpu: 500m
      # Memory reserved for the kubelet and container runtime
      kubeReservedMemory: 1Gi
      # CPU reserved for the kubelet and container runtime
      kubeReservedCpu: 500m
      # Hard eviction threshold for available memory
      evictionMemory: 500Mi

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-6 Configuration Settings
      standards:
        - NIST SP 800-53

    policies:
      - name: mcp
        enabled: true
        description: "MachineConfigPool for infra nodes"
        remediationAction: enforce
        severity: medium
        disabled: false

      - name: config
        enabled: true
        description: "Infra kubelet configuration"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: mcp

      - name: aws
        enabled: true
        description: "Infra MachineSets on AWS"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: mcp

      - name: vmware
        enabled: true
        description: "Infra MachineSets on vSphere"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: mcp

      - name: ready
        enabled: true
        description: "Reports NonCompliant until the infra nodes are ready"
        remediationAction: inform
        severity: medium
        disabled: false

      - name: workloads
        enabled: true
        description: "Move platform components onto infra nodes"
        remediationAction: enforce
        severity: medium
        disabled: false
        # Move workloads only after the infra nodes are ready
        dependencies:
          - name: ready

      - name: restore
        enabled: true
        description: "Move platform components back off infra nodes"
        remediationAction: enforce
        severity: medium
        disabled: false

    configPolicies:
      - name: pool
        enabled: true
        description: "Infra MachineConfigPool"
        policyRef: mcp
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        templateNames:
          - name: infra-mcp
        enableTemplateParameters: true
        templateParameters:
          role: infra

      - name: infra-kubelet
        enabled: true
        description: "KubeletConfig for the infra pool"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: node-kubelet-config
        enableTemplateParameters: true
        templateParameters:
          role: infra

      - name: infra-machinesets
        enabled: true
        description: "Infra MachineSets cloned from the worker MachineSet"
        policyRef: aws
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-aws
        enableTemplateParameters: true
        templateParameters: &infraParams
          role: infra
          namespace: openshift-machine-api
          nodeLabels:
            node-role.kubernetes.io/infra: ""

      - name: infra-machinesets
        enabled: true
        description: "Infra MachineSets per vSphere failure domain"
        policyRef: vmware
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-vmware
        enableTemplateParameters: true
        templateParameters: *infraParams

      - name: infra-replicas
        enabled: true
        description: "Infra MachineSet readiness"
        policyRef: ready
        complianceType: musthave
        remediationAction: inform
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-ready
        enableTemplateParameters: true
        templateParameters: *infraParams

      - name: components
        enabled: true
        description: "Gitops, ingress and image registry pinned to infra"
        policyRef: workloads
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        templateNames:
          - name: infra-gitops
          - name: infra-ingress
          - name: infra-registry
        enableTemplateParameters: true
        templateParameters:
          role: infra

      - name: monitoring
        enabled: true
        description: "Monitoring stack pinned to infra"
        policyRef: workloads
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        # Merges placement keys into the existing cluster-monitoring-config
        rawTemplate: true
        templateNames:
          - name: infra-monitoring
        enableTemplateParameters: true
        templateParameters:
          role: infra
          # Monitoring components to pin. Alertmanager and Prometheus use the most resources.
          components:
            - alertmanagerMain
            - prometheusK8s
            - prometheusOperator
            - kubeStateMetrics
            - telemeterClient
            - openshiftStateMetrics
            - thanosQuerier
            - monitoringPlugin

      - name: revert
        enabled: true
        description: "Platform components moved back off infra"
        policyRef: restore
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: infra-restore
        enableTemplateParameters: true
        templateParameters:
          role: infra
