stack:
  artifactSigner:
    enabled: false

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      - name: install
        enabled: true
        description: "Install and manage Red Hat Trusted Artifact Signer"
        remediationAction: enforce
        severity: medium
        disabled: false

    operatorPolicies:
      rhtas:
        enabled: true
        description: "Red Hat Trusted Artifact Signer for supply-chain signing"
        # Must match the CSV displayName so the generated status check can find it
        displayName: "Red Hat Trusted Artifact Signer"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-operators
        operatorGroup:
          # Reuse the namespace's existing cluster-scoped OperatorGroup; a second one breaks OLM
          name: global-operators
        subscription:
          channel: stable
          name: rhtas-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []
