stack:
  upgrade:
    enabled: true

    # The fleet file's `version` and `channel` drive the upgrade (docs/upgrades.md). Each
    # policy renders only when its input is set; turning a toggle off pauses it.
    toggles:
      # Pin the ClusterVersion channel and upstream; off pauses both
      channel: true
      # Drive the cluster to the fleet file's version, and report on progress
      upgrade: true

    # Upgrade graph
    config:
      # Update service graph URL, e.g. a local OSUS. Empty leaves the cluster's value alone
      upstream: ""

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      - name: channel
        enabled: true
        description: "Pin the cluster upgrade channel"
        remediationAction: enforce
        severity: medium
        disabled: false

      # The whole upgrade flow (guard, trigger, completion) sits behind one switch, so
      # none of it reports NonCompliant when no upgrade is targeted.
      - name: upgrade
        enabled: true
        description: "Drive the cluster to the target version and report on progress"
        # Gates are InformOnly: ACM keeps them inform even under a Policy-level enforce.
        severity: high
        disabled: false

    configPolicies:
      - name: pin
        enabled: true
        description: "ClusterVersion channel"
        policyRef: channel
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: channel

      # Inform-only reachability guard
      - name: guard
        enabled: true
        description: "Target version reachability"
        policyRef: upgrade
        complianceType: musthave
        remediationAction: InformOnly
        severity: high
        rawTemplate: true
        templateNames:
          - name: upgrade-allowed
        # Appends the ClusterVersion conditions that explain a hold
        customMessage: &cvoReason
          noncompliant: '{{ .DefaultMessage }}{{ range .Policy.status.relatedObjects }}{{ range (dig "object" "status" "conditions" list .) }}{{ if or (eq .type "Progressing") (and (eq .type "Failing" "Invalid") (eq .status "True")) (and (eq .type "ReleaseAccepted" "RetrievedUpdates") (eq .status "False")) }}; {{ .type }}: {{ .message }}{{ end }}{{ end }}{{ end }}'

      # Upgrade trigger, held until the guard reports the target is reachable
      - name: trigger
        enabled: true
        description: "ClusterVersion desiredUpdate"
        policyRef: upgrade
        complianceType: musthave
        remediationAction: enforce
        severity: high
        rawTemplate: true
        templateNames:
          - name: clusterversion
        # Never start an upgrade the guard says is invalid
        extraDependencies:
          - name: guard
        ignorePending: true

      # Completion signal, only meaningful once the trigger has been applied
      - name: progress
        enabled: true
        description: "Upgrade completion"
        policyRef: upgrade
        complianceType: musthave
        remediationAction: InformOnly
        severity: medium
        rawTemplate: true
        templateNames:
          - name: upgrade-status
        customMessage: *cvoReason
        extraDependencies:
          - name: trigger
        ignorePending: true
