{{- /*
Kiali, wired to the cluster's Thanos for metrics and optionally to Tempo for traces.

The tracing block is a plain Helm conditional driven by the values cascade.
*/ -}}
{{- $cfg := .Values.stack.servicemesh3Ambient.config }}
apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
spec:
  istio_namespace: istio-system
  auth:
    strategy: openshift
  deployment:
    cluster_wide_access: true
  external_services:
    prometheus:
      auth:
        type: bearer
        use_kiali_token: true
      thanos_proxy:
        enabled: true
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    {{- if $cfg.tracing.enabled }}
    tracing:
      enabled: true
      provider: tempo
      use_grpc: false
      internal_url: {{ $cfg.tracing.tempoQueryUrl | quote }}
      tempo_config:
        url_format: jaeger
    {{- end }}
