{{- /*
Copies the `sensor-tls` material Central generated on the hub to this secured cluster.

Hub templating is required: this is a runtime secret minted by Central and distributed to every
secured cluster, not configuration, so it cannot come from values. The braces are escaped so Helm
passes them through for ACM to resolve.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: sensor-tls
  namespace: {{ .Parameters.namespace }}
  labels:
    certificate_key_name: sensor-cert.pem
type: Opaque
data:
  sensor-cert.pem: '{{ "{{" }}hub fromSecret "{{ .Parameters.hubNamespace }}" "sensor-tls" "sensor-cert.pem" hub{{ "}}" }}'
  sensor-key.pem: '{{ "{{" }}hub fromSecret "{{ .Parameters.hubNamespace }}" "sensor-tls" "sensor-key.pem" hub{{ "}}" }}'
  ca.pem: '{{ "{{" }}hub fromSecret "{{ .Parameters.hubNamespace }}" "sensor-tls" "ca.pem" hub{{ "}}" }}'
  acs-host: '{{ "{{" }}hub fromSecret "{{ .Parameters.hubNamespace }}" "sensor-tls" "acs-host" hub{{ "}}" }}'
