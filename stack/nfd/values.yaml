stack:
  nfd:
    enabled: false

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    # Parent policy grouping the NFD operator install and the NodeFeatureDiscovery instance
    policies:
      - name: install
        enabled: true
        namespace: open-cluster-management
        description: "Install and configure the Node Feature Discovery Operator and instance"
        remediationAction: enforce
        severity: medium
        disabled: false

    # OperatorPolicy installing the NFD subscription
    operatorPolicies:
      node-feature-discovery:
        enabled: true
        description: "Node Feature Discovery Operator"
        displayName: "Node Feature Discovery Operator"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-nfd
        operatorGroup:
          name: openshift-nfd-operator
          targetNamespaces:
            - openshift-nfd
        subscription:
          channel: stable
          name: nfd
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []

    # Namespace label patch + NodeFeatureDiscovery CR instance
    configPolicies:
      - name: nfd-ns-monitoring
        enabled: true
        description: "Adds openshift.io/cluster-monitoring label to operator namespace"
        policyRef: install
        complianceType: musthave
        remediationAction: enforce
        severity: low
        evaluationInterval:
          compliant: "10m"
          noncompliant: "30s"
        templateNames:
          - name: ns-monitoring-label
        enableTemplateParameters: true
        templateParameters:
          namespace: openshift-nfd

      - name: nfd-instance
        enabled: true
        # Wait for the operator's CSV to reach Succeeded; the CRD only exists after install
        waitForOperator: node-feature-discovery
        # Report compliant while waiting; avoids flapping NonCompliant during install
        ignorePending: true
        description: "Deploy the NodeFeatureDiscovery custom resource"
        policyRef: install
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        evaluationInterval:
          compliant: "10m"
          noncompliant: "30s"
        templateNames:
          - name: nfd-instance
        enableTemplateParameters: true
        templateParameters:
          operandImage: registry.redhat.io/openshift4/ose-node-feature-discovery-rhel9:v4.20
