stack:
  storageNodes:
    enabled: false

    # Exactly one platform toggle should be on. Set these in values/platforms/<p>.yaml
    # and select the file with a platform.<N> config entry in the fleet file.
    toggles:
      # Create storage MachineSets by cloning the worker MachineSet (AWS)
      aws: false
      # Clone each worker MachineSet per vSphere failure domain
      vmware: false
      # Label existing nodes as storage nodes (no MachineSets on bare metal)
      baremetal: false
      # Report NonCompliant until the storage nodes are ready
      ready: true

    config:
      # Storage nodes per zone. ODF expects three for a supported topology.
      replicas: 3
      # AWS availability zones. Empty uses the zone of the cloned worker MachineSet.
      zones: []
      # AWS instance type. Empty inherits from the worker MachineSet.
      instanceType: ""
      # Root volume size in GiB. Empty inherits from the worker MachineSet.
      volumeSize: ""
      # vSphere vCPUs. Empty inherits from the worker MachineSet.
      numCPUs: ""
      # vSphere cores per socket. Empty inherits from the worker MachineSet.
      numCoresPerSocket: ""
      # vSphere memory in MiB. Empty inherits from the worker MachineSet.
      memoryMiB: ""
      # Bare metal only: node names to designate as storage. Empty takes the first
      # `replicas` nodes instead.
      nodes: []

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-6 Configuration Settings
      standards:
        - NIST SP 800-53

    policies:
      - name: aws
        enabled: true
        description: "Storage MachineSets on AWS"
        remediationAction: enforce
        severity: medium
        disabled: false

      - name: vmware
        enabled: true
        description: "Storage MachineSets on vSphere"
        remediationAction: enforce
        severity: medium
        disabled: false

      - name: baremetal
        enabled: true
        description: "Storage node labels on bare metal"
        remediationAction: enforce
        severity: medium
        disabled: false

      # odf and local-storage depend on this
      # policy by name, so it is the readiness gate for the whole storage stack.
      - name: ready
        enabled: true
        description: "Reports NonCompliant until the storage nodes are ready"
        remediationAction: inform
        severity: medium
        disabled: false

    configPolicies:
      - name: storage-machinesets
        enabled: true
        description: "Storage MachineSets cloned from the worker MachineSet"
        policyRef: aws
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-aws
        enableTemplateParameters: true
        templateParameters: &storageParams
          role: storage
          namespace: openshift-machine-api
          nodeLabels:
            node-role.kubernetes.io/infra: ""
            cluster.ocs.openshift.io/openshift-storage: ""

      - name: storage-machinesets
        enabled: true
        description: "Storage MachineSets per vSphere failure domain"
        policyRef: vmware
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-vmware
        enableTemplateParameters: true
        templateParameters: *storageParams

      - name: labels
        enabled: true
        description: "Storage node labels"
        policyRef: baremetal
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        rawTemplate: true
        templateNames:
          - name: storage-label-nodes
        enableTemplateParameters: true
        templateParameters: *storageParams

      - name: storage-replicas
        enabled: true
        description: "Storage MachineSet readiness"
        policyRef: ready
        complianceType: musthave
        remediationAction: InformOnly
        severity: medium
        rawTemplate: true
        templateNames:
          - name: machineset-ready
        enableTemplateParameters: true
        templateParameters: *storageParams

      # Readiness for the label-existing-nodes path, where no storage MachineSets
      # exist and machineset-ready would report Compliant with nothing checked.
      # Asserts that config.replicas nodes carry the storage label.
      - name: labeled-nodes
        enabled: true
        description: "config.replicas nodes are designated for storage"
        policyRef: ready
        complianceType: musthave
        remediationAction: InformOnly
        severity: medium
        rawTemplate: true
        templateNames:
          - name: labeled-nodes-ready
        enableTemplateParameters: true
        templateParameters:
          role: storage
          namespace: openshift-machine-api
          readyLabel: cluster.ocs.openshift.io/openshift-storage
          nodeLabels:
            node-role.kubernetes.io/infra: ""
            cluster.ocs.openshift.io/openshift-storage: ""
