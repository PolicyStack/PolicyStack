{{- /* RWX PVC backing the registry when storage type is pvc. */ -}}
{{- $pvc := .Config.pvc }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-registry-storage
  namespace: openshift-image-registry
spec:
  accessModes:
    - {{ $pvc.accessMode }}
  volumeMode: {{ $pvc.volumeMode }}
  storageClassName: {{ $pvc.storageClass }}
  resources:
    requests:
      storage: {{ $pvc.size }}
