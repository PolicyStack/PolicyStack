stack:
  loki:
    enabled: false

    config:
      # 1x.demo, 1x.pico, 1x.extra-small, 1x.small or 1x.medium
      size: 1x.extra-small
      # StorageClass for Loki's own PVCs (indexes and caches, not the object store)
      storageClass: gp3-csi
      # Sustained ingestion in MB/s per tenant
      ingestionRate: 8
      # Burst allowance in MB
      ingestionBurstSize: 16
      # How long a query may run before it is cut off
      queryTimeout: 3m
      # Schema start date. Only change this when migrating schema versions.
      schemaEffectiveDate: '2024-09-22'
      # Log types forwarded into Loki: application, infrastructure and/or audit
      forwardedLogTypes:
        - infrastructure
        - application
      # ClusterRoles the collector needs to read those log types
      collectorRoles:
        - collect-application-logs
        - collect-infrastructure-logs
        - collect-audit-logs

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - AU Audit and Accountability
      controls:
        - AU-6 Audit Review, Analysis, and Reporting
        - AU-9 Protection of Audit Information
      standards:
        - NIST SP 800-53

    policies:
      install:
        description: "Install and manage the Loki operator"

      # Loki stores its chunks in a NooBaa bucket, so it waits for ODF storage to be
      # usable before the bucket is claimed.
      stack:
        description: "Deploy the LokiStack and its object storage"
        dependencies:
          - name: install
          - name: ready
            element: odf
        templates:
          bucket:
            description: "Object storage bucket and the secret LokiStack reads it through"

          lokistack:
            description: "LokiStack"
            waitForOperator: loki
            # The bucket secret must exist before LokiStack starts
            extraDependencies:
              - name: bucket

      # Forward cluster logs into Loki. Off by default: it needs the logging element's
      # CRDs on the same cluster.
      forwarder:
        enabled: false
        description: "Forward cluster logs into Loki"
        dependencies:
          - name: stack
          - name: install
            element: logging
        templates:
          collector:
            description: "Collector ServiceAccount"

          collector-rbac:
            description: "Collector ClusterRoleBindings"

          clusterlogforwarder:
            description: "ClusterLogForwarder"
            extraDependencies:
              - name: collector-rbac
            ignorePending: true

      # Add the Logging view to the console. Off by default: the coo element serves the
      # console plugin.
      observability-ui:
        enabled: false
        description: "Logging view in the OpenShift console"
        severity: low
        dependencies:
          - name: forwarder
          - name: install
            element: coo
        templates:
          uiplugin:
            description: "Console logging UI plugin"

    operatorPolicies:
      loki:
        description: "Loki operator"
        displayName: "Loki Operator"
        namespace: openshift-operators-redhat
        operatorGroup:
          name: openshift-operators-redhat
        subscription:
          channel: stable-6.5
          name: loki-operator
        versions: []
