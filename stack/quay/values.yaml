stack:
  quay:
    enabled: false

    # The bootstrap Job is opinionated (it creates an initial user, org and repo), so
    # it is opt-in separately from the registry deployment. The Job verifies Quay's route
    # against the default ingress certificate and the cluster trust bundle.
    toggles:
      # Run the one-shot bootstrap Job and publish the console link
      configure: false

    config:
      # Quay components the operator manages. Set a component to false to supply it
      # externally, e.g. Postgres or object storage.
      components:
        quay: true
        clair: true
        postgres: true
        clairpostgres: true
        objectstorage: true
        redis: true
        horizontalpodautoscaler: true
        route: true
        mirror: true
        monitoring: true
        tls: true
      # Allow the first user to be created through the initialize API
      featureUserInitialize: true
      # Restrict browser API calls to XHR
      browserApiCallsXhrOnly: false
      # Allow self-service user creation
      featureUserCreation: false
      # Quay superusers
      superUsers:
        - quayadmin
      # Superuser the bootstrap Job initialises. Must also be listed in superUsers.
      adminUser: quayadmin
      # First non-admin user the bootstrap Job creates
      initialUser: quaydevel
      # Email for that user
      initialUserEmail: quaydevel@myorg.com
      # Organization the bootstrap Job creates
      initialOrg: devel
      # Contact address for that organization. Quay emails are unique across users and
      # organizations, so it must differ from every user's email.
      initialOrgEmail: devel@myorg.com
      # Repository the bootstrap Job creates in that organization
      initialRepo: example
      # Image used to run the bootstrap Job
      bootstrapImage: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      - name: install
        enabled: true
        description: "Install and manage the Quay operator"
        remediationAction: enforce
        severity: medium
        disabled: false

      - name: deploy
        enabled: true
        description: "Deploy the Quay registry"
        remediationAction: enforce
        severity: medium
        disabled: false
        dependencies:
          - name: install

      - name: configure
        enabled: true
        description: "Bootstrap the registry and publish its console link"
        remediationAction: enforce
        severity: low
        disabled: false
        dependencies:
          - name: deploy

    operatorPolicies:
      quay:
        enabled: true
        description: "Red Hat Quay operator"
        displayName: "Red Hat Quay"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-operators
        operatorGroup:
          # Reuse the namespace's existing cluster-scoped OperatorGroup
          name: global-operators
        subscription:
          channel: stable-3.17
          name: quay-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []

    configPolicies:
      - name: registry
        enabled: true
        description: "Quay namespace, config bundle and QuayRegistry"
        policyRef: deploy
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        waitForOperator: quay
        ignorePending: true
        templateNames:
          - name: quay-namespace
          - name: quay-config-bundle
          - name: quay-registry
        enableTemplateParameters: true
        templateParameters:
          namespace: quay-enterprise
          name: registry
          configBundleSecret: quay-registry-config-bundle

      - name: bootstrap
        enabled: true
        description: "Bootstrap Job, its RBAC and CA bundles, and the console link"
        policyRef: configure
        complianceType: musthave
        remediationAction: enforce
        severity: low
        templateNames:
          - name: quay-bootstrap-sa
          - name: quay-bootstrap-role
          - name: quay-bootstrap-rolebinding
          - name: quay-trusted-ca
          - name: quay-ingress-ca
          - name: quay-bootstrap-job
          - name: quay-host-configmap
          - name: quay-console-link
        enableTemplateParameters: true
        templateParameters:
          namespace: quay-enterprise
          name: registry
          bootstrapName: create-admin-user
          trustedCaName: quay-trusted-ca
          ingressCaName: quay-ingress-ca
          routeName: registry-quay
          consoleText: Red Hat Quay Enterprise Registry
          consoleImageUrl: https://upload.wikimedia.org/wikipedia/commons/3/3a/OpenShift-LogoType.svg
