{{- /*
version and channel come from the fleet file (install/templates/appset.yaml). Each policy renders only
when its input is set, so a cluster with neither gets nothing, not even a Placement.
*/ -}}
{{- $u := .Values.stack.upgrade }}
{{- if or $u.config.targetVersion $u.config.channel }}
{{- fail "stack.upgrade.config.targetVersion and config.channel are replaced by the fleet file's version and channel (docs/upgrades.md)" }}
{{- end }}
{{- $p := $u.policies }}
{{- $channel := and (eq (include "policy-library.enabled" $p.channel) "true") (not (and (empty .Values.channel) (empty $u.config.upstream))) }}
{{- $upgrade := and (eq (include "policy-library.enabled" $p.upgrade) "true") (not (empty .Values.version)) }}
{{- $_ := set $p.channel "enabled" $channel }}
{{- $_ = set $p.upgrade "enabled" $upgrade }}
{{- $_ = set $u "enabled" (and $u.enabled (or $channel $upgrade)) }}
{{- include "policy-library.render" . -}}
