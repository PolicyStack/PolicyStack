{{- /*
The cluster's default TLS issuer: a CA ClusterIssuer and the Certificate backing it.

With config.caIssuer.name empty, a self-signed root is created here and signs the CA. Pointing it
at your own Issuer/ClusterIssuer makes the CA an intermediate signed by that issuer; cert-manager
does the signing and the private key is never handled here. The signer must be able to issue a CA
certificate, so public ACME issuers cannot be used.
*/ -}}
{{- $cfg := .Config }}
{{- $signer := (($cfg.caIssuer).name) | default "" }}
{{- $caName := .Config.caName }}
{{- $selfSigned := printf "%s-selfsigned" $caName }}
{{- if not $signer }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $selfSigned }}
spec:
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $caName }}
  # Must live in cert-manager's cluster-resource-namespace for a CA ClusterIssuer to read it.
  namespace: cert-manager
spec:
  isCA: true
  commonName: {{ $caName }}
  secretName: {{ $caName }}
  # Long-lived root per NIST SP 800-57; the serving certs it signs rotate.
  # rotationPolicy defaults to Never, so renewal reuses the key and CA trust is unchanged.
  duration: {{ $cfg.caDuration }}
  renewBefore: {{ $cfg.caRenewBefore }}
  privateKey:
    algorithm: {{ $cfg.keyAlgorithm }}
    size: {{ $cfg.keySize }}
  issuerRef:
    name: {{ $signer | default $selfSigned }}
    kind: {{ (($cfg.caIssuer).kind) | default "ClusterIssuer" }}
    group: {{ (($cfg.caIssuer).group) | default "cert-manager.io" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $caName }}
spec:
  ca:
    secretName: {{ $caName }}
