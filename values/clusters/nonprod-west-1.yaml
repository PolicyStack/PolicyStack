# Per-cluster values for nonprod-west-1, a managed (non-hub) cluster.
#
# The file name must match the ManagedCluster name; a mismatch is skipped silently. Fleet file
# fleet/nonprod-west-1.yaml on the default branch:
#   revision: main             # required; branch, tag or SHA
#   config:
#     environment.10: nonprod
#     datacenter.20: dc2
#
# Site settings come from values/datacenters/dc2.yaml. This file turns elements on and sets what is
# specific to this cluster.
stack:
  # Enforces the dc2 registry allowlist. Images from any registry not on that list stop pulling.
  manualRemediations:
    enabled: true
    toggles:
      registries: true

  # Load balancer addresses are per cluster: two clusters sharing a range would hand out the same IPs.
  metallb:
    enabled: true
    toggles:
      addressing: true
    config:
      ipAddressPools:
        services:
          addresses:
            - 10.20.30.100-10.20.30.120
          autoAssign: true
      l2Advertisements:
        services:
          ipAddressPools:
            - services

  # Needs a default StorageClass, or set config.storageClass. Maps merge across the cascade, so only
  # the keys that differ from the element defaults are listed.
  userWorkloadMonitoring:
    enabled: true
    config:
      prometheus:
        retention: 72h
        storage: 20Gi
