stack:
  remediations:
    enabled: false

    toggles:
      # Restrict the registries the cluster may pull and import from
      registries: true
      # Remove the Samples Operator and its imagestreams
      samples: true

    config:
      # Registries permitted for `oc import-image`
      allowedRegistriesForImport:
        - domainName: quay.io
          insecure: false
        - domainName: registry.redhat.io
          insecure: false
      # Registries the cluster may pull from at runtime
      allowedRegistries:
        - quay.io
        - registry.redhat.io
        - image-registry.openshift-image-registry.svc:5000

    default:
      categories:
        - CM Configuration Management
        - SI System and Information Integrity
      controls:
        - CM-2 Baseline Configuration
        - SI-7 Software, Firmware, and Information Integrity
      standards:
        - NIST SP 800-53

    policies:
      - name: registries
        enabled: true
        description: "Restrict image registries the cluster may use"
        remediationAction: enforce
        severity: high
        disabled: false

      - name: samples
        enabled: true
        description: "Remove the Samples Operator"
        remediationAction: enforce
        severity: low
        disabled: false

    configPolicies:
      - name: allowlist
        enabled: true
        description: "Image registry allowlist"
        policyRef: registries
        complianceType: musthave
        remediationAction: enforce
        severity: high
        templateNames:
          - name: allowed-image-registries

      - name: operator
        enabled: true
        description: "Samples Operator management state"
        policyRef: samples
        complianceType: musthave
        remediationAction: enforce
        severity: low
        templateNames:
          - name: remove-samples-operator
