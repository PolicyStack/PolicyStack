{{- /*
Namespace <cluster>, which Hive and ACM both require, then the pull secret, the platform
credentials and the install-config, all copied from or built around the console credential.
Only the keys Hive reads go into <cluster>-creds. vSphere adds <cluster>-certs, the vCenter CA Hive
trusts for the credential check, install and deprovision; it must be valid PEM.

install-config.yaml leaves out pullSecret, which Hive always fills in from pullSecretRef. sshKey
defaults to the credential's ssh-publickey, when set. The installer reads the vCenter login only
from install-config.yaml, so on vSphere every vcenters entry gets the credential's username and
password there.
*/ -}}
{{- $h := .Values.install.hive }}
{{- $c := include "lifecycle.cluster" . }}
{{- $cred := include "lifecycle.credential" . }}
{{- $p := include "lifecycle.hivePlatform" . }}
{{- $keys := get (dict "aws" (list "aws_access_key_id" "aws_secret_access_key") "gcp" (list "osServiceAccount.json") "azure" (list "osServicePrincipal.json") "vsphere" (list "username" "password")) $p }}
{{- $installConfig := mergeOverwrite (deepCopy ($h.installConfig | default dict)) (dict "apiVersion" "v1" "metadata" (dict "name" $c) "baseDomain" (required "install.baseDomain is required" .Values.install.baseDomain) "platform" $h.platform) }}
{{ include "lifecycle.refuse" . }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Namespace
    metadata:
      name: {{ $c }}
{{ include "lifecycle.pullSecret" (dict "root" . "namespace" $c) }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: Opaque
    metadata:
      name: {{ $c }}-creds
      namespace: {{ $c }}
    data:
      {{- range $keys }}
      {{ . }}: '{{ "{{" }} fromSecret {{ $cred }} {{ . | quote }} {{ "}}" }}'
      {{- end }}
{{- $ic := printf "%s\n" (toYaml $installConfig) | b64enc | quote }}
{{- if not (hasKey $installConfig "sshKey") }}
{{ "{{-" }} $ssh := fromSecret {{ $cred }} "ssh-publickey" | base64dec {{ "}}" }}
{{- end }}
{{- if eq $p "vsphere" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: Opaque
    metadata:
      name: {{ $c }}-certs
      namespace: {{ $c }}
    data:
      .cacert: '{{ "{{" }} fromSecret {{ $cred }} "cacertificate" {{ "}}" }}'
{{ "{{-" }} $vic := base64dec {{ $ic }} | fromYAML {{ "}}" }}
{{ "{{-" }} range $vic.platform.vsphere.vcenters {{ "}}" }}{{ "{{-" }} $_ := set . "user" (fromSecret {{ $cred }} "username" | base64dec) {{ "}}" }}{{ "{{-" }} $_ = set . "password" (fromSecret {{ $cred }} "password" | base64dec) {{ "}}" }}{{ "{{-" }} end {{ "}}" }}
{{- if not (hasKey $installConfig "sshKey") }}
{{ "{{-" }} with $ssh {{ "}}" }}{{ "{{-" }} $_ := set $vic "sshKey" . {{ "}}" }}{{ "{{-" }} end {{ "}}" }}
{{- end }}
{{- end }}
- complianceType: musthave
  objectDefinition:
    apiVersion: v1
    kind: Secret
    type: Opaque
    metadata:
      name: {{ $c }}-install-config
      namespace: {{ $c }}
    data:
      {{- if eq $p "vsphere" }}
      install-config.yaml: '{{ "{{" }} toYAML $vic | base64enc {{ "}}" }}'
      {{- else if hasKey $installConfig "sshKey" }}
      install-config.yaml: {{ $ic }}
      {{- else }}
      install-config.yaml: '{{ "{{" }} printf "%s%s" (base64dec {{ $ic }}) (ternary "" (printf "sshKey: %q\n" $ssh) (empty $ssh)) | base64enc {{ "}}" }}'
      {{- end }}
