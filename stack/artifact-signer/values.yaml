stack:
  # @description: Red Hat Trusted Artifact Signer for supply-chain signing
  artifactSigner:
    # @desc: Master control to enable/disable all policies in this element
    enabled: false

    # @description: Default policy metadata applied unless overridden per-policy
    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    # @description: Parent policy grouping the operator install
    policies:
      - name: install
        enabled: true
        description: "Install and manage Red Hat Trusted Artifact Signer"
        remediationAction: enforce
        severity: medium
        disabled: false

    # @description: OperatorPolicy installing the subscription
    operatorPolicies:
      rhtas:
        enabled: true
        description: "Red Hat Trusted Artifact Signer for supply-chain signing"
        # @desc: Must match the CSV displayName so the generated status check can find it
        displayName: "Red Hat Trusted Artifact Signer"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-operators
        operatorGroup:
          # @desc: Reuse the namespace's existing cluster-scoped OperatorGroup; a second one breaks OLM
          name: global-operators
        subscription:
          channel: stable
          name: rhtas-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        # @desc: Automatic approves upgrades allowed by versions; None approves the initial install only, never upgrades
        upgradeApproval: Automatic
        # @desc: Allowed CSV names; empty allows whatever the channel offers. Pin per environment or cluster; also set subscription.startingCSV when the pin is not the channel head
        versions: []
