{{- /* This hub's pointer, unless its parent's Policy enforces it (_helpers.tpl). */ -}}
{{- if not .Values.parent }}
{{- $hub := required "hubName must be set (--set hubName=<name>)" .Values.hubName }}
{{- $_ := required "gitRepo must be set (--set gitRepo=<url>)" .Values.gitRepo }}
{{ include "policystack.pointer" (dict "root" . "hubName" $hub) }}
{{- end }}
