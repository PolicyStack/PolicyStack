{{- /*
KubeletConfig for one node role. The role comes from .Parameters and the element's config block is
resolved from the chart name with the camelCase rule policy-library uses for `stack.<component>`, so
this file is byte-identical in master-nodes, worker-nodes and infra-nodes.

podsPerCore is derived from the node CPU count, which is only known on the managed cluster, so it
uses an escaped ACM template.
*/ -}}
{{- $cfg := (index .Values.stack (.Chart.Name | replace "-" " " | title | nospace | untitle)).config }}
{{ "{{" }}- $cores := 0 {{ "}}" }}
{{ "{{" }}- range (lookup "v1" "Node" "" "").items {{ "}}" }}
{{ "{{" }}-   if hasKey .metadata.labels "node-role.kubernetes.io/{{ .Parameters.role }}" {{ "}}" }}
{{ "{{" }}-     if eq $cores 0 {{ "}}" }}{{ "{{" }}- $cores = (.status.capacity.cpu | toInt) {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}-   end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- if eq $cores 0 {{ "}}" }}{{ "{{" }}- $cores = 1 {{ "}}" }}{{ "{{" }}- end {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: machineconfiguration.openshift.io/v1
    kind: KubeletConfig
    metadata:
      name: {{ .Parameters.role }}-node-config
    spec:
      machineConfigPoolSelector:
        matchLabels:
          pools.operator.machineconfiguration.openshift.io/{{ .Parameters.role }}: ""
      kubeletConfig:
        maxPods: {{ $cfg.maxPods }}
        podsPerCore: {{ "{{" }} add 1 (div {{ $cfg.maxPods }} $cores) {{ "}}" }}
        systemReserved:
          memory: {{ $cfg.systemReservedMemory }}
          cpu: {{ $cfg.systemReservedCpu }}
        kubeReserved:
          memory: {{ $cfg.kubeReservedMemory }}
          cpu: {{ $cfg.kubeReservedCpu }}
        # The kubelet does not merge defaults into a partial evictionHard; unset signals drop to zero.
        # OpenShift requires all five signals; the others are the upstream kubelet Linux defaults.
        evictionHard:
          memory.available: {{ $cfg.evictionMemory }}
          nodefs.available: 10%
          nodefs.inodesFree: 5%
          imagefs.available: 15%
          imagefs.inodesFree: 5%
