{{- /*
vSphere creates one worker MachineSet per failure domain. Each is cloned into a MachineSet for this
role, so the new nodes span the same failure domains as the workers. Workspace, network and
template come from the cloned worker.

Portable across node elements. The role and config block are read from .Config.
*/ -}}
{{- $cfg := .Config }}
{{ "{{" }}- $role := "{{ .Config.role }}" {{ "}}" }}
{{ "{{" }}- $infraId := (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName {{ "}}" }}
{{ "{{" }}- range (lookup "machine.openshift.io/v1beta1" "MachineSet" "openshift-machine-api" "").items {{ "}}" }}
{{ "{{" }}- if hasPrefix (printf "%s-worker" $infraId) .metadata.name {{ "}}" }}
{{ "{{" }}- $workerMs := . {{ "}}" }}
{{ "{{" }}- $pv := $workerMs.spec.template.spec.providerSpec.value {{ "}}" }}
{{ "{{" }}- $zone := trimPrefix (printf "%s-worker-" $infraId) $workerMs.metadata.name {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineSet
    metadata:
      name: {{ "{{" }} $infraId {{ "}}" }}-{{ "{{" }} $role {{ "}}" }}-{{ "{{" }} $zone {{ "}}" }}
      namespace: openshift-machine-api
      labels:
        machine.openshift.io/cluster-api-cluster: {{ "{{" }} $infraId {{ "}}" }}
    spec:
      deletePolicy: Oldest
      replicas: {{ $cfg.replicas }}
      selector:
        matchLabels:
          machine.openshift.io/cluster-api-cluster: {{ "{{" }} $infraId {{ "}}" }}
          machine.openshift.io/cluster-api-machineset: {{ "{{" }} $infraId {{ "}}" }}-{{ "{{" }} $role {{ "}}" }}-{{ "{{" }} $zone {{ "}}" }}
      template:
        metadata:
          labels:
            machine.openshift.io/cluster-api-cluster: {{ "{{" }} $infraId {{ "}}" }}
            machine.openshift.io/cluster-api-machine-role: {{ "{{" }} $role {{ "}}" }}
            machine.openshift.io/cluster-api-machine-type: {{ "{{" }} $role {{ "}}" }}
            machine.openshift.io/cluster-api-machineset: {{ "{{" }} $infraId {{ "}}" }}-{{ "{{" }} $role {{ "}}" }}-{{ "{{" }} $zone {{ "}}" }}
        spec:
          metadata:
            labels:
              {{- range $k, $v := .Config.nodeLabels }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          taints:
            - key: node-role.kubernetes.io/{{ "{{" }} $role {{ "}}" }}
              effect: NoSchedule
            - key: node-role.kubernetes.io/{{ "{{" }} $role {{ "}}" }}
              effect: NoExecute
          providerSpec:
            value:
              numCPUs: {{ if $cfg.numCPUs }}{{ $cfg.numCPUs }}{{ else }}{{ "{{" }} $pv.numCPUs {{ "}}" }}{{ end }}
              numCoresPerSocket: {{ if $cfg.numCoresPerSocket }}{{ $cfg.numCoresPerSocket }}{{ else }}{{ "{{" }} $pv.numCoresPerSocket {{ "}}" }}{{ end }}
              memoryMiB: {{ if $cfg.memoryMiB }}{{ $cfg.memoryMiB }}{{ else }}{{ "{{" }} $pv.memoryMiB {{ "}}" }}{{ end }}
              diskGiB: {{ "{{" }} $pv.diskGiB {{ "}}" }}
              template: {{ "{{" }} $pv.template {{ "}}" }}
              snapshot: ''
              workspace: {{ "{{" }} $pv.workspace | toRawJson {{ "}}" }}
              network: {{ "{{" }} $pv.network | toRawJson {{ "}}" }}
              userDataSecret:
                name: {{ "{{" }} $pv.userDataSecret.name {{ "}}" }}
              credentialsSecret:
                name: {{ "{{" }} $pv.credentialsSecret.name {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
