{{- /*
Reports remediations applied but not declared true, including ones removed from config. Reverting
reboots nodes, so it takes an explicit false. Asserting NotApplied cannot write: ACM never writes status.
*/ -}}
{{ "{{" }}- range (lookup "compliance.openshift.io/v1alpha1" "ComplianceRemediation" "{{ .Parameters.namespace }}" "").items {{ "}}" }}
{{ "{{" }}- if and .spec.apply (not (has (regexReplaceAll "-[0-9]+" .metadata.name "") ({{ include "compliance.declaredRemediations" . }}))) {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: compliance.openshift.io/v1alpha1
    kind: ComplianceRemediation
    metadata:
      name: {{ "{{" }} .metadata.name {{ "}}" }}
      namespace: {{ .Parameters.namespace }}
    status:
      applicationState: NotApplied
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
