# POLICY081 coverage: every element and policy on, so CI evaluates every converter's ACM
# templates. A new element or enabled: false entry goes here; TestProfileCoverage fails until it does.
stack:
  acm:
    enabled: true
    policies:
      observability:
        enabled: true
      search:
        enabled: true
      addons:
        enabled: true
  acs:
    enabled: true
    policies:
      central:
        enabled: true
        templates:
          console:
            enabled: true
      secured:
        enabled: true
  cim:
    enabled: true
  aap:
    enabled: true
    policies:
      storage:
        enabled: true
      certs:
        enabled: true
      link:
        enabled: true
  certManager:
    enabled: true
    policies:
      ca:
        enabled: true
      api-cert:
        enabled: true
      ingress-cert:
        enabled: true
  coo:
    enabled: true
  developerHub:
    enabled: true
  devSpaces:
    enabled: true
  eso:
    enabled: true
  teamGitops:
    enabled: true
    config:
      teams: {dev: {}}
  infraNodes:
    enabled: true
    policies:
      mcp:
        enabled: true
      config:
        enabled: true
      aws:
        enabled: true
      vmware:
        enabled: true
      ready:
        enabled: true
      workloads:
        enabled: true
      restore:
        enabled: false
  kiali:
    enabled: true
  localStorage:
    enabled: true
  loki:
    enabled: true
    policies:
      forwarder:
        enabled: true
      observability-ui:
        enabled: true
  lvm:
    enabled: true
  machineHealth:
    enabled: true
  remediations:
    enabled: true
    policies:
      registries:
        enabled: true
      samples:
        enabled: true
  masterNodes:
    enabled: true
  metallb:
    enabled: true
    policies:
      quota:
        enabled: true
      addressing:
        enabled: true
    config:
      ipAddressPools: {internal: {addresses: [192.168.100.1-192.168.100.20]}}
      l2Advertisements: {internal: {ipAddressPools: [internal]}}
      bgpAdvertisements: {internal: {ipAddressPools: [internal], peers: [rack1]}}
      bgpPeers: {rack1: {myASN: 64512, peerASN: 64512, peerAddress: 10.0.0.1}}
  mtv:
    enabled: true
  nmstate:
    enabled: true
    policies:
      nncp:
        enabled: true
    config:
      networking:
        interfaces:
          bond0: {type: bond, ports: [ens1f0, ens1f1], ipv4: dhcp}
      hosts:
        worker-0:
          networking:
            interfaces:
              bond0: {mac: "aa:bb:cc:dd:ee:ff"}
  nfd:
    enabled: true
  nodeMaintenance:
    enabled: true
  compliance:
    enabled: true
    policies:
      remediate:
        enabled: true
  odf:
    enabled: true
    policies:
      config:
        templates:
          noobaa-pvpool:
            enabled: true
          pdb-alert:
            enabled: true
  dns:
    enabled: true
  gitops:
    enabled: true
    policies:
      instance:
        enabled: true
        templates:
          ca-bundle:
            enabled: true
      link:
        enabled: true
  imageRegistry:
    enabled: true
    policies:
      pvc:
        enabled: true
      s3:
        enabled: true
  logging:
    enabled: true
  pipelines:
    enabled: true
  upgrade:
    enabled: true
    policies:
      channel:
        enabled: true
      upgrade:
        enabled: true
  virtualization:
    enabled: true
  opentelemetry:
    enabled: true
  quay:
    enabled: true
    policies:
      configure:
        enabled: true
  ambientMesh:
    enabled: true
    policies:
      tracing:
        enabled: true
  servicemesh:
    enabled: true
  storageNodes:
    enabled: true
    policies:
      aws:
        enabled: true
      vmware:
        enabled: true
      baremetal:
        enabled: true
      ready:
        enabled: true
  tempo:
    enabled: true
  artifactSigner:
    enabled: true
  userMonitoring:
    enabled: true
  workerNodes:
    enabled: true
    policies:
      config:
        enabled: true
      machines:
        enabled: true
      ready:
        enabled: true
  partitioning:
    enabled: true
    config:
      reservedCpus: 0-1
      isolatedCpus: 2-31
  disconnected:
    enabled: true
    policies:
      resources:
        enabled: true
      registry-ca:
        enabled: true
      trusted-ca:
        enabled: true
      operatorhub:
        enabled: true
    config:
      clusterResources:
        - apiVersion: operators.coreos.com/v1alpha1
          kind: CatalogSource
          metadata: {name: cs-redhat-operator-index-v4-20, namespace: openshift-marketplace}
          spec: {image: "mirror.example.com:8443/redhat/redhat-operator-index:v4.20", sourceType: grpc}
      registryCAs:
        mirror.example.com..8443: |
          -----BEGIN CERTIFICATE-----
          -----END CERTIFICATE-----
      trustedCA: |
        -----BEGIN CERTIFICATE-----
        -----END CERTIFICATE-----
  # tools/sample-element, rendered with --include-sample-element
  myElement:
    enabled: true
    policies:
      install:
        templates:
          my-element-netpol:
            enabled: true
