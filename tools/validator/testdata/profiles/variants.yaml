# POLICY081 coverage, second pass: the branches all-on.yaml cannot take at the same time.
stack:
  infraNodes:
    enabled: true
    policies:
      workloads:
        enabled: false
      restore:
        enabled: true
  storageNodes:
    enabled: true
    policies:
      baremetal:
        enabled: true
    config:
      nodes: [worker-0, worker-1, worker-2]
  nmstate:
    enabled: true
    policies:
      nncp:
        enabled: true
    config:
      hosts:
        worker-0:
          hostname: worker-0.example.com
          networking:
            interfaces:
              bond0: {mac: "aa:bb:cc:dd:ee:ff"}
  # acm observability on external S3 with a private CA and the custom metrics allowlist, which
  # all-on leaves on NooBaa
  acm:
    enabled: true
    config:
      observability:
        s3:
          bucket: metrics
          endpoint: minio.example.com:9000
          region: us-east-1
          credentialsSecret: thanos-s3
          caSecret: s3-ca
        customMetrics:
          names: [node_memory_MemTotal_bytes]
          recordingRules:
            - record: apiserver:p90
              expr: 'histogram_quantile(0.90, sum(rate(apiserver_request_duration_seconds_bucket{job="apiserver"}[5m])) by (le))'
    policies:
      observability:
        enabled: true
        dependencies:
          - name: hub
        templates:
          metrics:
            enabled: true
  # compliance with a second binding and applyAll, which all-on leaves on the one default binding
  compliance:
    enabled: true
    policies:
      remediate:
        enabled: true
    config:
      waivers:
        rule-waived: "Accepted. SEC-1"
      bindings:
        stig:
          applyAll: true
          exclude: [rule-excluded]
        moderate:
          profiles: [ocp4-moderate, ocp4-moderate-node, rhcos4-moderate]
