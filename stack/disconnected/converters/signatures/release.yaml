{{- /*
The CVO verifies an update's release image against the signatures in ConfigMaps in
openshift-config-managed labelled release.openshift.io/verification-signatures, and refuses the
update when none matches. This is oc-mirror's ConfigMap, under its name, with config.releaseSignatures
as binaryData. mustonlyhave prunes a signature whose key leaves config, so the ConfigMap holds the
releases of every oc-mirror run the site still keeps, not only the last run's. Other labels and
annotations are left alone (metadataComplianceType musthave).

The policy renders only when config.releaseSignatures is set (templates/policy.yaml).
*/ -}}
{{- range $k, $v := .Config.releaseSignatures }}
{{- if not (regexMatch "^sha256-[a-f0-9]{64}-[0-9]+$" $k) }}
{{- fail (printf "stack.disconnected.config.releaseSignatures: key %q is not sha256-<64 hex>-<n>, so the CVO would never read it. Copy the keys from binaryData in oc-mirror's signature-configmap.json" $k) }}
{{- end }}
{{- if not (and (kindIs "string" $v) (regexMatch "^[A-Za-z0-9+/]+=*$" $v)) }}
{{- fail (printf "stack.disconnected.config.releaseSignatures: %s is not a base64 signature. A null does not remove a key a lower layer set; keep the key only in the layers that need it" $k) }}
{{- end }}
{{- end }}
{{- range .Config.clusterResources }}
{{- if and (eq (dig "kind" "" .) "ConfigMap") (eq (dig "metadata" "name" "" .) "mirrored-release-signatures") }}
{{- fail "stack.disconnected.config.clusterResources holds ConfigMap mirrored-release-signatures, which config.releaseSignatures owns. Remove it from clusterResources; the two templates would keep rewriting each other" }}
{{- end }}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mirrored-release-signatures
  namespace: openshift-config-managed
  labels:
    release.openshift.io/verification-signatures: ""
binaryData: {{- toYaml .Config.releaseSignatures | nindent 2 }}
