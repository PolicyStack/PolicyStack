name: Policy Validate

# Called by ci.yml (docs/reference/ci.md#policy-validate).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency block: in a called workflow github.workflow is the caller's name, so a group here
# would collide with the caller's own and deadlock.

env:
  GOTOOLCHAIN: local

jobs:
  validate:
    name: validate (helm ${{ matrix.helm || 'floor' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # '' is the mise.toml Helm, the hub floor. 4.2.1 is advisory until Argo CD 3.5 ships in
        # OpenShift GitOps or Helm 3 reaches end of life (2027-02-10), whichever comes first.
        helm: ['', '4.2.1']
    continue-on-error: ${{ matrix.helm != '' }}
    env:
      MISE_HELM_VERSION: ${{ matrix.helm }} # empty keeps mise.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and origin/* branches for POLICY052
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go helm

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('tools/validator/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # The CRDs POLICY080 validates against. The SHAs live in the Makefile; make crds refetches on a
      # miss.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: tools/validator/.crds
          key: crds-${{ hashFiles('tools/validator/Makefile') }}

      # Findings are annotated on the PR, fleet pins (POLICY052) and install/ (POLICY071) included.
      # Recipes in tools/validator/Makefile.
      - name: Validate
        run: make -C tools/validator validate

      # Last, so a failing test does not hide the annotations above.
      - name: Test validator
        if: ${{ !cancelled() && matrix.helm == '' }}
        run: make -C tools/validator test
