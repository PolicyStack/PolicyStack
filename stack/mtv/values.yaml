stack:
  mtv:
    enabled: false

    config:
      # Expose the Forklift console plugin
      uiPlugin: true
      # Run the validation service
      validation: true
      # Enable the volume populator for disk transfer
      volumePopulator: true

    default:
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      # Operator install
      - name: install
        enabled: true
        description: "Install and manage the Migration Toolkit for Virtualization operator"
        remediationAction: enforce
        severity: medium
        disabled: false

      # The ForkliftController operand, applied once the operator is ready
      - name: config
        enabled: true
        description: "Deploy the ForkliftController instance"
        remediationAction: enforce
        severity: medium
        disabled: false
        # The ForkliftController CRD only exists after the operator installs
        dependencies:
          - name: install

    operatorPolicies:
      mtv:
        enabled: true
        description: "Migration Toolkit for Virtualization"
        displayName: "Migration Toolkit for Virtualization Operator"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: openshift-mtv
        operatorGroup:
          name: migration
          # Own-namespace install mode
          targetNamespaces:
            - openshift-mtv
        subscription:
          channel: release-v2.10
          name: mtv-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        versions: []

    configPolicies:
      # Adds the cluster-monitoring label so the operator's metrics are scraped
      - name: mtv-ns-monitoring
        enabled: true
        description: "Adds openshift.io/cluster-monitoring label to the operator namespace"
        policyRef: install
        complianceType: musthave
        remediationAction: enforce
        severity: low
        templateNames:
          - name: ns-monitoring-label
        enableTemplateParameters: true
        templateParameters:
          namespace: openshift-mtv

      # ForkliftController operand
      - name: forklift
        enabled: true
        description: "ForkliftController instance"
        policyRef: config
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        # Wait for the operator's CSV; the CRD only exists after install
        waitForOperator: mtv
        # Report compliant while waiting; avoids flapping during install
        ignorePending: true
        templateNames:
          - name: forklift-controller
        enableTemplateParameters: true
        templateParameters:
          namespace: openshift-mtv
