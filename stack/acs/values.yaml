stack:
  # @description: "Red Hat Advanced Cluster Security: Central, secured clusters and security policies"
  acs:
    # @desc: Master control to enable/disable all policies in this element
    enabled: false

    # @description: Which ACS role this cluster plays, set by the values cascade. Turn `central`
    # @description: on in values/acm/*.yaml and `secured` on wherever ACS agents should run.
    toggles:
      # @desc: Run Central here (the ACS hub). Only on the ACM hub itself, once per hub. Also brings
      # @desc: the declarative auth config, security policies and a check that the hub holds a
      # @desc: cluster registration secret (CRS) with over 90 days left; you generate it once, see
      # @desc: docs/acs.md.
      central: false
      # @desc: Run the secured-cluster agents here. Usually every cluster, including the hub. A
      # @desc: rebuilt, moved or re-created cluster must be re-registered: see docs/acs.md.
      secured: false
      # @desc: Publish a console link to Central. Only meaningful where Central runs.
      console: true

    # @description: ACS configuration
    config:
      # @desc: Scanner V4 component state: Enabled, Default or Disabled
      scannerV4: Enabled
      # @desc: Central egress posture: Online or Offline
      egressConnectivity: Online
      # @desc: Let the operator manage its NetworkPolicies: Enabled or Disabled. Empty leaves it unset.
      networkPolicies: ""
      # @desc: Wire ACS into OpenShift monitoring. Leave unset to use the operator default.
      monitoring: null
      # @description: Central scanner autoscaling
      scanner:
        minReplicas: 2
        maxReplicas: 5
        replicas: 3
      # @description: Authentication wired in declaratively at Central startup
      auth:
        # @desc: Auth provider to declare. Empty disables declarative auth config entirely.
        provider: openshift
        # @desc: Role granted to any authenticated user
        minimumRole: None
        # @desc: OpenShift group mapped to the ACS Admin role
        adminGroup: cluster-admins
      # @description: Admission control behaviour on secured clusters
      admissionControl:
        # @desc: Enforce deploy-time policies (SecuredCluster admissionControl.enforcement). Off by
        # @desc: default: it sits in the admission path. The operator itself defaults it on.
        enabled: false
        # @desc: ScanIfMissing or DoNotScanInline. Ignored by ACS 4.9+.
        contactImageScanners: ScanIfMissing
        # @desc: What happens if the admission webhook is unreachable: Ignore or Fail
        failurePolicy: Ignore
      # @description: Node collector
      collector:
        # @desc: CORE_BPF or NoCollection
        collection: CORE_BPF
      # @description: SecurityPolicy objects keyed by name; edit, extend or replace per cluster.
      securityPolicies:
        no-privilege-escalation:
          policyName: No Privilege Escalation
          categories:
          - Privileges
          severity: HIGH_SEVERITY
          disabled: false
          lifecycleStages:
          - DEPLOY
          policySections:
          - sectionName: Rule 1
            policyGroups:
            - fieldName: Allow Privilege Escalation
              values:
              - value: 'true'
          enforcementActions: []
        no-root-user-containers:
          policyName: No Root User Containers
          categories:
          - Privileges
          severity: HIGH_SEVERITY
          disabled: false
          lifecycleStages:
          - DEPLOY
          policySections:
          - sectionName: Rule 1
            policyGroups:
            - fieldName: Image User
              values:
              - value: '0'
              - value: root
          enforcementActions: []
        no-shell-spawning:
          policyName: No Shell Spawning at Runtime
          categories:
          - System Modification
          severity: HIGH_SEVERITY
          disabled: false
          lifecycleStages:
          - RUNTIME
          eventSource: DEPLOYMENT_EVENT
          policySections:
          - sectionName: Rule 1
            policyGroups:
            - fieldName: Process Name
              values:
              - value: /bin/sh
              - value: /bin/bash
              - value: /bin/dash
          enforcementActions: []

    # @description: Default policy metadata applied unless overridden per-policy
    default:
      categories:
        - SI System and Information Integrity
        - CM Configuration Management
      controls:
        - SI-3 Malicious Code Protection
        - CM-6 Configuration Settings
      standards:
        - NIST SP 800-53

    policies:
      - name: install
        enabled: true
        description: "Install and manage the ACS operator"
        remediationAction: enforce
        severity: medium
        disabled: false

      - name: central
        enabled: true
        description: "Central, its declarative auth config and security policies"
        # No Policy-level remediationAction: it would override the inform gates below.
        severity: high
        disabled: false
        dependencies:
          - name: install

      - name: secured
        enabled: true
        description: "Secured-cluster agents and their TLS material"
        # No Policy-level remediationAction: it would override the inform gate below.
        severity: high
        disabled: false
        dependencies:
          - name: install
        # @desc: The hub templates read hubNamespace, outside the policy namespace. The central
        # @desc: policy's hub-access creates this ServiceAccount; keep the two names in sync.
        hubTemplateOptions:
          serviceAccountName: acs-hub-templates

    operatorPolicies:
      acs:
        enabled: true
        description: "Advanced Cluster Security operator"
        displayName: "Advanced Cluster Security for Kubernetes"
        policyRef: install
        severity: medium
        remediationAction: enforce
        complianceType: musthave
        namespace: rhacs-operator
        operatorGroup:
          name: rhacs-operator
        subscription:
          channel: stable
          name: rhacs-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        upgradeApproval: Automatic
        # @desc: Allowed CSV names; empty allows whatever the channel offers. Pin per environment or cluster; also set subscription.startingCSV when the pin is not the channel head
        versions: []

    configPolicies:
      # @description: Central itself, plus the config it reads at startup
      - name: central
        enabled: true
        description: "Central and its declarative configuration"
        policyRef: central
        complianceType: musthave
        remediationAction: enforce
        severity: high
        waitForOperator: acs
        ignorePending: true
        templateNames:
          - name: acs-namespace
          - name: acs-declarative-config
          - name: acs-central
        enableTemplateParameters: true
        templateParameters: &acsParams
          namespace: stackrox
          hubNamespace: stackrox
          hubServiceAccount: acs-hub-templates
          centralName: stackrox-central-services
          securedName: stackrox-secured-cluster-services
          declarativeConfigMap: acs-declarative-configs
          dbClaimName: stackrox-db
          imageUrl: https://upload.wikimedia.org/wikipedia/commons/3/3a/OpenShift-LogoType.svg

      - name: central-ready
        enabled: true
        description: "Central readiness"
        policyRef: central
        complianceType: musthave
        remediationAction: inform
        severity: medium
        templateNames:
          - name: acs-central-ready
        enableTemplateParameters: true
        templateParameters: *acsParams

      - name: policies
        enabled: true
        description: "SecurityPolicy objects"
        policyRef: central
        complianceType: musthave
        remediationAction: enforce
        severity: medium
        # @desc: One object per entry in config.securityPolicies
        rawTemplate: true
        extraDependencies:
          - name: central-ready
        ignorePending: true
        templateNames:
          - name: acs-security-policies
        enableTemplateParameters: true
        templateParameters: *acsParams

      - name: crs-ready
        enabled: true
        description: "The hub holds a CRS with over 90 days left"
        policyRef: central
        complianceType: musthave
        remediationAction: inform
        severity: medium
        # @desc: Polls instead of watching: the expiry check compares against now
        evaluationInterval:
          compliant: 24h
          noncompliant: 10m
        templateNames:
          - name: acs-crs-ready
        enableTemplateParameters: true
        templateParameters: *acsParams

      # @description: Lets the secured policy's hub templates read the CRS and Central's Route
      - name: hub-access
        enabled: true
        description: "ServiceAccount and RBAC for the secured policy's hub templates"
        policyRef: central
        remediationAction: enforce
        severity: high
        templateNames:
          - name: acs-hub-sa
          - name: acs-hub-role
            complianceType: mustonlyhave
          - name: acs-hub-rolebinding
        enableTemplateParameters: true
        templateParameters: *acsParams

      # @description: The CRS copied down from the hub, then the SecuredCluster itself
      - name: tls
        enabled: true
        description: "Cluster registration secret from the hub"
        policyRef: secured
        complianceType: musthave
        remediationAction: enforce
        severity: high
        templateNames:
          - name: acs-namespace
          - name: acs-sync-crs
        enableTemplateParameters: true
        templateParameters: *acsParams

      - name: agents
        enabled: true
        description: "SecuredCluster agents"
        policyRef: secured
        complianceType: musthave
        remediationAction: enforce
        severity: high
        waitForOperator: acs
        # @desc: The CRS must exist before sensor can register
        extraDependencies:
          - name: tls
        ignorePending: true
        templateNames:
          - name: acs-secured-cluster
        enableTemplateParameters: true
        templateParameters: *acsParams

      - name: agents-ready
        enabled: true
        description: "SecuredCluster readiness"
        policyRef: secured
        complianceType: musthave
        remediationAction: inform
        severity: medium
        templateNames:
          - name: acs-secured-ready
          - name: acs-sensor-ready
        enableTemplateParameters: true
        templateParameters: *acsParams

      - name: console
        enabled: true
        description: "Console link to Central"
        policyRef: central
        complianceType: musthave
        remediationAction: enforce
        severity: low
        templateNames:
          - name: acs-console-link
        enableTemplateParameters: true
        templateParameters: *acsParams
