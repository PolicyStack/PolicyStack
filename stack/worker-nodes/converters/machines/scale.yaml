{{- /*
Scales and resizes the installer-created worker MachineSets; it does not create new ones. Each
matching MachineSet is patched, which covers AWS (one per AZ) and vSphere (one per failure domain).

Only configured fields are patched; unset values keep the installer's choice.
*/ -}}
{{- $cfg := .Config }}
{{ "{{" }}- $infraId := (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName {{ "}}" }}
{{ "{{" }}- range (lookup "machine.openshift.io/v1beta1" "MachineSet" "openshift-machine-api" "").items {{ "}}" }}
{{ "{{" }}- if hasPrefix (printf "%s-worker" $infraId) .metadata.name {{ "}}" }}
- complianceType: musthave
  objectDefinition:
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineSet
    metadata:
      name: {{ "{{" }} .metadata.name {{ "}}" }}
      namespace: openshift-machine-api
    spec:
      deletePolicy: Oldest
      {{- if $cfg.replicas }}
      replicas: {{ $cfg.replicas }}
      {{- end }}
      {{- if or $cfg.instanceType (or $cfg.numCPUs (or $cfg.memoryMiB $cfg.numCoresPerSocket)) }}
      template:
        spec:
          providerSpec:
            value:
              {{- with $cfg.instanceType }}
              instanceType: {{ . }}
              {{- end }}
              {{- with $cfg.numCPUs }}
              numCPUs: {{ . }}
              {{- end }}
              {{- with $cfg.numCoresPerSocket }}
              numCoresPerSocket: {{ . }}
              {{- end }}
              {{- with $cfg.memoryMiB }}
              memoryMiB: {{ . }}
              {{- end }}
      {{- end }}
{{ "{{" }}- end {{ "}}" }}
{{ "{{" }}- end {{ "}}" }}
