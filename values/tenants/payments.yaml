# Values for clusters that host the payments tenant. A custom layer: any file under values/ can be
# listed in a fleet file's valueFiles. List it after the environment, datacenter and platform files
# to layer it above them; values/clusters/ always loads last:
#   valueFiles:
#     - environments/prod.yaml
#     - tenants/payments.yaml
stack:
  # teamGitops needs the ArgoCD CRD from the GitOps operator on the same cluster. The platform ArgoCD
  # instance is not needed for that, so only the operator is installed. ca-bundle and link configure
  # that instance, so they go off with it; link would otherwise wait on it indefinitely.
  gitops:
    enabled: true
    toggles:
      instance: false
      ca-bundle: false
      link: false

  # A team ArgoCD in openshift-gitops-payments. teams is a map, so a cluster file can add more teams
  # without restating this one.
  teamGitops:
    enabled: true
    config:
      teams:
        payments:
          rbacPolicies:
            - "g, payments-admins, role:admin"
