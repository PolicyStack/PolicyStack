{{- /*
L2Advertisement objects, one per entry in config.l2Advertisements. The key is the object name and
the value is the spec verbatim, so addressing stays reviewable in values.

Object count follows the map, hence a raw list.
*/ -}}
{{- range $name, $spec := .Config.l2Advertisements }}
- complianceType: mustonlyhave
  objectDefinition:
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: {{ $name }}
      namespace: metallb-system
    spec:{{ toYaml $spec | nindent 6 }}
{{- end }}
