stack:
  partitioning:
    enabled: false

    # Profile CPU layout. reservedCpus and isolatedCpus are node-specific and must be set.
    config:
      # CPUs reserved for platform/infrastructure workloads, e.g. "0-1"
      reservedCpus: ""
      # CPUs left isolated for application workloads, e.g. "2-31"
      isolatedCpus: ""
      # Nodes the profile applies to. Defaults to control-plane nodes.
      nodeSelector: {}
      # MachineConfigPool the profile applies to. Defaults to nodeSelector, then master.
      machineConfigPoolSelector: {}
      # Kubelet NUMA topology policy, e.g. single-numa-node
      numaTopologyPolicy: ""
      # Install the real-time kernel
      realTimeKernel: false
      # Disable IRQ load balancing across the isolated set
      globallyDisableIrqLoadBalancing: false
      # Hugepage allocation, e.g. {defaultSize: 1G, pages: [{size: 1G, count: 4}]}
      hugepages: {}

    default:
      remediationAction: enforce
      severity: medium
      categories:
        - CM Configuration Management
      controls:
        - CM-2 Baseline Configuration
      standards:
        - NIST SP 800-53

    policies:
      config:
        description: "Workload partitioning PerformanceProfile"
        templates:
          performance-profile:
            description: "PerformanceProfile for workload partitioning"
