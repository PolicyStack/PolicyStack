{{- /*
Applies the ComplianceRemediations named in config.autoRemediate.

The list lives in values, not an out-of-band ConfigMap, so it is diffable, reviewable and
overridable per cluster.

Object count follows the list length, hence rawTemplate.
*/ -}}
{{- $cfg := .Values.stack.compliance.config }}
{{- range $r := $cfg.autoRemediate }}
- complianceType: musthave
  objectDefinition:
    apiVersion: compliance.openshift.io/v1alpha1
    kind: ComplianceRemediation
    metadata:
      name: {{ $r }}
      namespace: {{ $.Parameters.namespace }}
    spec:
      apply: true
{{- end }}
