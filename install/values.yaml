# The repository Argo CD reads: yours. Required, set once at install.
gitRepo: ""
# Names this hub's fleet file, fleet/hubs/<hubName>.yaml. Required, set once at install, unique per active hub reading gitRepo.
hubName: ""
# Must equal policyNamespace in the root values.yaml, which the elements read. CI checks it.
policyNamespace: pstack
# Name of the Argo CD repository Secret in openshift-gitops that holds gitRepo's credentials. Set it
# for a private repository: child hubs get a copy under the same name. Set once at install.
repoSecret: ""
# Set by the parent hub's Policy on a Global Hub child. Leave empty.
parent: ""
