{{- /*
Image registry Config. The storage backend is a value; its location (NooBaa route host, bucket
name) is discovered on the managed cluster.
*/ -}}
{{- $cfg := .Config }}
apiVersion: imageregistry.operator.openshift.io/v1
kind: Config
metadata:
  name: cluster
spec:
  managementState: {{ $cfg.managementState }}
  replicas: {{ $cfg.replicas }}
  rolloutStrategy: {{ $cfg.rolloutStrategy }}
  logLevel: Normal
  operatorLogLevel: Normal
  requests:
    read:
      maxWaitInQueue: 0s
    write:
      maxWaitInQueue: 0s
  storage:
    {{- if eq $cfg.storageType "pvc" }}
    managementState: Managed
    pvc:
      claim: image-registry-storage
    {{- else if eq $cfg.storageType "s3" }}
    managementState: Unmanaged
    s3:
      region: {{ $cfg.s3.region }}
      virtualHostedStyle: false
      encrypt: false
      bucket: '{{ "{{" }} fromConfigMap "openshift-image-registry" "image-registry-storage" "BUCKET_NAME" {{ "}}" }}'
      # The NooBaa route host when the route exists, else the bucket's in-cluster endpoint
      regionEndpoint: '{{ "{{" }} with ((lookup "route.openshift.io/v1" "Route" "openshift-storage" "s3").spec | default dict).host {{ "}}" }}https://{{ "{{" }} . {{ "}}" }}{{ "{{" }} else {{ "}}" }}https://{{ "{{" }} fromConfigMap "openshift-image-registry" "image-registry-storage" "BUCKET_HOST" {{ "}}" }}:{{ "{{" }} fromConfigMap "openshift-image-registry" "image-registry-storage" "BUCKET_PORT" {{ "}}" }}{{ "{{" }} end {{ "}}" }}'
      trustedCA:
        name: image-registry-s3-bundle
    {{- end }}
